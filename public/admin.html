<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>管理后台 · 云音乐</title>
<!--
  管理后台是**独立页面**，不复用 index.html 那套 SPA。

  为什么不放在 #/admin 里：那样管理代码会跟着用户端一起被下载和解析，
  「用户端仅仅是用户端」就成了一句口号。而且 SPA 的登录态是给听歌用的，
  管理端要独立判权限，混在一起最容易出的问题就是「界面藏了、接口还能调」。

  这里只引 util.js（通用工具）与 api.js（接口客户端），不引 player/app/native。
-->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="stylesheet" href="/css/app.css">
<style>
  /*
    必须先解掉 app.css 的两条全局规则：

      html, body { height: 100% }     ← 43 行
      body { overflow: hidden }       ← 57 行

    那两条是为**用户端**写的 —— 用户端是一屏固定的壳（页面本身不滚，滚动条在
    「列表 / 歌词 / 抽屉」这些内层容器里）。但本页也引了同一份 app.css，
    于是管理后台被一起钉死：内容超过一屏的部分既不显示、也拉不动，
    看起来就像「下面的内容没有了 / 不知道怎么往下拖」，把浏览器缩放调小才露出来。
    管理后台是**文档流**页面（侧栏 + 内容往下排），必须交还滚动能力。
  */
  html { height: auto; }
  body.admin { height: auto; overflow: visible; }

  body.admin { background: var(--bg); }
  .admin-shell { display: flex; min-height: 100vh; align-items: stretch; }
  .admin-side {
    width: 196px; flex: 0 0 auto; background: #fff;
    border-right: 1px solid var(--line); padding: 18px 10px;
  }
  .admin-brand { font-size: 15px; font-weight: 700; padding: 0 12px 14px; }
  .admin-brand small { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
  .admin-nav { display: flex; flex-direction: column; gap: 2px; }
  .admin-nav__item {
    padding: 9px 12px; border-radius: 8px; font-size: 14px;
    color: var(--text-2); cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 8px;
  }
  .admin-nav__item:hover { background: var(--surface-2); }
  .admin-nav__item.is-active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .admin-nav__item svg { width: 17px; height: 17px; flex: 0 0 auto; }
  .admin-main { flex: 1 1 auto; min-width: 0; padding: 20px 22px 60px; max-width: 920px; }
  .admin-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .admin-head h1 { font-size: 19px; font-weight: 700; flex: 1 1 auto; }
  .admin-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .admin-kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .admin-kpi__n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .admin-kpi__l { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .admin-login { max-width: 340px; margin: 12vh auto 0; padding: 0 18px; }
  .admin-login h1 { font-size: 21px; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .admin-login p { text-align: center; font-size: 12.5px; color: var(--text-3); margin-bottom: 22px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th { text-align: left; font-weight: 600; font-size: 12px; color: var(--text-3); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .admin-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .admin-table tr:last-child td { border-bottom: 0; }
  .admin-table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .admin-empty { padding: 26px 10px; text-align: center; font-size: 13px; color: var(--text-3); }
  .admin-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---- 默认搜索源：可拖动排序的列表 ---- */
  .srclist { display: flex; flex-direction: column; }
  /* 拖动期间禁掉文字选择，否则手机上手指划过会触发选中/长按菜单 */
  .srclist.is-sorting { user-select: none; -webkit-user-select: none; }
  .srcrow {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 6px; border-bottom: 1px solid var(--line);
    background: #fff; position: relative;
  }
  .srcrow:last-child { border-bottom: 0; }
  .srclist.is-sorting .srcrow { transition: transform .12s ease; }
  .srcrow.is-dragging {
    transition: none; z-index: 6; border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .16); border-bottom-color: transparent;
  }
  /* touch-action:none 是必需的：不加的话手指一按就开始滚页面，根本收不到 pointermove */
  .srcrow__grip {
    flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center;
    color: var(--text-3); cursor: grab; touch-action: none;
    border-radius: 6px; background: var(--surface-2);
  }
  .srcrow__grip:active { cursor: grabbing; color: var(--text-2); }
  .srcrow__grip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .srcrow__no {
    flex: 0 0 16px; text-align: right; font-size: 12px; color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .srcrow__name {
    flex: 1 1 auto; min-width: 0; font-size: 13.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* ---- 保存条：拖动只改界面，顺序靠这个按钮提交 ---- */
  .srcfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
  }
  .srcfoot__state { font-size: 12.5px; color: var(--text-3); min-width: 0; }
  /* 有未保存改动时用暖色，扫一眼就能看见「还没提交」 */
  .srcfoot__state.is-dirty { color: #b26a00; font-weight: 600; }
  .srcfoot .btn { flex: 0 0 auto; }
  @media (max-width: 520px) {
    .srcfoot { flex-direction: column; align-items: stretch; }
    .srcfoot .btn { width: 100%; }
  }
  @media (max-width: 720px) {
    .admin-shell { flex-direction: column; }
    .admin-side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 10px 8px; }
    .admin-brand { padding-bottom: 8px; }
    .admin-nav { flex-direction: row; overflow-x: auto; gap: 6px; }
    .admin-nav__item { white-space: nowrap; padding: 7px 11px; }
    .admin-main { padding: 14px 12px 60px; max-width: none; }
  }
</style>
</head>
<body class="admin">

<div id="adminRoot"></div>

<script src="/js/util.js"></script>
<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
