name = "lxmusic"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 自定义域名（workers.dev 在国内 DNS 被污染，必须绑自有域名）
#
# ⚠ 必须放在任何 [table] 头**之前**：TOML 里一旦出现 `[triggers]` 这样的 table 头，
#    它下面直到下一个 table 头为止的所有键都归属那个 table。routes 写在 [triggers]
#    后面会被解析成 `triggers.routes`，wrangler 只报一句
#    `Unexpected fields found in triggers field: "routes"` 然后**静默忽略**，
#    结果 Worker 部署成功、自定义域名却没绑上（workers.dev 在国内又被污染）。
#
# ⚠ 这里每次 deploy 都会报一条 code 100117 的 ERROR，**属预期、无害**：
#    该域名在 dpdns.org 侧已经有一条外部管理的 CNAME
#    （music.zyplnn.dpdns.org → dszzlnn.cf.090227.xyz → cloudflare），
#    CF 因此拒绝把它登记成「custom domain」。但请求照样能到 Worker ——
#    实测 `curl https://music.zyplnn.dpdns.org/api/version` 返回
#    {"ok":true,"app":"lxmusic","version":"V2.7",...}，与 workers.dev 一致。
#    保留这段配置是为了留下「这个域名归这个 Worker」的意图声明。
routes = [
  { pattern = "music.zyplnn.dpdns.org", custom_domain = true }
]

# 每日推荐定时生成：UTC 22:00 = 北京时间 06:00（CF cron 只认 UTC）。
# 生成逻辑见 src/index.js 的 scheduled；手动刷新走 POST /api/daily/refresh。
[triggers]
crons = ["0 22 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lxmusic-db"
database_id = "cf13afc2-2c37-4a5c-a2fb-647ae70ebfe3"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[vars]
# 综合搜索 / 首页推荐 / AI 匹配默认用哪些源。
# 加 xm（喜马拉雅）的原因：它是唯一的有声书/播客平台，实测 CF 出口 200 / ~1.1s，
# 不带上它「综合搜索」就等于搜不到有声内容，用户只能手动切平台。
# 实测各平台单独搜索的耗时都远低于 7s 硬超时，多带一个不拖慢整体（并发跑的）。
# 管理员也可以在「音源与插件 -> 默认搜索源」里改（写 D1，优先级高于这里）。
DEFAULT_SOURCES = "kg,wy,kw,tx,xm"

# 会话签名密钥（用于 PWA 登录态、Subsonic 代理）
SESSION_SECRET = "e43ca2621ae9502323f09cb7f504aa9c3e6405d5fb76dc5c"

# —— AI 歌单（可选，也可在管理后台「设置」里填，走 D1 settings，优先级更高）——
# provider: qwen（阿里云百炼，默认）| openai | cloudflare（CF Workers AI）| 自定义
# baseURL / model 严格跟随 provider 内置默认（qwen→dashscope，openai→api.openai.com，
# cloudflare→api.cloudflare.com），如需自定义请在后台「设置」里填（写 D1 settings）。
AI_PROVIDER = "qwen"
# 填你自己的 API Key（阿里云百炼 / OpenAI / Cloudflare cfut_）；留空则走 D1 settings
AI_API_KEY = ""
# Cloudflare Workers AI 专用：账户 ID（provider=cloudflare 时必填，否则走 D1 settings）
AI_ACCOUNT_ID = ""
