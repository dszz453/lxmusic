name: yunmusic-android

# 云音乐客户端（client/，包名 com.yunmusic.app）的出包链路。
#
# ── V2.20 起这个客户端「参照 web 端重新开发」────────────────────
# 前端不再手写，改成**整包复用 public/**：assets/www 是构建时从 public/ 拷进去的，
# 只多一个客户端专属的 js/client-layer.js（跨端层，源码在 client/rn/src/）。
# 所以**改 public/ 就等于改客户端界面** —— paths 里必须同时盯着 public/，
# 否则「只改了前端、没碰客户端目录」的提交不会触发这里，CI 静默不跑。
#
# ⚠ 为什么放在**仓库根**的 .github/workflows/ 而不是 client/.github/：
#   GitHub Actions 只扫描仓库根那一层，子目录里的 workflow 文件会被完全忽略
#   （不报错，就是不跑 —— 排查起来很费时间）。
#
# 为什么测试与出包分成两个 job：测试是秒级的，出包要拉 SDK 跑 aapt2/d8。
# 测试先挂掉就不必再浪费几分钟去打包。
#
# 为什么要真出 APK 而不是只跑测试：aapt2 / d8 / apksigner 这条链路上的问题
# （资源 id 冲突、dex 方法数、签名方案、assets 缺文件）测试照不到，只有真打包才暴露。

on:
  push:
    branches: [main]
    # 只在客户端相关文件变化时触发 —— 服务端改插件清单不该顺带跑一遍安卓构建
    paths:
      - 'client/**'
      - 'public/**'
      - 'tools/build-client-rn.mjs'
      - 'tools/build-app.mjs'
      - 'test/client-wiring.test.mjs'
      - 'test/client-layer.mjs'
      - 'test/brand.test.mjs'
      - 'test/app-wiring.test.mjs'
      - 'test/boot-speed.test.mjs'
      - '.github/workflows/yunmusic-android.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 这五套是客户端相关、且**不需要安卓运行时**的（零第三方依赖，不用 npm install）：
      #   client-wiring  静态接线审计：源码里有没有写对
      #   client-layer   跨端层行为：跑起来是不是那个行为（自带极小 DOM 替身）
      #   两者互补，别只跑一个（见 docs/client-android.md）
      #   brand          品牌判定（客户端的包名/名字/版本落点也钉在这里）
      #   app-wiring     版本落点与媒体会话接线
      #   boot-speed     首屏启动速度护栏
      - name: 客户端测试
        run: |
          node test/client-wiring.test.mjs
          node test/client-layer.mjs
          node test/brand.test.mjs
          node test/app-wiring.test.mjs
          node test/boot-speed.test.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 刻意**不用** android-actions/setup-android：它会执行 `sdkmanager tools`，
      #    而 `tools` 这个包在新版 SDK 里已被移除，直接报
      #    "Warning: Failed to find package 'tools'" 然后 exit 1，整个 job 挂掉。
      #    GitHub 的 ubuntu runner 本来就预装了 Android SDK
      #    （ANDROID_HOME=/usr/local/lib/android/sdk），只补装缺的那两个包即可。
      - name: 补装 SDK 组件
        run: |
          SM=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          echo "sdkmanager = $SM"
          if [ -z "$SM" ]; then echo "找不到 sdkmanager"; exit 1; fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "build-tools;34.0.0" "platforms;android-34"

      - name: 构建 APK
        # build-client.sh 默认去仓库的 android-build/ 找便携工具链（本地开发布局，
        # CI 上没有），所以这里把四个路径显式指到 setup-java / 预装 SDK 的位置。
        # 版本号由脚本自己从 client/version.mjs 读；读不到它会直接中止，
        # 不会像以前那样悄悄退回一个装不上的 versionCode。
        #
        # ⚠ PLATFORM 的契约是 **android.jar 的完整路径**，不是 platforms/android-34
        #   这个目录（脚本里 `[ -f "$PLAT" ]` 校验的是文件）。早先这里漏了尾巴，
        #   症状是 job 一开始就 `缺 android.jar: …/platforms/android-34` 退出 1，
        #   而 sdkmanager 那步明明装成功了 —— 很容易误以为是 SDK 没装好。
        run: |
          export JDK_DIR="$JAVA_HOME"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          export PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          export OUT_DIR="$PWD/client/build"
          bash client/build-client.sh

      - name: 汇总产物信息
        run: |
          apk=$(ls outputs/*.apk | head -1)
          echo "产物：$apk"
          echo "大小：$(du -h "$apk" | cut -f1)"
          echo "sha256：$(sha256sum "$apk" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$apk" \
            | grep -E "^package|^application-label|^launchable-activity" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: yunmusic-apk
          path: outputs/*.apk
          if-no-files-found: error
