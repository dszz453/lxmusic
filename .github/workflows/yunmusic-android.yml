name: yunmusic-android

# 云音乐安卓客户端（yunmusic-client/）的出包链路。
#
# ⚠ 为什么放在**仓库根**的 .github/workflows/ 而不是 yunmusic-client/.github/：
#    GitHub Actions 只扫描仓库根那一层，子目录里的 workflow 文件会被完全忽略
#    （不报错，就是不跑 —— 排查起来很费时间）。所以这里必须放根目录，
#    再用 working-directory / paths 把作用域收回到 yunmusic-client。
#
# 为什么要跑自测再打包：yunmusic-client/assets/web/index.html 是约 20 万字符的
# 单文件前端，改一处布局很容易把别处带崩（比如删掉 `.player__src` 那条 CSS 规则后，
# 依赖它的断言要同步改）。smoke.js 有 400+ 条断言，几秒就跑完，比装到手机上肉眼验收快。
#
# 为什么要真出 APK 而不是只跑测试：aapt2 / d8 / apksigner 这条链路上的问题
# （资源 id 冲突、dex 方法数、签名方案）测试照不到，只有真打包才暴露。

on:
  push:
    branches: [main]
    # 只在客户端相关文件变化时触发 —— 服务端改插件清单不该顺带跑一遍安卓构建
    paths:
      - 'yunmusic-client/**'
      - '.github/workflows/yunmusic-android.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yunmusic-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ⚠ yunmusic-client/ 必须有自己的 package.json。
      #    否则 npm 会**向上**找到仓库根那份（lxmusic-cf），连带去装 wrangler 的
      #    @cloudflare/workerd-windows-64 —— 那是 Windows 专用包，在 Linux 上直接
      #    EBADPLATFORM 挂掉，报错信息完全指不到真正的原因（实测踩过）。
      - name: 装测试依赖
        run: npm install --no-audit --no-fund

      - name: 前端自测（smoke.js）
        run: node test/smoke.js

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yunmusic-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 刻意**不用** android-actions/setup-android：它会执行 `sdkmanager tools`，
      #    而 `tools` 这个包在新版 SDK 里已被移除，直接报
      #    "Warning: Failed to find package 'tools'" 然后 exit 1，整个 job 挂掉。
      #    GitHub 的 ubuntu runner 本来就预装了 Android SDK
      #    （ANDROID_HOME=/usr/local/lib/android/sdk），只补装缺的那两个包即可。
      - name: 补装 SDK 组件
        run: |
          SM=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          echo "sdkmanager = $SM"
          if [ -z "$SM" ]; then echo "找不到 sdkmanager"; exit 1; fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "build-tools;34.0.0" "platforms;android-34"

      - name: 构建 APK
        # build.sh 默认去同级 repo_extracted/ 找便携工具链（那是本地开发布局，
        # CI 上没有），所以这里把四个路径显式指到 setup-java / 预装 SDK 的位置。
        run: |
          export JDK_DIR="$JAVA_HOME"
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          export PLATFORM="$ANDROID_HOME/platforms/android-34"
          export OUTPUT_DIR="$PWD/outputs"
          bash build.sh

      - name: 汇总产物信息
        run: |
          apk=$(ls outputs/*.apk | head -1)
          echo "产物：$apk"
          echo "大小：$(du -h "$apk" | cut -f1)"
          echo "sha256：$(sha256sum "$apk" | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: yunmusic-apk
          path: yunmusic-client/outputs/*.apk
          if-no-files-found: error
