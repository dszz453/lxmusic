        return plainRow(s, i, currentSong() && currentSong().id === s.id)
      }).join('') + '</div>'

    bindPlayAll(box, songs)
    bindRichRows($('#aiList'), songs)
  }

  /* ============================ 搜索页 ============================ */
  var PLATFORMS = [
    { key: '', name: '综合' },
    { key: 'wy', name: '网易' },
    { key: 'kg', name: '酷狗' },
    { key: 'kw', name: '酷我' },
    { key: 'tx', name: 'QQ' },
    { key: 'mg', name: '咪咕' },
    { key: 'xm', name: '喜马' }
  ]
  // source 代号 → 平台短名。搜索结果里同一张专辑可能在多个平台都有
  // （实测「李哪吒上学记」在酷狗 / 网易 / QQ 都搜得到），不标平台就分不出该点哪个。
  var PLATFORM_SHORT = {}
  PLATFORMS.forEach(function (p) { if (p.key) PLATFORM_SHORT[p.key] = p.name })
  var searchState = { q: '', source: '', type: 'song', page: 1, total: 0, loading: false, list: [] }
  var HISTORY_KEY = 'ym.searchHistory'

  /*
   * 把搜索态拼成 hash —— source / type 一律跟着状态走，避免切一次平台就丢一次类型。
   *
   * ⚠ 关键词**必须进 URL**。搜索结果页的 hash 里带着 q，从专辑详情按返回键
   *    才能回到「同一个搜索结果」；不带 q 的话回去的是 `#/search` 空白页，
   *    用户看到的就是「返回后搜索结果没有了」。
   *    网页版（public/js/app.js 的 searchHash）就是这么做的，这里对齐它。
   */
  function searchHash(q, source, type) {
    return '#/search?q=' + encodeURIComponent(q || '')
      + (source ? '&source=' + encodeURIComponent(source) : '')
      + (type === 'album' ? '&type=album' : '')
  }

  function pageSearch(r, myToken) {
    var initQ = r.q.get('q') || ''
    var initType = r.q.get('type') === 'album' ? 'album' : 'song'
    var initSrc = r.q.get('source') || ''
    searchState = { q: initQ, source: initSrc, type: initType, page: 1, total: 0, loading: false, list: [] }

    view.innerHTML =
      '<div class="searchbar">' +
        '<button class="icon-btn searchbar__back" id="searchBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
        '<input class="searchbar__input" id="searchInput" placeholder="搜索歌曲、歌手、专辑" value="' + esc(initQ) + '">' +
        '<button class="searchbar__btn" id="searchGo">搜索</button>' +
      '</div>' +
      '<div class="chips chips--scroll" id="typeChips">' +
        '<span class="chip' + (initType === 'song' ? ' is-active' : '') + '" data-type="song">单曲</span>' +
        '<span class="chip' + (initType === 'album' ? ' is-active' : '') + '" data-type="album">专辑</span>' +
      '</div>' +
      '<div class="chips chips--scroll" id="srcChips">' +
        PLATFORMS.map(function (p) {
          return '<span class="chip' + (p.key === initSrc ? ' is-active' : '') + '" data-src="' + p.key + '">' + esc(p.name) + '</span>'
        }).join('') +
      '</div>' +
      '<div id="searchBody"></div>'

    $('#searchBack').addEventListener('click', function () { history.back() })
    var input = $('#searchInput')
    $('#searchGo').addEventListener('click', doSearch)
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { input.blur(); doSearch() } })

    /*
     * 切类型 / 切平台一律**改 hash**，由 route 重新渲染整页。
     *
     * 这么做的关键收益是「返回键」：每次搜索、每次切换都会在 history 里留下
     * 一条带 q 的记录，从专辑详情退回来时能精确回到那一份结果。
     * 以前是「就地改 searchState + 重画」，hash 不动 → history 里没有搜索结果
     * 这一站 → 返回时直接掉回 `#/search` 空白页。
     * 顺带的好处：chips 的选中态由 hash 重建，不用手工维护 is-active。
     */
    $('#typeChips').addEventListener('click', function (e) {
      var c = e.target.closest('.chip'); if (!c) return
      if (c.dataset.type === searchState.type) return
      location.hash = searchHash(searchState.q, searchState.source, c.dataset.type)
    })
    $('#srcChips').addEventListener('click', function (e) {
      var c = e.target.closest('.chip'); if (!c) return
      if (c.dataset.src === searchState.source) return
      location.hash = searchHash(searchState.q, c.dataset.src, searchState.type)
    })

    // 从 hash 直接渲染结果（doSearch 已经把关键词写进 hash 了，
    // 这里再调 doSearch 会因为「同 hash 不触发 hashchange」而什么都不发生）
    if (initQ) runSearch(); else renderSearchIdle()
  }

  function renderSearchIdle() {
    var hist = store.get(HISTORY_KEY, []) || []
    var body = $('#searchBody')
    if (!hist.length) {
      body.innerHTML = emptyBlock('搜索海量曲库', '支持网易 / 酷狗 / 酷我 / QQ / 咪咕 / 喜马拉雅')
      return
    }
    body.innerHTML = '<div class="section" style="padding-top:12px">' + sectionHead('搜索历史',
      '<button class="section__more" id="clearHist">清空</button>') + '</div>' +
      '<div class="chips">' + hist.map(function (h) {
        return '<span class="chip--del" data-h="' + esc(h) + '"><span>' + esc(h) + '</span>' +
          '<button class="chip__del" data-hdel="' + esc(h) + '">✕</button></span>'
      }).join('') + '</div>'

    $('#clearHist').addEventListener('click', function () {
      store.del(HISTORY_KEY); renderSearchIdle()
    })
    $$('[data-h]', body).forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-hdel]')) return
        $('#searchInput').value = el.dataset.h
        doSearch()
      })
    })
    $$('[data-hdel]', body).forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation()
        var hist2 = (store.get(HISTORY_KEY, []) || []).filter(function (x) { return x !== el.dataset.hdel })
        store.set(HISTORY_KEY, hist2); renderSearchIdle()
      })
    })
  }

  function pushSearchHistory(q) {
    if (!q) return
    var hist = (store.get(HISTORY_KEY, []) || []).filter(function (x) { return x !== q })
    hist.unshift(q)
    store.set(HISTORY_KEY, hist.slice(0, 12))
  }

  /*
   * 「搜索」只做一件事：把关键词写进 hash，渲染交给 route。
   *
   * ⚠ 不要在这里直接 runSearch()。那样 hash 不动 → history 里就没有
   *   「搜索结果」这一站 → 点开专辑再按返回，掉回的是 `#/search` 空白页，
   *   用户看到的就是「搜索结果没有了」。
   *   写进 hash 之后，返回键能精确回到那一份结果（网页版同此口径）。
   *
   * keyword 只在「点搜索历史」这类内部调用时传；DOM 事件监听器会把 Event
   * 当第一个参数塞进来，所以必须判类型，不能只判 undefined。
   */
  function doSearch(keyword) {
    var input = $('#searchInput')
    var q = (typeof keyword === 'string' ? keyword : (input && input.value) || '').trim()
    if (!q) { toast('请输入搜索关键词'); return }
    pushSearchHistory(q)
    location.hash = searchHash(q, searchState.source, searchState.type)
  }

  function runSearch() {
    var body = $('#searchBody')
    body.innerHTML = loadingBlock('正在跨源检索…')
    searchState.loading = true
    var path = searchState.type === 'album' ? '/search-albums' : '/search'
    var url = path + '?q=' + encodeURIComponent(searchState.q) +
      '&page=' + searchState.page + '&limit=30' +
      (searchState.source ? '&source=' + searchState.source : '')

    api(url).then(function (data) {
      searchState.loading = false
      searchState.list = data.list || []
      searchState.total = data.total || searchState.list.length
      renderSearchResult(data)
    }).catch(function (e) {
      searchState.loading = false
      body.innerHTML = errorBlock(e.message) + renderSearchErr(e)
    })
  }

  function renderSearchErr(e) {
    var raw = e && e.data ? JSON.stringify(e.data, null, 2) : ''
    if (!raw) return ''
    return '<details class="errdetail"><summary>查看诊断信息</summary><pre class="errdetail__raw">' + esc(raw) + '</pre></details>'
  }

  function renderSearchResult(data) {
    var body = $('#searchBody')
    var list = data.list || []
    if (!list.length) {
      body.innerHTML = emptyBlock('没有找到匹配结果', '换个关键词或切换平台试试')
      return
    }
    if (searchState.type === 'album') {
      body.innerHTML = '<div class="grid3" style="padding-top:6px">' + list.map(function (a) {
        var href = '#/album?source=' + encodeURIComponent(a.source || '') + '&id=' + encodeURIComponent(a.id || '')
        /*
         * 封面角标显示「N 首」—— 与网页版 albumCard 一致。
         *
         * 专辑卡片上一眼看不出「这张有多少集」，而同一张专辑往往在多个平台都有
         * （实测「李哪吒上学记」在酷狗 / 网易 / QQ 都能搜到），没有这个数字
         * 就完全分不出该点哪个。副标题补上平台短名，理由相同。
         * 角标与右下角的播放按钮是两个不同的 class（badge 在右上、play 在右下），
         * 可以共存 —— 榜单卡片本来就是这么排的。
         */
        var sub = [a.singer, PLATFORM_SHORT[a.source] || a.source].filter(Boolean).join(' · ')
        return '<a class="card" href="' + esc(href) + '">' +
          '<div class="card__cover"><img src="' + esc(coverSrc(a.img, 300)) + '" alt="">' +
          (a.trackCount ? '<span class="card__badge">' + a.trackCount + ' 首</span>' : '') +
          '<span class="card__badge card__badge--play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg></span></div>' +
          '<div class="card__title">' + esc(a.name || '') + '</div>' +
          '<div class="card__sub">' + esc(sub) + '</div></a>'
      }).join('') + '</div>'
      $$('.card__cover img').forEach(imgFallback)
      return
    }
    body.innerHTML = '<div class="songlist" id="srList">' + list.map(function (s, i) {
      return songRow(s, i, currentSong() && currentSong().id === s.id)
    }).join('') + '</div>'
    bindRichRows($('#srList'), list)
  }

  /* ============================ 排行榜 ============================ */

    bindBack()

      var list = data.list || []
      var box = $('#chartsBody')

      box.innerHTML = '<div class="grid3" style="padding-top:6px">' + list.map(chartCard).join('') + '</div>'
      $$('.card__cover img').forEach(imgFallback)
      upgradeChartCovers(list)

  /* ============================ 榜单详情 ============================ */
  function pageChart(r, myToken) {

    var id = r.q.get('id') || ''

                (head.artist ? '<br>#1 ' + esc(head.artist) + (head.song ? ' · ' + esc(head.song) : '') : '') + '</div>' +
              '<div class="detailhero__acts">' + playAllBtn(list) + '</div>' +

  /* ============================ 专辑详情 ============================ */
  function pageAlbum(r, myToken) {
    var source = r.q.get('source') || ''
    var id = r.q.get('id') || ''
    view.innerHTML = pageHeadHtml('专辑') + '<div id="albumBody">' + skeleton(6) + '</div>'
    bindBack()
    if (!source || !id) { $('#albumBody').innerHTML = emptyBlock('缺少专辑参数'); return }

    api('/album?source=' + encodeURIComponent(source) + '&id=' + encodeURIComponent(id) + '&limit=200')
      .then(function (data) {
        if (myToken !== routeToken) return
        /*
         * ⚠ 服务端 `/album` 的返回是**嵌套**的，曲目在 `album.songs` 里：
         *
         *   { ok: true, album: { source, sourceId, name, cover, total, songs: [...] } }
         *
         * 以前这里读的是**顶层** `data.list` / `data.songs` —— 两个都不存在，
         * 于是恒为 `[]`：界面显示「共 0 首」+ 空列表，看着就像这张专辑没有资源。
         * 但服务端其实返回了 200 和完整曲目（真的没曲目时它会回 404
         * 「该专辑没有可用曲目」，而不是 200），所以「能渲染出 0 首」本身就是判据。
         *
         * 以 `album.songs` 为准；顶层那两个只作兼容兜底（老版本 / 其它宿主）。
         */
        var info = data.album || {}
        var list = info.songs || data.list || data.songs || []
        var cover = info.cover || info.img || (list[0] && list[0].img) || ''
        $('.pagehead__title').textContent = info.name || '专辑'
        $('#albumBody').innerHTML =
          '<div class="detailhero">' +
            '<div class="detailhero__cover"><img src="' + esc(coverSrc(cover, 300)) + '" alt=""></div>' +
            '<div class="detailhero__info">' +
              '<div class="detailhero__name">' + esc(info.name || '专辑') + '</div>' +
              '<div class="detailhero__desc">' + esc(info.singer || '') + '<br>共 ' + list.length + ' 首</div>' +
              '<div class="detailhero__acts">' + playAllBtn(list) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="songlist" id="albumList">' + list.map(function (s, i) {
            return plainRow(s, i, false)
          }).join('') + '</div>'
        $$('.detailhero__cover img').forEach(imgFallback)
        bindPlayAll($('#albumBody'), list)
        bindRichRows($('#albumList'), list)
      }).catch(function (e) {
        if (myToken !== routeToken) return
        $('#albumBody').innerHTML = errorBlock(e.message)
      })
  }

  /* ============================ 我的歌单 ============================ */
  function pageLibrary(r, myToken) {
    view.innerHTML =
      '<div class="pagehead"><div class="pagehead__title">我的歌单</div>' +
        '<button class="icon-btn" id="plImport" aria-label="导入"><svg viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M11 7l1.6-1.6a3.5 3.5 0 0 1 5 5L16 12"/><path d="M13 17l-1.6 1.6a3.5 3.5 0 0 1-5-5L8 12"/></svg></button>' +
        '<button class="icon-btn" id="plNew" aria-label="新建"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>' +
      '</div>' +
      '<div id="libBody">' + skeleton(4) + '</div>'

    $('#plNew').addEventListener('click', createPlaylist)
    $('#plImport').addEventListener('click', importPlaylist)

    loadPlaylists(myToken, true)
  }

  /**
   * 歌单曲目数。
   *
   * 服务端 `/api/playlists` 返回的字段名是 **`song_count`**（SQL 里 COUNT(*) 的别名），
   * 不是 `count`；`/api/playlist?id=` 那边则直接带 `songs` 数组。
   * 早先只读 `count`，于是列表里每个歌单都显示「0 首」—— 看起来就像歌曲全丢了。
   */
  function songCountOf(pl) {
    if (!pl) return 0
    if (typeof pl.song_count === 'number') return pl.song_count
    if (typeof pl.songCount === 'number') return pl.songCount
    if (typeof pl.count === 'number') return pl.count
    if (pl.songs && pl.songs.length) return pl.songs.length
    return 0
  }

  function loadPlaylists(myToken, autoImport) {
    api('/playlists').then(function (data) {
      if (myToken !== routeToken) return
      var list = data.list || []
      var box = $('#libBody')
      if (!list.length) {
        box.innerHTML = emptyBlock('还没有歌单', '点右上角「+」新建，或导入分享链接')
        return
      }
      box.innerHTML = '<div class="songlist">' + list.map(function (pl) {
        var cover = pl.cover || (pl.songs && pl.songs[0] && pl.songs[0].img) || ''
        return '<a class="song song--rich" href="#/playlist?id=' + encodeURIComponent(pl.id) + '">' +
          '<div class="song__cover"><img src="' + esc(coverSrc(cover, 100)) + '" alt=""></div>' +
          '<div class="song__meta"><div class="song__name">' + esc(pl.name || '未命名歌单') + '</div>' +
          '<div class="song__sub">' + songCountOf(pl) + ' 首</div></div>' +
          '<div class="song__act"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div></a>'
      }).join('') + '</div>'
      $$('#libBody img').forEach(imgFallback)
    }).catch(function (e) {
      if (myToken !== routeToken) return
      $('#libBody').innerHTML = errorBlock(e.message)
    })
  }

  function createPlaylist() {
    dialog({ title: '新建歌单', input: '', placeholder: '歌单名称' }).then(function (name) {
      if (!name) return
      api('/playlist', { method: 'POST', body: { name: name } })
        .then(function () { toast('已创建'); loadPlaylists(routeToken, false) })
        .catch(function (e) { toast('创建失败：' + e.message) })
    })
  }

  function importPlaylist() {
    dialog({ title: '导入歌单', input: '', placeholder: '粘贴歌单分享链接或文本' }).then(function (val) {
      if (!val) return
      api('/playlist/import', { method: 'POST', body: { url: val }, timeout: 120000 })
        .then(function (r) {
          toast('导入成功' + (r && r.count ? '：' + r.count + ' 首' : ''))
          loadPlaylists(routeToken, false)
        })
        .catch(function (e) { toast('导入失败：' + e.message) })
    })
  }

  /* ============================ 歌单详情 ============================ */
  function pagePlaylist(r, myToken) {
    var id = r.q.get('id') || ''
    view.innerHTML = pageHeadHtml('歌单') + '<div id="plBody">' + skeleton(6) + '</div>'
    bindBack()
    if (!id) { $('#plBody').innerHTML = emptyBlock('缺少歌单参数'); return }

    api('/playlist?id=' + encodeURIComponent(id)).then(function (data) {
      if (myToken !== routeToken) return
      var pl = data.playlist || {}
      var list = pl.songs || []
      var cover = pl.cover || (list[0] && list[0].img) || ''
      $('.pagehead__title').textContent = pl.name || '歌单'

          '<div class="detailhero__cover"><img src="' + esc(coverSrc(cover, 300)) + '" alt=""></div>' +
          '<div class="detailhero__info">' +
            '<div class="detailhero__name">' + esc(pl.name || '歌单') + '</div>' +
            '<div class="detailhero__desc">共 ' + list.length + ' 首</div>' +
            '<div class="detailhero__acts">' + playAllBtn(list) +
              '<button class="miniplay-btn miniplay-btn--ghost" data-plrename="1">重命名</button>' +
              '<button class="miniplay-btn miniplay-btn--ghost" data-pldel="1">删除</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        (list.length
          ? '<div class="songlist" id="plList">' + list.map(function (s, i) {
              return plainRow(s, i, false, null, 'remove')
            }).join('') + '</div>'
          : emptyBlock('歌单还是空的', '在歌曲列表里点歌曲右侧的「＋」即可加入歌单'))

      $$('.detailhero__cover img').forEach(imgFallback)
      bindPlayAll($('#plBody'), list)
      if (list.length) bindRichRows($('#plList'), list)

      // 歌单内移除单曲：服务端按「下标」定位（remove-song 收 playlistId + index）
      $$('#plList [data-act="remove"]').forEach(function (btn) {
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation()
          var i = Number(btn.closest('.song').dataset.idx)
          var target = list[i]
          if (!target) return
          dialog({ title: '移出歌单', message: '把「' + (target.name || '') + '」从本歌单移除？', okText: '移除', danger: true })
            .then(function (ok) {
              if (!ok) return
              api('/playlist/remove-song', { method: 'POST', body: { playlistId: id, index: i } })
                .then(function () { toast('已移出歌单'); route(true) })
                .catch(function (e) { toast('移除失败：' + e.message) })
            })
        })
      })

      var rn = $('[data-plrename]')
      if (rn) rn.addEventListener('click', function () {
        dialog({ title: '重命名歌单', input: pl.name || '' }).then(function (n) {
          if (!n) return
          // 服务端参数名是 playlistId（不是 id）
          api('/playlist/rename', { method: 'POST', body: { playlistId: id, name: n } })
            .then(function () { toast('已重命名'); route(true) })
            .catch(function (e) { toast('失败：' + e.message) })
        })
      })
      var dl = $('[data-pldel]')
      if (dl) dl.addEventListener('click', function () {
        dialog({ title: '删除歌单', message: '确定删除「' + (pl.name || '') + '」？此操作不可恢复。', okText: '删除', danger: true })
          .then(function (ok) {
            if (!ok) return
            api('/playlist?id=' + encodeURIComponent(id), { method: 'DELETE' })
              .then(function () { toast('已删除'); location.hash = '#/library' })
              .catch(function (e) { toast('失败：' + e.message) })
          })
      })
    }).catch(function (e) {
      if (myToken !== routeToken) return
      $('#plBody').innerHTML = errorBlock(e.message)
    })
  }

  /* ============================ 播放历史（本地） ============================ */
  function pushHistory(song) {
    if (!song || !song.id) return
    var h = (store.get('ym.history', []) || []).filter(function (s) { return s.id !== song.id })
    h.unshift({
      id: song.id, name: song.name, singer: song.singer, albumName: song.albumName,
      img: song.img, source: song.source, sourceName: song.sourceName,
      interval: song.interval, ts: Date.now()
    })
    store.set('ym.history', h.slice(0, 100))
  }

      '<div id="histBody"></div>'
    bindBack()
    var list = store.get('ym.history', []) || []

            return '<span class="chip' + (q === P.quality ? ' is-active' : '') + '" data-q="' + q + '">' +
              ({ '128k': '标准 128k', '320k': '高清 320k', 'flac': '无损 FLAC' })[q] + '</span>'
          }).join('') + '</div></div>' +
        '<div class="field" style="margin-top:14px"><div class="field__label">歌词偏移（蓝牙耳机音画同步微调）</div>' +
          '<div class="chips" style="padding:0">' +
            '<span class="chip" id="lyrMinus">− 提前 0.2s</span>' +
            '<span class="chip" id="lyrVal">同步</span>' +
            '<span class="chip" id="lyrPlus">+ 延后 0.2s</span>' +
          '</div></div>' +
        '<button class="btn btn--ghost btn--block" id="logoutBtn" style="margin-top:8px">重新登录当前线路</button>' +

    bindBack()
    renderLineCards()
    renderCfgWarn()
    fillCfgInputs()

    $('#saveCfg').addEventListener('click', saveCfg)

  function renderSettingsLyric() {
    var v = $('#lyrVal')
    if (!v) return
    v.textContent = Math.abs(lyricDelay) < 0.001 ? '同步' : ((lyricDelay > 0 ? '+' : '') + lyricDelay.toFixed(1) + 's')
  }

  /** 当前线路缺账号密码时，在设置页顶上给一条明确的横幅，而不是让用户去猜为什么登录失败 */
  function renderCfgWarn() {
    var box = $('#cfgWarn')
    if (!box) return
    var line = cfg.active === 1 ? cfg.line2 : cfg.line1
    var miss = !line || !line.url ? '地址' : ((!line.user || !line.pass) ? '账号密码' : '')
    if (!miss) { box.innerHTML = ''; return }
    box.innerHTML = '<div class="note" style="margin-bottom:12px;color:var(--brand)">' +
      '当前线路（' + esc((line && line.name) || '未命名') + '）还没填' + miss +
      '，填写并保存后即可正常登录。</div>'
  }

  function renderLineCards() {
    var box = $('#lineCards')
    if (!box) return
    var lines = [
      { i: 0, name: cfg.line1.name, url: cfg.line1.url, ready: !!(cfg.line1.user && cfg.line1.pass) },
      { i: 1, name: cfg.line2.name, url: cfg.line2.url, ready: !!(cfg.line2.user && cfg.line2.pass) }
    ]
    box.innerHTML = lines.map(function (l) {
      var on = cfg.active === l.i
      return '<div class="linecard" style="box-shadow:none;border:1px solid ' + (on ? 'var(--brand)' : 'var(--line)') + '">' +
        '<div class="linecard__top">' +
          '<span class="linecard__dot' + (on ? ' is-on' : '') + '"></span>' +
          '<span class="linecard__name">' + esc(l.name || ('线路' + (l.i + 1))) + '</span>' +
          (on ? '<span class="pill pill--ok">当前使用</span>' : '<span class="pill">备用</span>') +
          (l.ready ? '' : '<span class="pill" style="color:var(--brand)">缺账号</span>') +
        '</div>' +
        '<div class="linecard__url">' + esc(l.url || '未配置') + '</div>' +
        '<div class="linecard__acts">' +
          '<button class="miniplay-btn' + (on ? '' : ' miniplay-btn--ghost') + '" data-switch="' + l.i + '">' +
            (on ? '已启用' : '切换到该线路') + '</button>' +
          '<button class="miniplay-btn miniplay-btn--ghost" data-test="' + l.i + '">测速</button>' +
        '</div></div>'
    }).join('')

    $$('[data-switch]', box).forEach(function (b) {
      b.addEventListener('click', function () { switchLine(Number(b.dataset.switch)) })
    })
    $$('[data-test]', box).forEach(function (b) {
      b.addEventListener('click', function () { testLine(Number(b.dataset.test), b) })
    })
  }

  function switchLine(idx) {
    if (window.YunBridge && window.YunBridge.switchLine) {
      try {
        var raw = window.YunBridge.switchLine(idx)
        if (raw) cfg = JSON.parse(raw)
      } catch (e) { /* 用本地状态兜底 */ }
    } else {
      cfg.active = idx
      cfg.activeUrl = idx === 0 ? cfg.line1.url : cfg.line2.url
      cfg.activeName = idx === 0 ? cfg.line1.name : cfg.line2.name
    }
    token = ''; store.del('ym.token')
    homeCache = null
    renderLineCards()
    fillCfgInputs()
    toast('已切换至 ' + (cfg.activeName || ('线路' + (idx + 1))))
    ensureLogin(true).catch(function () {})
    if (parseHash().path === '/settings') route(true)
    else route(true)
  }

  function testLine(idx, btn) {
    var url = idx === 0 ? $('#cfg1url').value.trim() : $('#cfg2url').value.trim()
    if (!url) return toast('请先填写地址')
    var old = btn.textContent
    btn.textContent = '测速中…'
    var t0 = Date.now()
    nativeHttp(url.replace(/\/+$/, '') + '/api/version', 'GET', {}, '', 15000)
      .then(function (res) {
        var cost = Date.now() - t0
        if (res.status >= 200 && res.status < 400) toast('连接正常 · ' + cost + 'ms')
        else toast('响应异常 HTTP ' + res.status + ' · ' + cost + 'ms')
      })
      .catch(function (e) { toast('连接失败：' + e.message) })
      .then(function () { btn.textContent = old })
  }

  function fillCfgInputs() {
    var f = function (id, v) { var el = $(id); if (el) el.value = v || '' }
    f('#cfg1url', cfg.line1 && cfg.line1.url)
    f('#cfg1user', cfg.line1 && cfg.line1.user)
    f('#cfg1pass', cfg.line1 && cfg.line1.pass)
    f('#cfg2url', cfg.line2 && cfg.line2.url)
    f('#cfg2user', cfg.line2 && cfg.line2.user)
    f('#cfg2pass', cfg.line2 && cfg.line2.pass)
  }

  function saveCfg() {
    var v1u = $('#cfg1url').value.trim(), v1n = $('#cfg1user').value.trim(), v1p = $('#cfg1pass').value.trim()
    var v2u = $('#cfg2url').value.trim(), v2n = $('#cfg2user').value.trim(), v2p = $('#cfg2pass').value.trim()
    if (!v1u && !v2u) return toast('请至少填写一条线路地址')

    if (window.YunBridge && window.YunBridge.saveDualConfig) {
      try {
        var raw = window.YunBridge.saveDualConfig(v1u, v1n, v1p, v2u, v2n, v2p, cfg.active)
        if (raw) cfg = JSON.parse(raw)
      } catch (e) { toast('保存异常：' + e.message); return }
    } else {
      cfg.line1 = { name: cfg.line1.name, url: v1u, user: v1n, pass: v1p }
      cfg.line2 = { name: cfg.line2.name, url: v2u, user: v2n, pass: v2p }
      cfg.activeUrl = cfg.active === 0 ? v1u : v2u
    }
    token = ''; store.del('ym.token'); homeCache = null
    renderLineCards()
    renderCfgWarn()
    fillCfgInputs()
    toast('双线路配置已保存并生效')
    ensureLogin(true).catch(function (e) {
      if (e && e.needSetup) toast(e.message)
    })
  }

  /* ------------------------------ 服务端版本 ------------------------------ */
  /*
   * 「关于」页要显示**服务端**版本号。
   *
   * 为什么值得占一块地方：用户报障时第一件事永远是确认双方说的是同一版
   * （「你那边是 V2.8 吗？」）。要登录、要翻后台才能看到，就白白多一轮来回。
   * 服务端 `/api/version` 是**公开接口**（见 src/server/api.js 顶部「公开接口」
   * 那段注释），所以这里不带 token 也能读。
   *
   * 为什么只如实展示、**不做**「期望版本 vs 实际版本」的不一致告警：
   * 客户端并没有「我该对接哪一版服务端」这个常量，硬造一个就得在服务端每次发版时
   * 同步抬它 —— 一旦漏抬，页面上就会挂一条**永远亮着的假警告**，比没有警告更糟
   * （用户会学会忽略它）。对不对得上交给用户自己看即可。
   *
   * 为什么**不缓存**上次读到的值：进本页是低频动作，一次 GET 的代价可以忽略；
   * 而缓存会把「远端此刻到底通不通」这件事盖住 —— 页面显示着三天前的版本号，
   * 用户却以为服务端好好的。宁可先闪一下「读取中…」，也要给一个当下的真值。
   * （网页版 public/js/app.js 的 fillVersionBlock 也是这个口径。）
   */

  /**
   * 把服务端版本这一小块画出来。`state` 取 'loading' / 'ok' / 'fail'。
   *
   * ⚠ 每次都**重新查询**元素，不复用渲染时的引用：异步回来时用户可能已经切走，
   * 那时整页 innerHTML 早被换掉，手里的节点是脱管的 —— 往里写既不报错也不显示。
   * 查不到就说明不在这一页，直接返回。
   */
  function renderSrvVer(state, data) {
    var pill = $('#srvVerPill'), desc = $('#srvVerDesc')
    if (!pill || !desc) return
    if (state === 'ok') {
      pill.className = 'pill pill--brand'
      pill.textContent = data.version || '?'
      desc.innerHTML = '构建号 ' + esc(String(data.versionCode == null ? '?' : data.versionCode)) +
        ' · 构建 ' + esc(String(data.build || 'dev')) +
        (data.host ? ' · 宿主 ' + esc(String(data.host)) : '')
    } else if (state === 'fail') {
      pill.className = 'pill pill--bad'
      pill.textContent = '读取失败'
      desc.textContent = '读取失败：' + data + '（重进本页可重试）'
    } else {
      pill.className = 'pill'
      pill.textContent = '读取中…'
      desc.textContent = '正在向远端查询版本…'
    }
  }

  function loadSrvVer(myToken) {
    renderSrvVer('loading')
    nativeHttp(apiBase() + '/api/version', 'GET', {}, '', 15000)
      .then(function (res) {
        var d = null
        try { d = JSON.parse(res.body || '{}') } catch (e) { d = null }
        if (res.status < 200 || res.status >= 300) throw new Error('HTTP ' + res.status)
        // 字段缺失要当成失败，别把 undefined 画成一个空角标 —— 那样看着像「服务端没版本号」
        if (!d || !d.version) throw new Error('响应里没有 version 字段')
        if (myToken !== routeToken) return   // 用户已经切走，别再动 DOM
        renderSrvVer('ok', d)
      })
      .catch(function (e) {
        if (myToken !== routeToken) return
        renderSrvVer('fail', (e && e.message) || '网络不可达')
      })
  }

  /* ============================ 头部 / 返回 ============================ */
  /* ============================ 插件与音源 ============================ */
  /*
   * 一页把「本地插件」这件事的开关、实测、清单、导入、缓存全收齐。
   *
   * 为什么统计和跑分要放在最上面：用户打开这一页，第一件想知道的事是
   * 「本地插件到底在不在干活」。把「本地 N 次 / 服务端 M 次」摆在第一屏，
   * 比让他去猜「我刚才是走的哪条路」有用得多。
   */
  function pagePlugins(r, myToken) {
    view.innerHTML = pageHeadHtml('插件与音源') + '<div class="block" id="lpBody"></div>'
    bindBack()
    lpRenderBody()
    audioCacheRefreshStat()
    // 「默认搜索源」是服务端设置，跟插件数据无关，单独拉（不阻塞插件清单渲染）
    lpLoadSources(false)
    // 插件数据是懒加载的（约 760KB），进这一页才拉
    loadPluginData(function (err) {
      if (myToken !== routeToken) return
      if (err) {
        var b = $('#lpBody')
        if (b) b.innerHTML = '<div class="note">插件数据加载失败：' + esc(err.message) + '<br>确认 assets/web/plugins.data.js 随包打进去了。</div>'
        return
      }
      lpBuildList()
      lpRenderBody()
    })
  }

  function lpRenderBody() {
    var b = $('#lpBody')
    if (!b) return
    b.innerHTML = lpSwitchCard() + lpStatCard() + lpScoreCard() +
      lpSourcesCard() +
      lpListCard() + lpImportCard() + lpCacheCard() +
      '<div class="note" style="padding:6px 2px 28px">' +
      '插件运行在独立的 Worker 里 —— 个别第三方脚本出错只会影响它自己，不会让应用崩溃。' +
      '</div>'
    lpBindBody()
    lpSourcesBind()
  }

  function lpSwitchCard() {
    var ok = LP.runtime
    var desc
    if (!ok) {
      desc = '<span style="color:var(--brand)">本机 WebView 版本过低（不支持 BigInt），本地插件不可用。' +
        '服务端取流不受影响，功能照常。</span>'
    } else if (LP.on) {
      desc = '已启用：优先用<b>本机</b>插件解析地址，全都失败时自动退回服务端兜底。'
    } else {
      desc = '已关闭：一律走服务端解析。打开后插件在本机运行，取流不经过远端。'
    }
    return '<div class="card-block" style="margin-bottom:12px">' +
      '<div class="card-block__head">' +
      '<div class="card-block__name">本地插件取流</div>' +
      '<label class="switch"><input type="checkbox" id="lpOn"' + (LP.on ? ' checked' : '') + (ok ? '' : ' disabled') + '><i></i></label>' +
      '</div>' +
      '<div class="card-block__desc">' + desc + '</div>' +
      '</div>'
  }

  function lpStatCard() {
    var total = LP.stat.local + LP.stat.server
    var pct = total ? Math.round(LP.stat.local / total * 100) : 0
    /*
     * 插件「在哪儿求值」对用户是可见的差别，必须写出来：
     *   Worker 里 → 个别插件脚本出错只影响它自己；
     *   主线程里（老 WebView 没有 Blob Worker）→ 一个坏插件能把整个应用带走。
     * 不写的话，用户只会觉得「开了插件怎么变卡/闪退」，猜不到是隔离降级了。
     */
    var mode = !LP.runtime ? '本机不支持（WebView 版本过低）'
      : (LP.worker ? '独立 Worker · 插件出错不影响应用'
        : (lpWorkerProbe ? '主线程降级 · 老 WebView 没有 Blob Worker' : '待检测（开始取流后自动探测）'))
    return '<div class="card-block" style="margin-bottom:12px">' +
      '<div class="card-block__head"><div class="card-block__name">取流统计</div>' +
      '<span class="pill">安装以来</span></div>' +
      '<div class="card-block__desc">本地插件 ' + LP.stat.local + ' 次 · 服务端 ' + LP.stat.server + ' 次' +
      (total ? '（本地占 ' + pct + '%）' : '（还没取过流）') + '</div>' +
      '<div class="card-block__desc" id="lpRuntimeMode">运行方式：' + mode + '</div>' +
      '</div>'
  }

  /*
   * 评分卡：**按平台分开看**（对齐 Web 管理页的「插件调度顺序」）。
   *
   * 一个插件在不同平台上的表现可以天差地别（wy 上 90 分、kg 上 0 分很常见），
   * 只给一个综合分等于把这份差异抹掉 —— 用户看着「85 分」却不知道它到底在哪个
   * 源上能用。所以这里跟 Web 管理页一样：上面一排平台 chips，切到哪个平台就看
   * 那个平台上的插件排行。
   */
  var SCORE = { tab: '' }

  function lpScoreCard() {
    var s = LP.scores
    var desc
    if (LP.scoring) {
      desc = '正在实测各插件在本机的取流表现…不阻塞听歌，可以先去别处。'
    } else if (!s) {
      desc = '还没跑过分。评分是<b>在本机上实测</b>出来的 —— 插件好不好用取决于你这条网络，别人测的分数参考价值有限。'
    } else if (!s.bySource) {
      desc = '这份评分是旧版跑的（只有综合分、没有分平台明细），重新跑一次就能按平台分开看。'
    } else {
      var when = new Date(s.at)
      var n = 0
      for (var k in s.byId) if (Object.prototype.hasOwnProperty.call(s.byId, k)) n++
      var nsrc = 0
      for (var q in s.bySource) if (Object.prototype.hasOwnProperty.call(s.bySource, q)) nsrc++
      desc = '上次跑分：' + (when.getMonth() + 1) + '月' + when.getDate() + '日 ' +
        pad2(when.getHours()) + ':' + pad2(when.getMinutes()) +
        '，用时 ' + Math.round((s.cost || 0) / 1000) + ' 秒，覆盖 ' + n + ' 个插件 / ' + nsrc + ' 个平台。'
    }
    var badge = s
      ? (s.bySource ? '<span class="pill pill--brand">已有结果</span>' : '<span class="pill pill--warn">待重跑</span>')
      : '<span class="pill">未跑分</span>'
    return '<div class="card-block" style="margin-bottom:12px">' +
      '<div class="card-block__head"><div class="card-block__name">插件评分</div>' + badge + '</div>' +
      '<div class="card-block__desc" id="lpScoreDesc">' + desc + '</div>' +
      lpScoreRank() +
      '<button class="btn btn--ghost btn--block" id="lpScoreBtn" style="margin-top:12px"' + (LP.scoring ? ' disabled' : '') + '>' +
      (LP.scoring ? '正在跑分…' : (s ? '重新跑分' : '开始跑分')) + '</button>' +
      '</div>'
  }

  /**
   * 评分卡下半：平台 chips + 该平台上的插件排行。
   * 每个平台只列**在该平台跑过**的插件（没声明支持这个平台的插件不该出现在这里）。
   */
  function lpScoreRank() {
    var s = LP.scores
    if (!s || !s.bySource) return ''
    var srcs = []
    for (var k in s.bySource) if (Object.prototype.hasOwnProperty.call(s.bySource, k)) srcs.push(k)
    if (!srcs.length) return '<div class="note" style="margin-top:10px">这次跑分没有测到任何平台。</div>'
    // 默认停在第一个平台；用户点过就以用户选的为准（重渲染/重跑分都不跳回）
    if (!SCORE.tab || srcs.indexOf(SCORE.tab) < 0) SCORE.tab = srcs[0]
    var chips = ''
    for (var i = 0; i < srcs.length; i++) {
      chips += '<button class="chip' + (srcs[i] === SCORE.tab ? ' is-active' : '') +
        '" data-scoretab="' + esc(srcs[i]) + '">' + esc(lpSrcShort(srcs[i])) + '</button>'
    }
    return '<div class="chips" style="padding:12px 0 8px">' + chips + '</div>' +
      '<div class="srclist" id="lpScoreRank">' + lpScoreRankRows(SCORE.tab) + '</div>'
  }

  function lpScoreRankRows(src) {
    var bySrc = (LP.scores.bySource || {})[src] || {}
    var list = []
    for (var i = 0; i < LP.list.length; i++) {
      var p = LP.list[i]
      var r = bySrc[p.id]
      if (!r) continue                       // 该插件没在这个平台跑过
      list.push({ p: p, r: r })
    }
    if (!list.length) return '<div class="note">「' + esc(lpSrcShort(src)) + '」上没有插件参与评分。</div>'
    list.sort(function (a, b) { return b.r.score - a.r.score })
    var out = ''
    for (var k = 0; k < list.length; k++) {
      var it = list[k]
      var r = it.r
      var cls = !r.ok ? 'pill--bad' : (r.score >= 60 ? 'pill--ok' : 'pill--warn')
      var meta = r.ok
        ? (r.ok + '/' + r.total + ' 次成功' + (r.ms ? ' · ' + (r.ms / 1000).toFixed(1) + 's' : ''))
        : '一次都没成功'
      out += '<div class="scorerow">' +
        '<span class="scorerow__no">' + (k + 1) + '</span>' +
        '<div class="scorerow__main">' +
        '<div class="scorerow__name">' + esc(it.p.name) + (it.p.enabled ? '' : '（未启用）') + '</div>' +
        '<div class="scorerow__meta">' + meta + '</div>' +
        '</div>' +
        '<span class="pill ' + cls + '">' + (r.ok ? (r.score + ' 分') : '不可用') + '</span>' +
        '</div>'
    }
    return out
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n }

  /* ---------------------------- 默认搜索源（可排序） ---------------------------- */
  /*
   * 服务端的「默认搜索源」决定**综合搜索 / 首页推荐 / AI 歌单匹配**查哪几个平台，
   * 而**顺序就是优先级**（越靠前越先被查、结果越靠前）。Web 管理页一直有这一块，
   * 客户端此前没有 —— 想改顺序只能去开网页，手机上够不着。
   *
   * ⚠ 交互**故意不照抄网页的拖拽**：网页那份是 mousedown/mousemove 的鼠标拖拽，
   *   手机上要另写一整套触摸事件；而在一个可滚动的列表里做触摸拖拽，既要
   *   elementFromPoint 又要边拖边挪 DOM，老 WebView 上极容易把滚动手势一起吃掉。
   *   ↑↓ 按钮同样能表达「顺序 = 优先级」，行为确定、且能被 smoke 自测
   *   （本项目没有真机也没有模拟器，拖拽写出来就是没测过的代码）。
   *   真想要拖拽再加，别为此把这一页搞脆。
   *
   * ⚠ 只给**管理员**画：这是服务端全局设置，普通账号调 /admin/search-sources 会被
   *   403 —— 画出来只会让人点一次、吃一个错误提示。
   */
  var SRC = { state: 'idle', err: '', active: [], order: [], byKey: {}, dirty: false, saving: false }

  function lpLoadSources(force) {
    if (SRC.state === 'loading') return
    if (SRC.state === 'ready' && !force) return
    SRC.state = 'loading'
    SRC.err = ''
    lpRenderBody()
    api('/sources').then(function (d) {
      d = d || {}
      var all = []
      var byKey = {}
      var i, p
      for (i = 0; i < (d.platforms || []).length; i++) { p = d.platforms[i]; if (p && p.key) { all.push(p); byKey[p.key] = p } }
      for (i = 0; i < (d.pluginSources || []).length; i++) {
        p = d.pluginSources[i]
        // 只列声明了 musicSearch 的插件源 —— 勾一个不能搜的源，点了搜索没反应才是真的坑
        // （与 Web 管理页同口径）。
        if (!p || !p.key || !p.searchable) continue
        all.push(p)
        byKey[p.key] = p
      }
      // 列表按服务端的 order 渲染（含未勾选的平台）；order 里没提到的补在末尾。
      // 不这么做的话「调完顺序一刷新又回去了」—— 那个坑 Web 管理页踩过一次。
      var order = []
      var fromServer = d.order && d.order.length ? d.order : []
      for (i = 0; i < fromServer.length; i++) if (byKey[fromServer[i]]) order.push(fromServer[i])
      for (i = 0; i < all.length; i++) if (order.indexOf(all[i].key) < 0) order.push(all[i].key)
      SRC.byKey = byKey
      SRC.order = order
      SRC.active = (d.active || []).slice(0)
      SRC.dirty = false
      SRC.state = 'ready'
      lpRenderBody()
    }).catch(function (e) {
      SRC.state = 'error'
      SRC.err = (e && e.message) || '加载失败'
      lpRenderBody()
    })
  }

  function lpSourcesCard() {
    if (!(user && user.isAdmin)) return ''
    var head = '<div class="groupTitle" style="padding:14px 4px 8px">默认搜索源</div>'
    if (SRC.state === 'idle' || SRC.state === 'loading') {
      return head + '<div class="card-block" style="margin-bottom:12px">' +
        '<div class="card-block__desc">正在读取…</div></div>'
    }
    if (SRC.state === 'error') {
      return head + '<div class="card-block" style="margin-bottom:12px">' +
        '<div class="card-block__desc">读取失败：' + esc(SRC.err) + '</div>' +
        '<button class="btn btn--ghost btn--block" id="srcReload" style="margin-top:10px">重试</button>' +
        '</div>'
    }
    var rows = ''
    var last = SRC.order.length - 1
    for (var i = 0; i < SRC.order.length; i++) {
      var k = SRC.order[i]
      var p = SRC.byKey[k] || { name: k }
      var on = SRC.active.indexOf(k) >= 0
      rows += '<div class="srcrow" data-key="' + esc(k) + '">' +
        '<span class="srcrow__no">' + (i + 1) + '</span>' +
        '<span class="srcrow__name">' + esc(p.name || k) + '</span>' +
        '<button class="srcrow__mv" data-srcup="' + esc(k) + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="上移">\u2191</button>' +
        '<button class="srcrow__mv" data-srcdown="' + esc(k) + '"' + (i === last ? ' disabled' : '') + ' aria-label="下移">\u2193</button>' +
        '<label class="switch"><input type="checkbox" data-srctog="' + esc(k) + '"' + (on ? ' checked' : '') + '><i></i></label>' +
        '</div>'
    }
    return head +
      '<div class="card-block" style="margin-bottom:12px">' +
      '<div class="card-block__desc">越靠上的平台，在「综合搜索 / 首页推荐」里越先被查；' +
      '右侧开关决定它是否参与。用 ↑↓ 调顺序，改完点右下角保存。</div>' +
      '<div class="srclist" id="srcSort" style="margin-top:10px">' + rows + '</div>' +
      '<div class="srcfoot">' +
      '<span class="srcfoot__state' + (SRC.dirty ? ' is-dirty' : '') + '" id="srcState">' +
      (SRC.dirty ? '有未保存的改动' : '顺序与开关改动后需保存') + '</span>' +
      '<button class="btn btn--sm" id="srcSave"' + (SRC.dirty && !SRC.saving ? '' : ' disabled') + '>' +
      (SRC.saving ? '保存中…' : '保存') + '</button>' +
      '</div>' +
      '<div class="note" style="margin-top:10px">全部取消会退回全部平台。' +
      '这是<b>服务端</b>设置，保存后所有设备一起生效。</div>' +

  }

  function lpSourcesBind() {
    var rl = $('#srcReload')
    if (rl) rl.addEventListener('click', function () { lpLoadSources(true) })
    $$('[data-srcup]').forEach(function (b) {
      b.addEventListener('click', function () { lpSourcesMove(b.getAttribute('data-srcup'), -1) })
    })
    $$('[data-srcdown]').forEach(function (b) {
      b.addEventListener('click', function () { lpSourcesMove(b.getAttribute('data-srcdown'), 1) })
    })
    $$('[data-srctog]').forEach(function (c) {
      c.addEventListener('change', function () {
        var k = c.getAttribute('data-srctog')
        var i = SRC.active.indexOf(k)
        if (c.checked) { if (i < 0) SRC.active.push(k) }
        else if (i >= 0) SRC.active.splice(i, 1)
        SRC.dirty = true
        lpRenderBody()
      })
    })
    var sv = $('#srcSave')
    if (sv) sv.addEventListener('click', lpSourcesSave)
  }

  /** 把第 i 项与相邻项换位。越界直接返回（首行的 ↑ / 末行的 ↓ 本来就 disabled）。 */
  function lpSourcesMove(key, dir) {
    var i = SRC.order.indexOf(key)
    var j = i + dir
    if (i < 0 || j < 0 || j >= SRC.order.length) return
    var t = SRC.order[i]
    SRC.order[i] = SRC.order[j]
    SRC.order[j] = t
    SRC.dirty = true
    lpRenderBody()
  }

  /*
   * 保存：一次送两样，缺一不可（与 Web 管理页同口径）。
   *   sources —— 勾选的平台，顺序就是搜索优先级（真正生效的那份）
   *   order   —— 整列的完整顺序，含**没勾选**的平台（只影响界面排布）
   * 只送 sources 的话，取消勾选某个平台再刷新它会自己蹦到队尾 —— 用户只会得出
   * 「调了没用」的结论。
   */
  function lpSourcesSave() {
    if (SRC.saving) return
    SRC.saving = true
    lpRenderBody()
    api('/admin/search-sources', {
      method: 'POST',
      body: { sources: SRC.active.join(','), order: SRC.order.join(',') }
    }).then(function (r) {
      SRC.saving = false
      SRC.dirty = false
      if (r && r.active) SRC.active = r.active.slice(0)
      toast('已保存默认搜索源：' + (SRC.active.length ? SRC.active.join(' / ') : '全部平台'))
      lpRenderBody()
    }).catch(function (e) {
      SRC.saving = false
      toast((e && e.message) || '保存失败')
      lpRenderBody()
    })
  }

  function lpListCard() {
    var list = LP.list
    if (!list.length) {
      return '<div class="groupTitle" style="padding:14px 4px 8px">插件</div>' +
        '<div class="note" style="padding:0 2px 12px">插件清单是空的 —— 数据文件可能没随包打进去。</div>'
    }
    var on = 0
    var rows = ''
    for (var i = 0; i < list.length; i++) {
      if (list[i].enabled) on++
      rows += lpRow(list[i])
    }
    return '<div class="groupTitle" style="padding:14px 4px 8px">插件（' + on + '/' + list.length + ' 已启用）</div>' +
      '<div id="lpList">' + rows + '</div>'
  }

  function lpRow(p) {
    var sc = p.score
    var pill
    if (sc) {
      var cls = !sc.ok ? 'pill--bad' : (sc.score >= 60 ? 'pill--ok' : 'pill--warn')
      var tip = sc.bestSource ? ('最优：' + lpSrcShort(sc.bestSource)) : ''
      pill = '<span class="pill ' + cls + '"' + (tip ? ' title="' + esc(tip) + '"' : '') + '>' +
        (sc.ok ? (sc.score + ' 分') : '不可用') + '</span>'
    } else {
      pill = '<span class="pill">未测</span>'
    }
    var srcs = p.sources ? Object.keys(p.sources) : []
    var meta = 'v' + esc(p.meta.version) + ' · ' + esc(p.meta.author)
    if (srcs.length) meta += ' · ' + esc(srcs.join(','))
    meta += ' · ' + Math.round((p.bytes || 0) / 1024) + 'KB'
    if (p.origin === 'user') meta += ' · 已导入'
    var it = LP.inst[p.id]
    if (it && it.state === 'failed') meta += '<br><span style="color:var(--brand)">' + esc(it.error) + '</span>'
    else if (it && it.state === 'ready') meta += ' · 已就绪'
    else if (it && it.state === 'loading') meta += ' · 加载中…'
    if (sc && sc.total) {
      meta += '<br>最优 ' + (sc.bestSource ? esc(lpSrcShort(sc.bestSource)) + ' ' : '') +
        sc.ok + '/' + sc.total + ' 次成功' + (sc.ms ? '，中位 ' + (sc.ms / 1000).toFixed(1) + 's' : '')
    }
    // 各平台**分别**的实测分 —— 一眼看出「它在哪个源上能用」（对齐 Web 管理页的分平台视图）
    var per = lpPerSourceText(p)
    if (per) meta += '<br>' + esc(per)

    return '<div class="card-block" style="margin-bottom:8px">' +
      '<div class="card-block__head">' +
      '<div class="card-block__name">' + esc(p.name) + '</div>' + pill +
      '<label class="switch"><input type="checkbox" data-lpen="' + esc(p.id) + '"' + (p.enabled ? ' checked' : '') + '><i></i></label>' +
      '</div>' +
      '<div class="card-block__desc">' + meta + '</div>' +
      (p.origin === 'user'
        ? '<button class="btn btn--sm btn--ghost" data-lpdel="' + esc(p.id) + '" style="margin-top:8px">删除</button>'
        : '') +
      '</div>'
  }

      '</div>' +

      }).join('') + '</div></div>' +

  function lpBindBody() {
    var onEl = $('#lpOn')
    if (onEl) onEl.addEventListener('change', function () {
      var want = this.checked
      if (want && !lpSetOn(true)) { this.checked = false; return }
      if (!want) lpSetOn(false)
      lpRenderBody()
    })

    var sb = $('#lpScoreBtn')
    if (sb) sb.addEventListener('click', lpRunScoreUI)

    // 评分卡的平台 chips：切平台看该平台的插件排行（对齐 Web 管理页的 tab）
    $$('[data-scoretab]').forEach(function (b) {
      b.addEventListener('click', function () {

        lpRenderBody()
      })
    })

    $$('[data-lpen]').forEach(function (c) {
      c.addEventListener('change', function () {
        lpSetEnabled(c.getAttribute('data-lpen'), c.checked)
        if (c.checked && LP.on) lpEnsure(c.getAttribute('data-lpen'), 12000)
        lpRenderBody()
      })
    })
    $$('[data-lpdel]').forEach(function (c) {
      c.addEventListener('click', function () {
        lpRemove(c.getAttribute('data-lpdel'))

      c.addEventListener('click', function () {

        lpSaveCache()
        lpRenderBody()
        audioCacheTrim()
      })
    })

    var cu = $('#lpCacheUrl')
    if (cu) cu.addEventListener('change', function () {
      LP.cache.url = this.checked
      lpSaveCache()
      if (!this.checked) lpUrlCacheClear()
      toast(this.checked ? '已开启直链缓存' : '已关闭直链缓存，并清掉已有记录')
    })
    var ca = $('#lpCacheAudio')
    if (ca) ca.addEventListener('change', function () {
      LP.cache.audio = this.checked
      lpSaveCache()
      toast(this.checked ? '已开启音频缓存' : '已关闭音频缓存')
    })

    if (cc) cc.addEventListener('click', function () {
      audioCacheClear().then(function (n) {
        toast(n ? ('已清空 ' + fmtBytes(n) + ' 音频缓存') : '缓存本来就是空的')
        lpRenderBody()
      })

    var iu = $('#lpImportUrl')
    if (iu) iu.addEventListener('click', lpImportFromUrlUI)
    var it2 = $('#lpImportText')

  function lpSetOn(on) {
    if (on && !LP.runtime) { toast('本机 WebView 版本过低，本地插件不可用'); return false }
    LP.on = !!on
    store.set(LP_KEYS.on, LP.on)
    if (!LP.on) { lpReset(); toast('已关闭本地插件，全部走服务端'); return true }
    loadPluginData(function (err) {
      if (err) { toast('插件数据加载失败：' + err.message); return }
      lpBuildList()
      lpWarm()
      if (!LP.scores) {
        // 第一次启用：自动跑一轮分，再按实测结果替用户勾上能用的那几个。
        // 不跑的话 22 个插件全是「未测」，用户根本不知道该开哪个。
        toast('首次启用，正在后台实测各插件…', 3200)
        lpScoreAll(function (done, total) {
          var d = $('#lpScoreDesc')
          if (d) d.innerHTML = '正在实测… ' + done + '/' + total
        }).then(function () {
          var turned = lpAutoEnableFromScores()
          if (pageNowIs('/plugins')) lpRenderBody()
          toast(turned.length ? ('跑分完成，已自动启用 ' + turned.length + ' 个插件') : '跑分完成，但没有可用的插件', 3600)
          lpWarm()
        }).catch(function (e) {
          if (pageNowIs('/plugins')) lpRenderBody()
          toast('自动跑分失败：' + e.message, 3600)
        })
      } else {
        lpWarm()
        if (pageNowIs('/plugins')) lpRenderBody()
      }
    })
    return true
  }

  function pageNowIs(path) {
    try { return parseHash().path === path } catch (e) { return false }
  }

  function lpRunScoreUI() {
    if (!LP.runtime) return toast('插件运行时不可用')
    if (LP.scoring) return
    toast('开始跑分，会在后台实测各插件…', 2600)
    lpRenderBody()
    lpScoreAll(function (done, total) {
      var d = $('#lpScoreDesc')
      if (d) d.innerHTML = '正在实测… ' + done + '/' + total
    }).then(function () {
      var turned = lpAutoEnableFromScores()
      lpRenderBody()
      toast(turned.length ? ('跑分完成，已自动启用 ' + turned.length + ' 个插件') : '跑分完成', 3400)
      lpWarm()
    }).catch(function (e) {
      lpRenderBody()
      toast('跑分失败：' + e.message, 3600)
    })
  }

  function lpAfterImport(res, srcLabel) {
    toast(res.replaced ? '已更新同名插件' : ('已导入「' + res.meta.name + '」' + (srcLabel || '')))
    if (LP.on) lpEnsure(res.id, 12000)
    lpRenderBody()
  }

  function lpImportFromUrlUI() {
    var el = $('#lpUrl')
    var url = el ? String(el.value || '').trim() : ''
    if (!/^https?:\/\//i.test(url)) return toast('请填一个 http/https 开头的地址')
    toast('正在下载插件…')
    // 走原生桥：file:// 源下直接 fetch 跨域会被拦，而且不少插件站要 UA
    nativeHttp(url, 'GET', { 'User-Agent': 'Mozilla/5.0' }, null, 30000).then(function (res) {
      if (res.status < 200 || res.status >= 300) throw new Error('HTTP ' + res.status)
      var text = String(res.body || '')
      if (text.length < 200) throw new Error('下载到的内容太短，可能不是插件脚本')
      var r = lpImport(text, url)
      lpAfterImport(r, '（来自地址）')
    }).catch(function (e) {
      toast('导入失败：' + e.message, 3400)
    })
  }

  function lpImportFromTextUI() {
    var el = $('#lpText')
    var text = el ? String(el.value || '') : ''
    try {
      var r = lpImport(text, '')
      if (el) el.value = ''
      lpAfterImport(r, '（来自文本）')
    } catch (e) {
      toast('导入失败：' + e.message, 3400)
    }
  }

  /**
   * 从手机文件里选插件。
   *
   * 为什么不让 JS 自己读：file:// 页面拿不到用户选的文件的路径（<input type=file>
   * 给的 File 对象读得到内容，但壳里这个入口不好用，且大脚本走 WebView 的
   * JS 桥会超长）。所以交给原生：Java 侧用 ACTION_OPEN_DOCUMENT 选完直接读文本，
   * 再回调 window.onNativePluginFile({name, content})。
   */
  function lpImportFromFileUI() {
    if (!(window.YunBridge && window.YunBridge.pickPluginFile)) {
      return toast('当前版本不支持从文件选择，可改用粘贴文本')
    }
    try { window.YunBridge.pickPluginFile() } catch (e) { toast('打开文件选择器失败：' + e.message) }
  }

  window.onNativePluginFile = function (data) {
    if (!data) return
    if (data.error) return toast('读取文件失败：' + data.error, 3400)
    var content = String(data.content || '')
    if (!content) return toast('文件是空的')
    try {
      var r = lpImport(content, '', data.name || '')
      lpAfterImport(r, '（来自文件 ' + (data.name || '') + '）')
    } catch (e) {
      toast('导入失败：' + e.message, 3400)
    }
  }

  /* ============================ 进度条拖拽 ============================ */
  var seeking = false
  var seekingAt = 0
  function progressRatio(clientX) {
    var rect = $('#progressRange').getBoundingClientRect()
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width))
  }
  function paintProgress(ratio) {
    $('#progressFill').style.width = (ratio * 100) + '%'
    $('#progressThumb').style.left = (ratio * 100) + '%'
  }
  ;(function bindSeek() {
    var range = $('#progressRange')
    var lastTouchEnd = 0
    function down(e) {
      // Android WebView 在 touchend 之后还会补一对兼容 mouse 事件（mousedown/mouseup），
      // 会把刚刚清掉的 seeking 又立起来；紧随其后的那次 mousedown 直接忽略。
      if (e && e.type === 'mousedown' && Date.now() - lastTouchEnd < 600) return
      seeking = true
      seekingAt = Date.now()
      var r = progressRatio((e.touches ? e.touches[0] : e).clientX)
      paintProgress(r)
    }
    function move(e) {
      if (!seeking) return
      e.preventDefault()
      paintProgress(progressRatio((e.touches ? e.touches[0] : e).clientX))
    }
    function up(e) {
      if (!seeking) return
      seeking = false
      var pt = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || e
      if (pt && typeof pt.clientX === 'number') {
        var r = progressRatio(pt.clientX)
        if (audio.duration) audio.currentTime = r * audio.duration
      }
    }
    range.addEventListener('touchstart', down, { passive: true })
    range.addEventListener('touchmove', move, { passive: false })
    range.addEventListener('touchend', function (e) { lastTouchEnd = Date.now(); up(e) })
    // 手势被系统抢走（来电、下拉通知栏）时只有 touchcancel，不接住 seeking 会永久卡住
    range.addEventListener('touchcancel', function (e) { lastTouchEnd = Date.now(); up(e) })
    range.addEventListener('mousedown', down)
    window.addEventListener('mousemove', move)
    window.addEventListener('mouseup', up)
  })()

  /* ============================ 音频事件 ============================ */
  audio.addEventListener('timeupdate', function () {
    var cur = audio.currentTime || 0
    var total = audio.duration || 0
    // seeking 卡住的兜底：正常拖拽不会超过 5 秒，超了就是 up 没跑到，
    // 不清理的话进度条与时间会**永久定格**（看着就像「没有进度」）
    if (seeking && Date.now() - seekingAt > 5000) seeking = false
    if (!seeking) {
      $('#curTime').textContent = fmtTime(cur)
      $('#totalTime').textContent = fmtTime(total)
      if (total > 0) {
        paintProgress(cur / total)
        $('#miniProgress').firstElementChild.style.width = (cur / total * 100) + '%'
      }
    }
    // 「这一首是活的」只能由**真实进度**证明。不要在 play/playing 里清零 errStreak ——
    // 起播即失败时 play 照样会派发，清零就等于把兜底保护废掉，
    // 结果是 error → 下一首 → error 无限打转，界面看起来就是「假死」。
    if (cur > (P.progressMark || 0) + 0.5) { P.progressMark = cur; P.errStreak = 0 }
    syncLyric(cur)
    // 每 5 秒把进度补给系统一份，纠正锁屏进度条的累计漂移
    syncMediaProgress()
  })
  audio.addEventListener('play', function () { updatePlayIcon(true); startLyricLoop() })
  audio.addEventListener('playing', function () { startLyricLoop() })
  audio.addEventListener('pause', function () { clearPlayWatch(); updatePlayIcon(false); stopLyricLoop() })
  // 重新解析 / 兜底切流之后回到原来的位置，别让用户从 0 秒重听
  audio.addEventListener('loadedmetadata', function () {
    var dur = audio.duration
    if (P.resumePos > 0 && isFinite(P.resumePos)) {
      /*
       * ⚠ 续播点必须落在**新音源自己的时长之内**。
       *
       * 换候选（error / 看门狗）时会带着旧位置过来，可新那条可能短得多 ——
       * 典型是「完整版放到 100 秒时源断了，换到的下一条是 30 秒的试听片段」。
       * 这时把 currentTime 设成 100 会被浏览器钳到 30，<audio> 立刻派发 `ended`
       * → playNext()，用户看到的就是「播到一半突然停、直接跳下一首」。
       * 钳不住就宁可从头放，也绝不让它瞬间「播完」。
       */
      if (isFinite(dur) && dur > 0 && P.resumePos >= dur - 0.5) P.resumePos = 0
      else { try { audio.currentTime = P.resumePos } catch (e) { } }
    }
    P.resumePos = 0
    // 元数据一到就知道真实时长 —— 是片段的话**提前**告诉用户，
    // 别让他先白听 30 秒才发现不对（判据见 warnIfSnippet）
    warnIfSnippet()
    // 到这里才知道总时长，补一份给锁屏，否则锁屏上时长/进度条是空的
    lastMediaSync = Date.now()
    syncMedia()
  })
  // 拖动进度条之后立刻按新位置重摆歌词：暂停状态下 rAF 循环是停的
  audio.addEventListener('seeked', function () { realignLyric(); lastMediaSync = Date.now(); syncMedia() })
  /**
   * 「播完了」其实有两种：真的放完了，和**音源只给了片段**。
   *
   * 后者必须区别对待 —— 用户的原话是「按照歌单播放时候，存在歌曲播放一段，
   * 不播放，自动播放下一首歌曲」。以前这里无条件 `playNext()`，
   * 后果是：整张歌单里凡是没有完整版的歌都被默默跳过，用户既不知道为什么，
   * 也永远听不到后半段。
   *
   * 顺序：
   *   ① 先判这一条是不是片段（`loadedmetadata` 没弹过就现在弹，把原因说清楚）；
   *   ② 是片段、且后面还有**没标成片段**的候选 → 换那条接着放（同一首歌，从头）；
   *   ③ 没得换了 → 按正常流程走下一首。
   */
  audio.addEventListener('ended', function () {
    clearPlayWatch()
    warnIfSnippet()
    if (P.snippet && useNextFullCandidate()) return
    /*
     * 真的听完了 —— 这时候才把音频交给缓存（见 audioCachePut 顶部「为什么是
     * 整首听完才存」）。中途切歌不存：半个文件留在缓存里，下次命中反而放不出来。
     */
    var doneSong = currentSong()
    var doneCand = P.cands[P.candIndex]
    if (doneSong && doneCand) audioCachePut(doneSong, doneCand.url)
    playNext()
  })
  audio.addEventListener('error', function () {
    if (!audio.src) return
    clearPlayWatch()
    // 本地下载文件读不出来（分区存储限制等）→ 退回在线播放，而不是当作播放失败跳下一首
    if (P.localSrc) {
      var fb = P.localFallback
      P.localSrc = false; P.localFallback = null
      toast('本地文件无法播放，改为在线播放')
      if (fb) playSong(fb, [fb])
      return
    }
    /*
     * ① 先换**下一条候选直链** —— 这是「跳歌」的正解。
     *
     * 服务端 /url 一次给一串候选（不同插件 / 官方直链解出来的地址，已排序）。
     * 以前这里直接走 playNext：把「这个源不行」误判成「这首歌不行」，
     * 于是整首歌被跳过 —— 用户看到的就是「中间有歌曲没有播放，跳过去」。
     * 同一首歌往往有五六个源，换一条继续放才是对的。
     */
    if (P.candIndex >= 0 && P.candIndex + 1 < (P.cands || []).length) {
      var pos = (isFinite(audio.currentTime) && audio.currentTime > 2) ? audio.currentTime : 0
      P.resumePos = pos
      useCandidate(P.candIndex + 1, true)
      return
    }
    // ② 本地插件给的候选全军覆没 → 改问服务端（服务端会探测候选，可靠得多）。
    //    ⚠ 必须在代理流之前：本地插件只是把地址解出来，解出来 ≠ 播得出来。
    if (P.candsLocal && retryViaServer()) return
    // ③ 候选都试完了 → 退服务端代理流（同源，规避防盗链），每首只退一次
    if (!P.triedProxy && useProxyStream(true)) return
    // ③ 真的没辙了：连续失败兜底。整队列音源都失效时，不能无休止地「自动下一首」
    P.errStreak = (P.errStreak || 0) + 1
    if (P.errStreak > 3) { P.errStreak = 0; toast('多个音源均无法播放，请切换线路后重试'); return }
    // 单曲循环下**绝对不能**走 playNext —— 它会把 currentTime 归零再放同一个坏地址，
    // error → playNext → error 就是死循环，CPU 打满、界面假死
    if (P.mode === 'single') { toast('当前音源无法播放，请切换线路后重试'); return }
    toast('播放出错，尝试下一首')
    setTimeout(playNext, 600)
  })

  /* ============================ 歌词校准按钮 ============================ */
  $('#lyricCalMinus').addEventListener('click', function () { bumpLyricDelay(-LYRIC_STEP) })
  $('#lyricCalPlus').addEventListener('click', function () { bumpLyricDelay(LYRIC_STEP) })
  $('#lyricCalVal').addEventListener('click', function () {
    lyricDelay = 0; store.set('ym.lyricDelay', 0); updateLyricCal(); P.lineIndex = -1; syncLyric(audio.currentTime || 0)
  })

  /* ============================ 原生回调注入 ============================ */
  window.nativeTogglePlay = togglePlay
  window.nativeNextTrack = playNext
  window.nativePrevTrack = playPrev

  /**
   * 锁屏 / 控制中心 / 蓝牙耳机传来的「要播」或「要停」。
   *
   * ⚠ 这里传的是**目标状态**而不是「切换」：系统可能因为蓝牙重连、
   * 或用户连点而重复派发同一个动作，做成切换就会出现
   * 「按一次暂停，结果它又播起来了」。所以先比对当前状态，一样就什么都不做。
   */
  window.nativeSetPlaying = function (want) {
    try {
      var w = !!want
      if (w === !audio.paused) return
      if (w) {
        // 和用户点播放键走同一条路：清掉熔断计数，重新解析音源再放
        P.errStreak = 0
        P.resumePos = audio.currentTime || P.resumePos || 0
        playAudio(function () { loadCurrent(true) })
        armPlayWatch()
      } else {
        P.lastPos = audio.currentTime || 0
        audio.pause()
      }
    } catch (e) { }
  }

  /** 锁屏 / 控制中心拖动进度条。系统给的是毫秒，网页用秒。 */
  window.nativeSeekTo = function (ms) {
    try {
      var s = Number(ms) / 1000
      if (!isFinite(s) || s < 0) return
      var total = audio.duration
      if (isFinite(total) && total > 0 && s > total) s = total
      P.resumePos = s
      P.progressMark = s
      audio.currentTime = s
      syncLyric(s, true)
    } catch (e) { }
  }

  window.handleAppBack = function () {
    if (!$('#dialog').hidden) { closeSheet($('#dialog')); return 'handled' }
    if (!$('#drawer').hidden) { closeSheet($('#drawer')); return 'handled' }
    if (!$('#queueSheet').hidden) { closeSheet($('#queueSheet')); return 'handled' }
    if (!$('#player').hidden) { closePlayer(); return 'handled' }
    if (parseHash().path !== '/') { location.hash = '#/'; return 'handled' }
    return 'default'
  }

  /* ============================ 启动 ============================ */
  function boot() {
    readNativeConfig()
    // 本地插件：先把开关状态读回来（纯本地读，不联网）。
    // 插件数据（约 760KB）与预热**故意延后** —— 首屏不能被它拖住，
    // 而且用户多半也不会一进来就听歌。
    lpRestore()
    $('#qualityLabel').textContent = P.quality
    $('#modeIcon').innerHTML = MODE_PATH[P.mode]
    updateLyricCal()
    if (P.queue.length) {
      showMini(true)
      $('#miniTitle').textContent = P.queue[0].name || ''
      $('#miniArtist').textContent = P.queue[0].singer || ''
      $('#miniCover').style.backgroundImage = 'url("' + coverSrc(P.queue[0].img, 200) + '")'
    }
    route()
    ensureLogin().then(function () {
      if (parseHash().path === '/mine') route(true)
    }).catch(function (e) {
      // 「还没填账号密码」不是登录失败，是还没配置 —— 别给它套「登录失败」的壳
      toast(e && e.needSetup ? e.message : ('登录失败：' + (e && e.message || '未知错误')))
    })
    api('/favorites').then(function (d) {
      (d.list || []).forEach(function (s) { P.favorites[s.id] = true })
    }).catch(function () {})
    // 上次开着本地插件 → 后台把插件数据拉起来并预热，等用户点歌时就不用等加载了
    if (LP.on && LP.runtime) {
      setTimeout(function () {
        loadPluginData(function (err) {
          if (err) return
          lpBuildList()
          lpWarm()
        })
      }, 1200)
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot)
  else boot()
})()
</script>
</body>
</html>
