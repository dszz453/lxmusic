<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>云音乐</title>
<style>
/* ==========================================================================
   云音乐 · 网易云质感红白卡片设计体系
   ========================================================================== */
:root{
  --brand:#ec4141; --brand-dark:#d73535; --brand-soft:#ffeceb;
  --bg:#f5f5f6; --surface:#ffffff; --surface-2:#fafafa;
  --line:#f0f0f1; --line-strong:#e6e6e7;
  --text:#2b2b2b; --text-2:#6b6b6b; --text-3:#a3a3a6; --text-inv:#fff;
  --topbar-h:52px; --tabbar-h:54px; --mini-h:58px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:10px; --radius-sm:6px;
  --shadow-1:0 1px 2px rgba(0,0,0,.04);
  --shadow-2:0 4px 16px rgba(0,0,0,.10);
  --shadow-3:0 10px 40px rgba(0,0,0,.18);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
body{overflow:hidden}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
em{font-style:normal}

#app{position:relative;height:100%;display:flex;flex-direction:column}

/* ============================ 顶部栏 ============================ */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  height:var(--topbar-h);padding:0 10px;background:var(--surface);
  position:relative;z-index:20;
}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;color:var(--text);
  transition:background-color .18s var(--ease),opacity .18s;
}
.icon-btn:active{background:rgba(0,0,0,.06)}
.icon-btn--light{color:#fff}
.icon-btn--light:active{background:rgba(255,255,255,.18)}
.icon-btn--lg svg{width:30px;height:30px}
.icon-btn--play{color:var(--brand)}
.topbar__search{
  flex:1 1 auto;display:flex;align-items:center;gap:6px;height:34px;
  padding:0 12px;background:#f2f2f3;border-radius:999px;color:var(--text-3);
  font-size:13px;min-width:0;
}
.topbar__search .ico-search{width:17px;height:17px;flex:0 0 auto}
.topbar__search span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================ 主视图 ============================ */
.view{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--mini-h) + var(--tabbar-h) + var(--safe-bottom) + 10px);
  background:var(--surface);
}
.view.is-player-open{overflow:hidden}
/* 二级页隐藏全局顶栏：页面内自带返回箭头与标题，
   两者同时出现就是「上下两个搜索框」，且上面那个点了只会跳 #/search（原地不动）。 */
#app.is-subpage .topbar{display:none}

.section{padding:16px 14px 4px}
.section__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section__title{font-size:17px;font-weight:700;letter-spacing:-.2px}
.section__more{
  font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:2px;
  border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;
}
.section__more svg{width:12px;height:12px}

/* ---------- 金刚区 ---------- */
.quickbar{display:flex;gap:0;padding:14px 8px 8px;overflow-x:auto;scrollbar-width:none}
.quickbar::-webkit-scrollbar{display:none}
.quick{
  flex:0 0 20%;min-width:0;display:flex;flex-direction:column;align-items:center;
  gap:7px;padding:4px 2px 10px;
}
.quick__icon{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.10);
}
.quick__icon svg{width:23px;height:23px}
.quick__label{font-size:12px;color:var(--text);white-space:nowrap}
.c-red{background:linear-gradient(135deg,#ff6b6b,#ec4141)}
.c-orange{background:linear-gradient(135deg,#ffb16b,#ff8a3d)}
.c-blue{background:linear-gradient(135deg,#6bb8ff,#3d8dff)}
.c-green{background:linear-gradient(135deg,#6bd9a5,#2fb87a)}
.c-purple{background:linear-gradient(135deg,#b28bff,#8a5cff)}
.c-teal{background:linear-gradient(135deg,#6be0d9,#23b7ac)}
.c-pink{background:linear-gradient(135deg,#ff8fc7,#ff5ba0)}

/* ---------- Banner ---------- */
.banner{padding:4px 14px 2px}
.banner__inner{
  position:relative;border-radius:12px;overflow:hidden;
  background:linear-gradient(120deg,#ff7a7a,#ec4141 60%,#c02f2f);
  color:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;min-height:92px;
}
.banner__bg{position:absolute;inset:0;background-image:var(--banner-bg);background-size:cover;background-position:center}
.banner__bg::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(236,65,65,.95) 0%,rgba(236,65,65,.80) 42%,rgba(190,36,36,.55) 100%)}
.banner__body{position:relative;z-index:1;min-width:0;flex:1 1 auto}
.banner__title{font-size:18px;font-weight:700;margin-bottom:4px}
.banner__desc{font-size:12px;opacity:.88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner__btn{
  margin-top:10px;display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:12px;
}
.banner__btn--refresh{margin-left:8px;background:rgba(255,255,255,.1)}
.banner__art{
  position:relative;z-index:1;width:90px;height:90px;flex:0 0 90px;border-radius:12px;
  background:rgba(255,255,255,.16);display:grid;place-items:center;overflow:hidden;
}
.banner__art svg{width:40px;height:40px;stroke-width:1.4}
.banner__art img{width:100%;height:100%;object-fit:cover}

/* ---------- 三列歌单栅格 ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:0 14px}
.card{display:block;min-width:0}
.card__cover{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:var(--radius);
  overflow:hidden;background:linear-gradient(135deg,#f0f0f2,#e4e4e8);box-shadow:var(--shadow-1);
}
.card__cover img{width:100%;height:100%;object-fit:cover;animation:imgIn .3s var(--ease) both}
@keyframes imgIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.card__badge{
  position:absolute;top:4px;right:4px;display:inline-flex;align-items:center;gap:2px;
  font-size:10px;color:#fff;background:rgba(0,0,0,.32);border-radius:999px;padding:1px 6px 1px 4px;
}
.card__badge svg{width:10px;height:10px;stroke-width:2.2}
.card__badge--play{
  top:auto;bottom:4px;right:4px;background:rgba(236,65,65,.92);width:24px;height:24px;
  padding:0;border-radius:50%;justify-content:center;
}
.card__badge--play svg{width:12px;height:12px;fill:currentColor;stroke:none}
.card__title{
  margin-top:6px;font-size:12.5px;line-height:1.35;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;
}
.card__sub{margin-top:2px;font-size:11px;line-height:1.3;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 歌曲列表 ---------- */
.songlist{padding:0 8px}
.song{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--radius-sm)}
.song:active{background:var(--surface-2)}
.song.is-playing .song__name{color:var(--brand)}
.song__index{flex:0 0 22px;text-align:center;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.song__index.is-top{color:var(--brand);font-weight:700}
.song__meta{flex:1 1 auto;min-width:0}
.song__name{font-size:14.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song__name .tag{
  display:inline-block;vertical-align:1px;font-size:9px;line-height:13px;padding:0 3px;margin-right:4px;
  border:1px solid var(--brand);color:var(--brand);border-radius:2px;
}
.song__sub{margin-top:2px;font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song__sub .dot{margin:0 4px}
.song__act{flex:0 0 auto;color:var(--text-3);width:32px;height:32px;display:grid;place-items:center}
.song__act svg{width:19px;height:19px}
.song--rich .song__cover{
  flex:0 0 44px;width:44px;height:44px;border-radius:var(--radius-sm);overflow:hidden;
  background:linear-gradient(135deg,#f0f0f2,#e4e4e8);
}
.song--rich .song__cover img{width:100%;height:100%;object-fit:cover;animation:imgIn .3s var(--ease) both}

/* ---------- 空态 / 骨架 ---------- */
.empty{padding:60px 30px;text-align:center;color:var(--text-3)}
.empty svg{width:46px;height:46px;stroke-width:1.2;opacity:.5;margin-bottom:12px}
.empty__title{font-size:14px;color:var(--text-2);margin-bottom:4px}
.empty__desc{font-size:12px;line-height:1.7}
.skeleton{padding:16px 14px}
.skeleton__row{
  height:54px;border-radius:8px;margin-bottom:10px;
  background:linear-gradient(90deg,#f2f2f3 25%,#e9e9eb 37%,#f2f2f3 63%);
  background-size:400% 100%;animation:shimmer 1.3s infinite linear;
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.spinner{
  width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;
}
.spinner--dark{border-color:rgba(0,0,0,.12);border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================ 迷你播放条 ============================ */
.miniplayer{
  position:absolute;left:8px;right:8px;bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 6px);
  height:var(--mini-h);background:rgba(255,255,255,.96);border-radius:14px;
  box-shadow:var(--shadow-2);z-index:30;overflow:hidden;
  transition:transform .28s var(--ease),opacity .2s;
}
.miniplayer[hidden]{display:none}
.miniplayer__progress{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(0,0,0,.05)}
.miniplayer__progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s linear}
.miniplayer__inner{display:flex;align-items:center;gap:10px;height:100%;padding:0 8px 0 6px}
.miniplayer__cover{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,#f0f0f2,#e0e0e4) center/cover;
  animation:rotate 22s linear infinite;animation-play-state:paused;
}
.miniplayer__cover.is-playing{animation-play-state:running}
@keyframes rotate{to{transform:rotate(360deg)}}
.miniplayer__meta{flex:1 1 auto;min-width:0}
.miniplayer__title{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miniplayer__artist{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================ 底部标签栏 ============================ */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);display:flex;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);z-index:40;
}
.tabbar__item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--text-3);font-size:10.5px;transition:color .18s;
}
.tabbar__item svg{width:21px;height:21px}
.tabbar__item.is-active{color:var(--brand)}

/* ============================ 全屏播放器 ============================ */
.player{
  /* position:fixed + 四边贴死 —— 不管父容器怎么排（#app 是 flex 列），
     播放器永远**铺满整个窗口**，背景图一直铺到状态栏与手势条底下。
     用 absolute 时它只相对 #app 定位，一旦 #app 的尺寸/内边距被改动就会露边。 */
  position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  z-index:60;display:flex;flex-direction:column;color:#fff;
  transform:translateY(100%);transition:transform .34s var(--ease);overflow:hidden;
  /* 顶部那一排（收起箭头 / 歌名）是**绝对定位钉在最上沿**的，见下面的 .player__nav。
     所以这里不再用 padding-top 去推它，只负责给它留出高度：
     状态栏实测高度（--safe-top，由原生写入）+ 那一排自身高度（36px 图标 + 上下各 2px = 40px）。
     两边数值必须对上，否则要么盖住、要么露缝。
     ⚠ 底部**不再**留 padding-bottom：那样背景会在手势条上方截断一条；
     现在改成让最底那一排（.player__bottom）自己用 --safe-bottom 让开。 */
  padding-top:calc(var(--safe-top) + 40px);
}
.player[hidden]{display:none}
.player.is-open{transform:translateY(0)}
.player__bg{position:absolute;inset:0;background:#1b1b1f center/cover}
.player__bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.82) 100%);
}
/* ⚠ 这里必须把 .player__nav 排除掉：它要靠绝对定位钉在顶部，
   被这条规则改成 position:relative 就会重新掉回文档流里被别的元素顶下去。 */
.player > *:not(.player__bg):not(.player__nav){position:relative}
/*
 * 顶部这一排：收起箭头（左）+ 歌名歌手（中）+ 音质（右）。
 *
 * 用**绝对定位**钉死在播放器最上沿，而不是靠 flex 顺序 —— 播放器铺满整个屏幕，
 * 所以「播放器最上沿」就是屏幕最上沿，这一排就在最顶部，播放器内部任何布局变化
 * （歌词区高度、底栏行数、安全区）都推不动它。要避开的只有状态栏，靠 --safe-top。
 */
.player__nav{
  position:absolute;top:0;left:0;right:0;z-index:2;
  display:flex;align-items:center;gap:6px;
  padding:calc(var(--safe-top) + 2px) 10px 2px;
}
.player__nav-info{flex:1 1 auto;min-width:0;text-align:center}
.player__nav-title{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player__nav-artist{font-size:11px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 顶栏右侧留一个与左侧图标等宽的占位，保证中间的「歌名 / 歌手」是真正居中的。
   音质按钮已经挪到播放器**最底一排**（见 .player__bottom），这里不再放任何按钮。 */
.player__nav-spacer{flex:0 0 36px;height:36px}
#btnQuality{
  font-size:11px;font-weight:600;width:auto;padding:0 10px;
  border:1px solid rgba(255,255,255,.34);border-radius:999px;height:26px;
}
.player__stage{flex:1 1 auto;position:relative;min-height:0}
.player__stage.show-lyric .player__disc{opacity:0;transform:scale(.9);pointer-events:none}
.player__stage.show-lyric .player__lyric{opacity:1;pointer-events:auto}
.player__disc{
  position:absolute;inset:0;display:grid;place-items:center;padding:12px;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.player__cover{
  width:min(72vw,300px);aspect-ratio:1/1;border-radius:50%;position:relative;
  background:#2a2a30 center/cover;
  box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 0 0 8px rgba(255,255,255,.05);
  animation:rotate 26s linear infinite;animation-play-state:paused;
}
.player__cover::after{
  content:'';position:absolute;inset:0;margin:auto;width:26%;aspect-ratio:1/1;border-radius:50%;
  background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.player__cover.is-playing{animation-play-state:running}
.player__lyric{
  position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);
  overflow:hidden;padding:10px 26px;display:flex;align-items:center;
}
.lyric-scroll{width:100%;text-align:center;transition:transform .38s var(--ease);will-change:transform}
/*
  高亮行字号明显放大（网易云 App 的观感，比原库的 15/17px 再大一档）。
  用 min-height 固定行高：字号在 16→22 之间过渡时不引起重排，
  否则 alignLyricTo 量到的行高会在过渡途中变化，高亮行会慢慢偏离正中。
*/
.lyric-line{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:48px;padding:2px 0;
  font-size:16px;line-height:1.4;color:rgba(255,255,255,.42);
  transition:color .18s var(--ease),font-size .18s var(--ease);
}
.lyric-line.is-active{
  color:#fff;font-size:22px;font-weight:700;
  text-shadow:0 2px 16px rgba(0,0,0,.5);
}
.lyric-line__main{display:block}
.lyric-line__sub{display:block;margin-top:3px;font-size:.68em;font-weight:400;opacity:.8;color:rgba(255,255,255,.85)}
.lyric-empty{color:rgba(255,255,255,.5);font-size:13px;display:block;min-height:0}
.lyric-cal{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px 0;
  opacity:.42;transition:opacity .2s var(--ease);
}
.lyric-cal:active{opacity:1}
.lyric-cal__label{font-size:11px;color:rgba(255,255,255,.7)}
.lyric-cal__btn{
  width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.lyric-cal__btn:active{background:rgba(255,255,255,.32)}
.lyric-cal__val{
  min-width:46px;height:24px;padding:0 8px;border-radius:12px;background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.8);font-size:11.5px;
}
.lyric-cal__val[data-off="1"]{color:#ffd54f;background:rgba(255,255,255,.2)}
/*
  歌名 / 歌手：音源（平台）名直接缀在**歌手后面**，跟 Web 端 `.player__artist`
  （`artist + ' · ' + song.sourceName`）是同一个版式 —— 早先这里另起一行放了一个
  带平台底色的胶囊徽章，跟 Web 端长得不一样，已按用户要求去掉。
  插件名不在这里，它在最底那一行（`.player__footer`）。
*/
.player__meta{padding:4px 22px 0}
.player__title{font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player__artist{font-size:12.5px;opacity:.72;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player__actions{display:flex;gap:6px;padding:8px 16px 0;align-items:center}
/* 音质按钮钉在这一行最右端（这一行就是「进度条上面那一行」） */
.player__actions #btnQuality{margin-left:auto}
.player__progress{display:flex;align-items:center;gap:9px;padding:12px 20px 2px;font-size:10.5px;opacity:.82;font-variant-numeric:tabular-nums}
.range{position:relative;flex:1 1 auto;height:22px;display:flex;align-items:center}
.range__track{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.26);overflow:hidden}
.range__track i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.range__thumb{
  position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.player__controls{display:flex;align-items:center;justify-content:space-between;padding:2px 22px 8px}
.play-btn{width:62px;height:62px;border-radius:50%;background:#fff;color:#1b1b1f;display:grid;place-items:center}
.play-btn svg{width:28px;height:28px}
.play-btn:active{transform:scale(.95)}
/*
 * 播放器最底一排：**插件名**（就在播放按钮正下面）。
 * 文案格式跟 Web 端 `.player__footer` 的 setFooter('音源：' + hit.from) 对齐 ——
 * 前缀是「音源：」，内容是从 `/url` 的 from 里取出来的插件名。
 * 音质按钮不在这里 —— 它在「进度条上面那一行」（.player__actions）的最右端。
 * 平台名（网易/酷狗/酷我）也不在这里，它缀在歌手那一行后面（.player__artist）。
 * --safe-bottom 挪到这一排上，播放器本体的背景才能真正铺满整屏。
 */
.player__bottom{
  display:flex;align-items:center;justify-content:center;gap:10px;flex:0 0 auto;
  padding:2px 16px calc(var(--safe-bottom) + 10px);
}
.player__footer{
  flex:0 1 auto;min-width:0;text-align:center;
  font-size:10.5px;opacity:.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ============================ 抽屉 / 对话框 ============================ */
.sheet{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet__mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .24s}
.sheet.is-open .sheet__mask{opacity:1}
.sheet__panel{
  position:relative;background:var(--surface);border-radius:16px 16px 0 0;max-height:76%;
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .28s var(--ease);padding-bottom:var(--safe-bottom);
}
.sheet.is-open .sheet__panel{transform:translateY(0)}
.sheet__head{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;
  border-bottom:1px solid var(--line);font-weight:700;
}
.sheet__head em{color:var(--text-3);font-weight:400;font-size:12px;margin-left:4px}
.sheet__body{overflow-y:auto;padding:6px 0 12px;-webkit-overflow-scrolling:touch}
.sheet--dialog{justify-content:center;align-items:center;z-index:80}
.sheet--dialog .sheet__panel{
  width:calc(100% - 56px);max-width:330px;max-height:74%;border-radius:16px;padding-bottom:0;
  transform:translateY(6px) scale(.94);opacity:0;transition:transform .2s var(--ease),opacity .2s var(--ease);
}
.sheet--dialog.is-open .sheet__panel{transform:translateY(0) scale(1);opacity:1}
.sheet--dialog .sheet__head{padding:16px 16px 10px;border-bottom:0;font-size:15.5px}
.sheet--dialog .sheet__body{padding:0 16px 16px}
.dialog__msg{font-size:13.5px;line-height:1.6;color:var(--text-2);word-break:break-word}
.dialog__acts{display:flex;gap:10px;margin-top:16px}
.dialog__acts > *{flex:1 1 0;min-width:0}
.menu-item{display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:14.5px}
.menu-item:active{background:var(--surface-2)}
.menu-item svg{width:19px;height:19px;color:var(--brand);flex:0 0 auto}
.menu-item__text{flex:1 1 auto;min-width:0}
.menu-item__desc{font-size:11.5px;color:var(--text-3);margin-top:1px}
.menu-item__badge{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.menu-item__chev{color:var(--text-3);width:16px;height:16px;flex:0 0 auto}

/* ============================ 表单 / 卡片块 ============================ */
.block{padding:14px}
.block + .block{border-top:8px solid var(--bg)}
.field{margin-bottom:10px}
.field__label{font-size:12px;color:var(--text-2);margin-bottom:6px}
.input,.textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:14px;background:var(--surface-2);color:var(--text);outline:none;font-family:inherit;
}
.input:focus,.textarea:focus{border-color:var(--brand);background:#fff}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;
  border-radius:999px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;
  transition:opacity .18s,transform .12s;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.btn--block{width:100%}
.btn--ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line-strong)}
.btn--sm{height:32px;padding:0 13px;font-size:12.5px}
.card-block{
  background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
  box-shadow:var(--shadow-1);
}
.card-block__head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-block__name{font-size:14.5px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-block__desc{font-size:12px;color:var(--text-3);line-height:1.6;word-break:break-word}
.pill{
  display:inline-block;font-size:10.5px;line-height:16px;padding:0 7px;border-radius:999px;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-strong);margin:2px 4px 2px 0;
}
.pill--ok{background:#eaf9f1;color:#1f9d63;border-color:#c7eeda}
.pill--bad{background:#fdeeee;color:#d73535;border-color:#f7d3d3}
.pill--brand{background:var(--brand-soft);color:var(--brand);border-color:#ffd5d4}
.pill--warn{background:#fff6e6;color:#b26a00;border-color:#ffe2b8}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;cursor:pointer;background:#d9d9d9;border-radius:999px;transition:background .2s}
.switch i::after{
  content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch input:checked + i{background:var(--brand)}
.switch input:checked + i::after{transform:translateX(20px)}
/*
 * 「默认搜索源」列表（与 Web 管理页同一套 class 名，但交互换成 ↑↓ 按钮）。
 * 用 grid 而不是 flex 排：序号列宽度固定，名字列吃掉剩余空间并在过长时省略号，
 * 这样右移/下移按钮与开关永远贴在右边、不会因为平台名长短而错位。
 */
.srclist{display:flex;flex-direction:column;gap:6px}
.srcrow{
  display:grid;grid-template-columns:22px 1fr 30px 30px auto;align-items:center;gap:6px;
  background:var(--bg-2,#f6f7f9);border-radius:var(--radius-sm,8px);padding:6px 8px;
}
.srcrow__no{font-size:12px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}
.srcrow__name{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow__mv{
  width:28px;height:28px;border:0;border-radius:8px;background:#fff;color:var(--text-2);
  font-size:14px;line-height:1;cursor:pointer;
}
.srcrow__mv:disabled{opacity:.32;cursor:default}
.srcrow__mv:not(:disabled):active{background:var(--brand);color:#fff}
/* 评分排行行：序号 / 插件名 / 分数（三列，别复用 .srcrow 的 5 列网格） */
.scorerow{
  display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;
  background:var(--bg-2,#f6f7f9);border-radius:var(--radius-sm,8px);padding:7px 8px;
}
.scorerow__no{font-size:12px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}
.scorerow__main{min-width:0}
.scorerow__name{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scorerow__meta{font-size:11px;color:var(--text-3);margin-top:2px}
.srcfoot{display:flex;align-items:center;gap:10px;margin-top:10px}
.srcfoot__state{flex:1 1 auto;font-size:11.5px;color:var(--text-3);line-height:1.5}
.srcfoot__state.is-dirty{color:var(--brand)}
.note{font-size:11.5px;color:var(--text-3);line-height:1.7}
.note b{color:var(--text-2)}
.errdetail{
  margin:8px 16px 0;background:#fff8e8;border:1px solid #ffe2b0;border-radius:var(--radius-sm);
  padding:7px 10px;font-size:11.5px;color:#9a6a12;line-height:1.6;
}
.errdetail > summary{cursor:pointer;list-style:none}
.errdetail > summary::-webkit-details-marker{display:none}
.errdetail > summary::before{content:'⚠ '}
.errdetail__raw{
  margin:7px 0 0;padding:7px 8px;background:rgba(255,255,255,.75);border-radius:6px;font-size:10.5px;
  color:var(--text-2);white-space:pre-wrap;word-break:break-all;max-height:180px;overflow:auto;
}

/* ============================ Toast ============================ */
.toast{
  position:absolute;left:50%;bottom:calc(var(--tabbar-h) + var(--mini-h) + var(--safe-bottom) + 22px);
  transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.82);color:#fff;font-size:13px;
  padding:9px 16px;border-radius:999px;z-index:90;opacity:0;transition:opacity .2s,transform .2s;
  max-width:84vw;text-align:center;pointer-events:none;
}
.toast[hidden]{display:none}
.toast.is-show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================ 搜索页 ============================ */
.searchbar{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;position:sticky;top:0;z-index:10;background:var(--surface)}
/*
 * 二级页的搜索栏让开状态栏。
 *
 * 正常情况下顶栏是显示的，`--safe-top` 被原生置为 0，这条规则等于没生效
 * （8px + 0px 就是原来的 8px）。它只在「原生顶栏被藏起来」时才起作用 ——
 * 那时 WebView 顶到 y=0（窗口是边到边的），而 .searchbar 是 sticky top:0，
 * 会正好落进状态栏底下：看着像「搜索框跑到最顶部」，点上去被系统状态栏吃掉。
 *
 * 这是一道保险，不是主修：主修是 openPlayer/closePlayer 里那个 playerOpen 竞态
 * （见脚本里 playerOpen 的说明）。共用前端 public/css/app.css 早就这么写了，
 * 这份单文件前端漏了，补上。
 */
#app.is-subpage .view .searchbar{padding-top:calc(8px + var(--safe-top))}
.searchbar__back{flex:0 0 auto}
.searchbar__input{
  flex:1 1 auto;height:36px;border-radius:999px;border:0;background:#f2f2f3;padding:0 14px;
  font-size:13.5px;outline:none;min-width:0;
}
.searchbar__input:focus{background:#eaeaea}
.searchbar__btn{flex:0 0 auto;font-size:14px;color:var(--brand);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 12px}
.chips--scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips--scroll::-webkit-scrollbar{display:none}
.chip{
  font-size:12px;padding:5px 12px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line-strong);color:var(--text-2);white-space:nowrap;flex:0 0 auto;
}
.chip.is-active{background:var(--brand);border-color:var(--brand);color:#fff}
.chip--del{display:inline-flex;align-items:center;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong)}
.chip--del span{padding:5px 4px 5px 12px;color:var(--text-2);font-size:12px;white-space:nowrap}
.chip__del{padding:4px 9px 4px 2px;color:var(--text-3);font-size:13px}

/* ---------- 通用头部（详情页） ---------- */
.pagehead{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.pagehead__title{flex:1 1 auto;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detailhero{display:flex;gap:14px;padding:8px 16px 18px}
.detailhero__cover{
  width:112px;height:112px;flex:0 0 112px;border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,#f0f0f2,#e4e4e8);box-shadow:var(--shadow-2);
}
.detailhero__cover img{width:100%;height:100%;object-fit:cover}
.detailhero__info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.detailhero__name{font-size:17px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detailhero__desc{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.6}
.detailhero__acts{display:flex;gap:8px;margin-top:12px}
.miniplay-btn{
  display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 14px;border-radius:999px;
  background:var(--brand);color:#fff;font-size:12.5px;font-weight:600;
}
.miniplay-btn--ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line-strong)}
.miniplay-btn svg{width:15px;height:15px}

/* ---------- 我的页 ---------- */
.profile{display:flex;align-items:center;gap:14px;padding:18px 18px 16px;background:var(--surface)}
.profile__avatar{
  width:62px;height:62px;border-radius:50%;flex:0 0 62px;display:grid;place-items:center;
  background:linear-gradient(135deg,#ff7a7a,#ec4141);color:#fff;font-size:24px;font-weight:700;
  box-shadow:0 6px 16px rgba(236,65,65,.3);
}
.profile__name{font-size:18px;font-weight:700}
.profile__sub{font-size:12px;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statrow{display:flex;background:var(--surface);padding:0 0 14px}
.stat{flex:1;text-align:center}
.stat__num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.stat__label{font-size:11px;color:var(--text-3);margin-top:2px}
.linecard{background:var(--surface);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-1)}
.linecard__top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.linecard__dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:0 0 auto}
.linecard__dot.is-on{background:#2fb87a;box-shadow:0 0 0 3px rgba(47,184,122,.18)}
.linecard__name{font-size:14px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linecard__url{font-size:11.5px;color:var(--text-3);word-break:break-all;line-height:1.55}
.linecard__acts{display:flex;gap:8px;margin-top:10px}
.settingsgroup{background:var(--surface);margin-bottom:8px}

/* ==========================================================================
   视觉增强 + 下载 / 歌曲操作面板 / 播放器加固
   —— 统一圆角、层级阴影与按压反馈；列表加发丝分隔线，信息密度更高但不拥挤
   ========================================================================== */
:root{
  --shadow-1:0 1px 3px rgba(17,17,26,.05);
  --shadow-2:0 6px 20px rgba(17,17,26,.09);
  --shadow-brand:0 6px 18px rgba(236,65,65,.28);
}
.topbar{box-shadow:0 1px 0 var(--line)}
.icon-btn:active{transform:scale(.94)}

/* ---------- 歌曲行 ---------- */
.song{gap:11px;padding:9px 8px;transition:background-color .16s var(--ease)}
.song + .song{border-top:1px solid var(--line)}
.song__cover{width:46px;height:46px;border-radius:9px;overflow:hidden;flex:0 0 46px;background:linear-gradient(135deg,#f0f0f2,#e4e4e8)}
.song__cover img{width:100%;height:100%;object-fit:cover}
.song__name{font-weight:500}
.song.is-playing .song__name{font-weight:600}
.song__acts{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.song__act{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);
  transition:background-color .16s var(--ease),color .16s var(--ease);
}
.song__act:active{background:var(--surface-2);color:var(--brand)}
.song__act--brand{color:var(--brand)}
.song__act--danger{color:#e05555}

/* ---------- 菜单项：图标做成圆角色块，标题/描述层级分明 ---------- */
.menu-item{gap:12px;padding:12px 16px;transition:background-color .16s var(--ease)}
.menu-item + .menu-item{border-top:1px solid var(--line)}
.menu-item:active{background:#f7f7f8}
.menu-item__ico{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);
}
.menu-item__ico svg{width:18px;height:18px}
.menu-item__title{font-size:14.5px;font-weight:500}
.menu-item__desc{font-size:11.5px;color:var(--text-3);margin-top:2px}
.menu-item__chev{width:15px;height:15px;color:#c9c9cd}

/* ---------- 我的页 ---------- */
.profile{gap:14px;padding:20px 18px 14px}
.profile__main{flex:1 1 auto;min-width:0}
.profile__name{font-size:19px;font-weight:700;letter-spacing:-.2px}
.profile__tags{display:flex;flex-wrap:wrap;margin-top:6px}
.profile__url{margin-top:6px;font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statrow{padding:4px 8px 16px;gap:2px}
.stat{display:block;flex:1;text-align:center;padding:10px 4px;border-radius:10px;transition:background-color .16s var(--ease)}
.stat:active{background:var(--surface-2)}
.stat__num{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat__label{font-size:11px;color:var(--text-3);margin-top:3px}
.groupTitle{font-size:12.5px;font-weight:600;color:var(--text-3);padding:10px 18px 6px;letter-spacing:.3px}
.settingsgroup{border-radius:var(--radius);margin:0 12px 10px;overflow:hidden;box-shadow:var(--shadow-1)}

/* ---------- 详情页操作按钮 ---------- */
.detailhero__acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.miniplay-btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:999px;
  background:var(--brand);color:#fff;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-brand);transition:transform .12s var(--ease),opacity .16s;
}
.miniplay-btn:active{transform:scale(.96)}
.miniplay-btn--ghost{background:var(--surface);color:var(--text);border:1px solid var(--line-strong);box-shadow:none}
.miniplay-btn--ghost:active{background:var(--surface-2)}
.miniplay-btn svg{width:16px;height:16px}
.miniplay-btn__count{font-weight:500;opacity:.8;font-size:12px}
.linkbtn{font-size:12px;color:var(--brand);padding:4px 10px;border-radius:999px}
.linkbtn:active{background:var(--brand-soft)}

/* ---------- 歌曲操作面板头部 ---------- */
.songsheet{display:flex;align-items:center;gap:12px;padding:10px 16px 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.songsheet img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:0 0 54px;background:#eee}
.songsheet__info{flex:1 1 auto;min-width:0}
.songsheet__name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songsheet__sub{font-size:12px;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 下载 ---------- */
.dlgroup{background:var(--surface);border-radius:var(--radius);margin:10px 12px;padding:12px 14px;box-shadow:var(--shadow-1)}
.dlgroup__head{font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:10px}
.dlrow + .dlrow{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dlrow__top{display:flex;align-items:center;gap:8px}
.dlrow__name{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlrow__cancel{font-size:12px;color:var(--brand);padding:3px 10px;border:1px solid var(--brand);border-radius:999px}
.dlrow__sub{font-size:11px;color:var(--text-3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px}
.dlbar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#ff7a7a,#ec4141);transition:width .25s linear}
.dlrow__pct{font-size:11px;color:var(--text-3);margin-top:5px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- 空状态更轻 ---------- */
.empty{padding:52px 30px}
.empty svg{opacity:.38}

/* ---------- 抽屉：顶部加一个抓取条，圆角更大 ---------- */
.sheet__head{position:relative;padding-top:18px}
.sheet__head::before{
  content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:36px;height:4px;border-radius:2px;background:#e2e2e5;
}
.sheet__panel{box-shadow:0 -8px 32px rgba(0,0,0,.16)}

/* ---------- 底部标签栏 ---------- */
.tabbar__item{transition:color .16s var(--ease),transform .16s var(--ease)}
.tabbar__item:active{transform:scale(.94)}

@media (prefers-color-scheme:dark){
  /* 原生壳内固定浅色（网易云经典红白），不跟随系统深色，避免与原生红顶栏割裂 */
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 顶部栏 ===== -->
  <header class="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="菜单">

  lx.utils.crypto.rsaEncrypt 用得到），Chrome 67 以下的 WebView 连解析都过不去。
  这是有意为之 —— 与其为了老设备把 BigInt 抠掉（要拆模块，代价大得多），
  不如让它在支持的设备上可用、在不支持的设备上整体不可用。
  页面侧统一用 `window.LXCore` 存不存在来判定，并把「本地插件」开关置灰说明原因；

   * 所以统一升协议；其余图床（如酷我 img2.sycdn.kuwo.cn）证书有问题，保持原协议。

  /* ------------------------------ 封面图缓存 ------------------------------ */
  /**
   * 首页/榜单的封面每次回到列表都要重新拉一遍，好几秒不显示 —— 根因是页面跑在 file:// 源下，

  var IMG = {}          // url -> data:URL
  var IMG_REQ = {}      // reqId -> url

  var IMG_SEQ = 0
  // 1x1 透明 GIF：占位用，避免 WebView 再为同一个 URL 发一次请求

  }

    if (pend) { pend.push(el); return }

    IMG_WAIT[u] = [el]
    if (!imgCacheReady()) { applyCover(el, u); delete IMG_WAIT[u]; return }

    applyCover(el, IMG_BLANK)                     // 先占位，等原生回图
    var reqId = 'im' + (++IMG_SEQ) + '_' + Date.now()
    IMG_REQ[reqId] = u
    try {
      window.YunBridge.fetchImage(reqId, u)
    } catch (e) {
      delete IMG_REQ[reqId]; delete IMG_WAIT[u]; applyCover(el, u); return
    }

    setTimeout(function () {

      delete IMG_REQ[reqId]
      var waiting = IMG_WAIT[u]
      delete IMG_WAIT[u]
      if (!waiting) return
      for (var i = 0; i < waiting.length; i++) {

   *
   * 但「当前音源只提供了试听片段（30s / 223s）——可换个音质或换条音源再试」
   * 这种要解释原因的句子，1.9 秒根本读不完（实测读一半就消失了），
   * 所以允许调用方指定更长的停留时间。
   */
  function toast(msg, ms) {
    var t = $('#toast')
    if (!t) return
    t.textContent = msg
    t.hidden = false
    requestAnimationFrame(function () { t.classList.add('is-show') })
    clearTimeout(toast._t)
    toast._t = setTimeout(function () {
      t.classList.remove('is-show')
      setTimeout(function () { t.hidden = true }, 220)
    }, ms || 1900)
  }

  /* ------------------------------ 原生网络桥 ------------------------------ */
  var pending = {}
  var reqSeq = 0

  function nativeHttp(url, method, headers, body, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var reqId = 'r' + (++reqSeq) + '_' + Date.now()
      var timer = setTimeout(function () {
        if (pending[reqId]) {
          delete pending[reqId]
          reject(new Error('请求超时（' + Math.round((timeoutMs || 40000) / 1000) + 's）'))
        }
      }, timeoutMs || 40000)
      pending[reqId] = { resolve: resolve, reject: reject, timer: timer }

      if (window.YunBridge && window.YunBridge.httpFetch) {
        try {
          window.YunBridge.httpFetch(reqId, url, method || 'GET',
            JSON.stringify(headers || {}), body == null ? '' : String(body))
        } catch (e) {
          clearTimeout(timer); delete pending[reqId]
          reject(new Error('原生请求通道异常：' + (e && e.message)))
        }
      } else {
        // 浏览器内预览降级
        fetch(url, { method: method || 'GET', headers: headers || {}, body: body || null })
          .then(function (res) { return res.text().then(function (txt) { return { status: res.status, body: txt } }) })
          .then(function (r) { clearTimeout(timer); delete pending[reqId]; resolve(r) })
          .catch(function (e) { clearTimeout(timer); delete pending[reqId]; reject(e) })
      }
    })
  }

  window.onNativeHttpCallback = function (data) {
    if (!data || !data.reqId) return
    var entry = pending[data.reqId]
    if (!entry) return
    delete pending[data.reqId]
    clearTimeout(entry.timer)
    if (data.error) entry.reject(new Error(data.error))
    else entry.resolve({ status: data.status, body: data.body })
  }

  /* ============================ 本地插件 ============================ */
  /*
   * 把落雪（LX）插件搬到**本机**跑。
   *
   * 原来客户端只会问远端要地址（`/api/url`），插件跑在服务端。服务端那条线路不通、
   * 或者服务端没开某个插件时，本机就一点办法都没有。这里补上第二条路：
   * 开关打开 → 本地插件优先解析，全都失败再退回服务端兜底（用户明确要的行为）。
   *
   * ⚠ 为什么插件必须放 Worker 里跑，而不是直接 new Function：
   *   内置插件里有重度混淆的（自研字节码解释器）。实测 pdone-lx 在求值阶段会把
   *   JS 引擎**直接搞死** —— 不抛异常、try/catch 拦不住、连退出钩子都不触发。
   *   在主线程求值就等于「一个第三方插件能把整个 App 变成白屏」。
   *   放 Worker 里，崩也只崩那一个 Worker，页面活着。
   *
   * ⚠ 为什么 Worker 用 Blob 而不是 new Worker('lxworker.js')：
   *   页面是 file:// 源，`new Worker('file://...')` 会被同源策略直接拒掉
   *   （"Script at 'file://...' cannot be accessed from origin 'null'"）。
   *   只能把源码塞进 Blob 再 createObjectURL。这条路在少数 WebView 上也可能不通，
   *   所以另有一条「主线程 + 黑名单」的降级路径，见 lpStart()。
   *
   * 运行时的加密/编码垫片来自 window.LXCore（由 tools/build-client-lxcore.mjs
   * 从服务端同一份源码打包），这里不重复实现。
   */

  /**
   * 主线程降级时**必须**排除的插件 —— 它们求值就会杀死 JS 引擎。
   * 名单与服务端 src/generated/plugin-skip.js 同源（tools/plugin-prescreen.mjs 生成）。
   * Worker 路径下不需要它（崩的是 Worker），只有降级路径才用得上。
   */
  var LP_SKIP = ['pdone-lx']

  var LP = {
    // 总开关。true = 本地插件优先（失败退回服务端）；false = 只用服务端。
    on: false,
    // lxcore.js 有没有加载成功（老 WebView 上可能整个文件解析失败）
    runtime: !!window.LXCore,
    // Worker 能不能用。为 false 时走主线程降级（带 LP_SKIP 黑名单）
    worker: false,
    // 插件数据（plugins.data.js）是否已加载
    data: false,
    _loading: false,
    _wait: [],
    // 全部插件：内置 + 用户导入
    list: [],
    // 跑分结果 { at, bySource, byId }；null = 从没跑过
    scores: null,
    scoring: false,
    // 插件实例：id -> { worker|host, ready, error, meta, sources, seq, pending }
    inst: {},
    // 缓存设置
    cache: { url: true, audio: true, limitMb: 500 },
    // 最近一次取流是谁给的（本地 / 服务端），页面用来显示来源
    lastFrom: '',
    // 本地/服务端各取了多少次，设置页显示，也方便排查
    stat: { local: 0, server: 0 }
  }

  var LP_KEYS = {
    on: 'ym.lp.on',
    enabled: 'ym.lp.enabled',     // { id: bool }
    imported: 'ym.lp.imported',   // [{id,name,url,script}]
    scores: 'ym.lp.scores',
    cache: 'ym.lp.cache',
    stat: 'ym.lp.stat'
  }

  function lpRestore() {
    LP.on = store.get(LP_KEYS.on, false) === true
    var c = store.get(LP_KEYS.cache, null)
    if (c && typeof c === 'object') {
      LP.cache = {
        url: c.url !== false,
        audio: c.audio !== false,
        limitMb: Math.max(50, Math.min(4096, Number(c.limitMb) || 500))
      }
    }
    var s = store.get(LP_KEYS.scores, null)
    if (s && typeof s === 'object' && s.byId) LP.scores = s
    var st = store.get(LP_KEYS.stat, null)
    if (st && typeof st === 'object') LP.stat = { local: Number(st.local) || 0, server: Number(st.server) || 0 }
  }

  function lpSaveCache() { store.set(LP_KEYS.cache, LP.cache) }
  function lpSaveStat() { store.set(LP_KEYS.stat, LP.stat) }

  /** 从插件源码头部的 `@name / @version / @author` 注释里抠元信息 */
  function lpParseMeta(script) {
    var head = String(script).slice(0, 4000)
    var block = head.match(/\/\*\*([\s\S]*?)\*\//) || head.match(/\/\*([\s\S]*?)\*\//)
    var region = block ? block[1] : head
    var meta = {}
    var lines = region.split('\n')
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/@(\w+)\s+(.*)/)
      if (!m) continue
      var key = m[1].toLowerCase()
      if (key === 'name' || key === 'version' || key === 'author' || key === 'description' || key === 'homepage' || key === 'repository') {
        meta[key] = m[2].trim().replace(/\*\/\s*$/, '').trim()
      }
    }
    return {
      name: meta.name || '未命名音源',
      version: meta.version || '1.0.0',
      author: meta.author || '未知',
      description: meta.description || '',
      homepage: meta.homepage || meta.repository || ''
    }
  }

  /** 简易稳定哈希，给导入的插件生成 id（插件源码很长，只取头尾算，够用且快） */
  function lpHash(str) {
    var s = String(str)
    var h = 5381
    var probe = s.slice(0, 4000) + '\u0000' + s.slice(-4000) + '\u0000' + s.length
    for (var i = 0; i < probe.length; i++) h = ((h << 5) + h + probe.charCodeAt(i)) >>> 0
    return h.toString(36)
  }

  /**
   * 懒加载插件数据（plugins.data.js，约 760KB）。
   *
   * 为什么不写成 `<script src="plugins.data.js">`：绝大多数用户不会开本地插件，
   * 静态引入等于让每个人每次冷启动都白解析 760KB。只有第一次真正要用时才插进来。
   * 多个调用方并发时会排队，不会重复插。
   */
  function loadPluginData(cb) {
    if (LP.data) { if (cb) cb(null); return }
    // 宿主已经把插件数据注进来了（自测里换成小替身，或将来做成内联版）：
    // 不必再插一次 script，也就不会因为取不到文件而永远等不到回调。
    // 真实设备上不会命中这条 —— plugins.data.js 只由下面动态插入。
    if (Array.isArray(window.LX_BUNDLED_PLUGINS)) { LP.data = true; if (cb) cb(null); return }
    if (cb) LP._wait.push(cb)
    if (LP._loading) return
    LP._loading = true
    var s = document.createElement('script')
    s.src = 'plugins.data.js'
    s.onload = function () { LP.data = true; lpFlushDataWait(null) }
    s.onerror = function () { lpFlushDataWait(new Error('插件数据文件加载失败')) }
    document.head.appendChild(s)
  }

  function lpFlushDataWait(err) {
    LP._loading = false
    var q = LP._wait
    LP._wait = []
    for (var i = 0; i < q.length; i++) { try { q[i](err) } catch (e) { } }
  }

  /**
   * 组装插件清单：内置 + 用户导入，并把启停状态并进来。
   *
   * 导入的插件 id 统一加 `user:` 前缀 —— 否则用户导入一份与内置同名的插件时，
   * 两者的 id 会撞在一起（内置 id 来自 build.mjs 的文件名），启停状态互相覆盖，
   * 表现是「启用了导入的那个，结果内置那个也亮了」。
   */
  function lpBuildList() {
    var enabled = store.get(LP_KEYS.enabled, {}) || {}
    var imported = store.get(LP_KEYS.imported, []) || []
    var out = []
    var builtin = (window.LX_BUNDLED_PLUGINS || [])
    for (var i = 0; i < builtin.length; i++) {
      var b = builtin[i]
      if (!b || !b.script) continue
      out.push({
        id: b.id, name: b.name || '', url: b.url || '', script: b.script,
        origin: 'builtin',
        // 默认**全部关闭**：22 个插件里不少是同一平台的重复源，全开会把取流拖慢，
        // 而且用户第一次开这个功能时还没跑过分，不知道该信谁。跑分后会提示开哪些。
        enabled: enabled[b.id] === true
      })
    }
    for (var j = 0; j < imported.length; j++) {
      var u = imported[j]
      if (!u || !u.script) continue
      var uid = u.id.indexOf('user:') === 0 ? u.id : ('user:' + u.id)
      out.push({
        id: uid, name: u.name || '', url: u.url || '', script: u.script,
        origin: 'user',
        enabled: enabled[uid] !== false   // 用户主动导入的，默认就开
      })
    }
    for (var k = 0; k < out.length; k++) {
      out[k].meta = lpParseMeta(out[k].script)
      if (!out[k].name) out[k].name = out[k].meta.name
      out[k].bytes = out[k].script.length
      /*
       * 已经加载过的插件：把平台声明带回来。
       * lpBuildList 是**重建**清单（每次导入 / 删除 / 跑分完都会调），新建的对象上
       * 没有 sources —— 不补回来的话，「哪些插件支持哪些平台」会被当场抹掉，
       * 候选筛选立刻失效（表现是「刚才还能播，删个插件之后本地插件就全失灵了」）。
       */
      var inst = LP.inst[out[k].id]
      if (inst && inst.sources) out[k].sources = inst.sources
      if (LP.scores && LP.scores.byId && LP.scores.byId[out[k].id]) out[k].score = LP.scores.byId[out[k].id]
      /*
       * 各平台**各自的**分数，跟着插件对象一起带出来。
       * 候选排序（lpCandidates）要按「当前播放的那个源」排，插件行也要显示各源明细 ——
       * 每次都去 LP.scores.bySource 里翻一遍既啰嗦又容易漏，挂到对象上最省事。
       */
      if (LP.scores && LP.scores.bySource) {
        var bySrc = {}
        for (var sk in LP.scores.bySource) {
          if (!Object.prototype.hasOwnProperty.call(LP.scores.bySource, sk)) continue
          var one = LP.scores.bySource[sk][out[k].id]
          if (one) bySrc[sk] = one
        }
        out[k].scoreBySource = bySrc
      }
    }
    LP.list = out
    return out
  }

  function lpById(id) {
    for (var i = 0; i < LP.list.length; i++) if (LP.list[i].id === id) return LP.list[i]
    return null
  }

  /** 已启用的插件（按 id） */
  function lpEnabledIds() {
    var out = []
    for (var i = 0; i < LP.list.length; i++) if (LP.list[i].enabled) out.push(LP.list[i].id)
    return out
  }

  function lpSetEnabled(id, on) {
    var p = lpById(id)
    if (!p) return
    p.enabled = !!on
    var map = store.get(LP_KEYS.enabled, {}) || {}
    map[id] = !!on
    store.set(LP_KEYS.enabled, map)
  }

  function lpRemove(id) {
    var imported = store.get(LP_KEYS.imported, []) || []
    var next = []
    for (var i = 0; i < imported.length; i++) {
      var uid = imported[i].id.indexOf('user:') === 0 ? imported[i].id : ('user:' + imported[i].id)
      if (uid !== id) next.push(imported[i])
    }
    store.set(LP_KEYS.imported, next)
    lpStop(id)
    lpBuildList()
  }

  function lpImport(script, url, name) {
    var s = String(script || '').trim()
    if (!s) throw new Error('插件内容为空')
    if (s.length < 200) throw new Error('内容太短，看着不像插件脚本')
    var meta = lpParseMeta(s)
    var id = 'user:' + lpHash(s)
    /*
     * 显示名优先用插件自己声明的 @name，`name` 只当兜底。
     * 从文件导入时传进来的是**文件名**（如 lx-music-source.js），拿它当显示名
     * 既长又认不出是哪个源；插件头部的 @name 才是它想让人看到的名字。
     */
    var label = meta.name || name || ''
    var imported = store.get(LP_KEYS.imported, []) || []
    var replaced = false
    for (var i = 0; i < imported.length; i++) {
      var uid = imported[i].id.indexOf('user:') === 0 ? imported[i].id : ('user:' + imported[i].id)
      if (uid === id) {
        imported[i] = { id: id, name: label, url: url || imported[i].url || '', script: s }
        replaced = true
        break
      }
    }
    if (!replaced) imported.push({ id: id, name: label, url: url || '', script: s })
    store.set(LP_KEYS.imported, imported)
    lpBuildList()
    return { id: id, replaced: replaced, meta: meta }
  }

  /* ------------------------------ 插件的 HTTP 通道 ------------------------------ */

  function lpToBytes(v) {
    if (v == null) return new Uint8Array(0)
    if (v instanceof Uint8Array) return v
    if (v instanceof ArrayBuffer) return new Uint8Array(v)
    if (ArrayBuffer.isView(v)) return new Uint8Array(v.buffer, v.byteOffset, v.byteLength)
    if (typeof v === 'string') return window.LXCore.crypto.utf8Encode(v)
    if (Array.isArray(v)) return Uint8Array.from(v)
    return window.LXCore.crypto.utf8Encode(String(v))
  }

  function lpNormMode(mode) {
    return String(mode || 'cbc').toLowerCase().indexOf('ecb') >= 0 ? 'ecb' : 'cbc'
  }

  function lpFormEncode(obj) {
    var parts = []
    for (var k in obj) {
      if (!Object.prototype.hasOwnProperty.call(obj, k)) continue
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(obj[k] == null ? '' : obj[k]))
    }
    return parts.join('&')
  }

  /**
   * 插件发起 HTTP 的唯一出口 —— 走原生桥（YunBridge.httpFetch）。
   *
   * 为什么必须走原生：各音乐源站基本不回 ACAO 头，页面在 file:// 源下直接
   * fetch 会被同源策略拦掉；而且很多直链还绑 UA / Referer，只有原生那层
   * 才能如实把请求头带出去。网页版（public/js/lxplugin.js）这里是转发给
   * 服务端代理，壳里没有服务端，所以直接落到原生。
   *
   * ⚠ 原生桥回的是**文本**（Java 侧按 UTF-8 读成 String）。插件取流只读 JSON，
   *   所以够用；但别拿它去下音频二进制 —— 那条路是 downloadSong。
   */
  function lpHttp(url, options, callback) {
    options = options || {}
    var method = String(options.method || 'get').toUpperCase()
    var headers = {}
    for (var hk in (options.headers || {})) {
      if (Object.prototype.hasOwnProperty.call(options.headers, hk)) headers[hk] = options.headers[hk]
    }
    var body = null
    if (options.form) {
      body = lpFormEncode(options.form)
      if (!lpHasHeader(headers, 'content-type')) headers['Content-Type'] = 'application/x-www-form-urlencoded'
    } else if (options.formData) {
      // 原生桥不带 multipart。降级成 urlencoded —— 本项目插件基本只用 form，
      // 与网页版 public/js/native.js 的处理一致。
      body = lpFormEncode(options.formData)
      if (!lpHasHeader(headers, 'content-type')) headers['Content-Type'] = 'application/x-www-form-urlencoded'
    } else if (options.body !== undefined && options.body !== null) {
      body = typeof options.body === 'string' ? options.body : JSON.stringify(options.body)
      if (!lpHasHeader(headers, 'content-type')) headers['Content-Type'] = 'application/json'
    }

    var cancelled = false
    var timeout = Number(options.timeout) > 0 ? Number(options.timeout) : 15000
    nativeHttp(url, method, headers, body, timeout).then(function (res) {
      if (cancelled) return
      var text = res.body == null ? '' : String(res.body)
      var parsed = text
      if (options.json !== false) { try { parsed = JSON.parse(text) } catch (e) { /* 保留原文 */ } }
      try { callback(null, { statusCode: res.status, status: res.status, headers: {}, raw: text, body: parsed }, parsed) } catch (e) { }
    }).catch(function (e) {
      if (cancelled) return
      try { callback(e, null, null) } catch (e2) { }
    })
    return function cancel() { cancelled = true }
  }

  function lpHasHeader(headers, name) {
    var lower = String(name).toLowerCase()
    for (var k in headers) if (Object.prototype.hasOwnProperty.call(headers, k) && k.toLowerCase() === lower) return true
    return false
  }

  /* ------------------------------ 主线程降级用的 LX 宿主 ------------------------------ */
  /**
   * 复刻 lxworker.js 里的 globalThis.lx（协议必须逐字对齐，否则插件读不到 utils）。
   * 只在 Worker 不可用时才走这条路 —— 插件直接跑在页面线程里，风险见 LP 顶部注释。
   */
  function lpMakeHost() {
    var C = window.LXCore.crypto
    var U = window.LXCore.util
    var B = U.createBufferShim()
    var handlers = {}
    var state = { inited: null, updateAlert: null }
    var lx = {
      version: '2.0.0',
      env: 'desktop',
      EVENT_NAMES: { request: 'request', inited: 'inited', updateAlert: 'updateAlert' },
      currentScriptInfo: null,
      on: function (name, fn) { if (typeof fn === 'function') handlers[name] = fn },
      send: function (name, data) {
        if (name === 'inited') state.inited = data || null
        else if (name === 'updateAlert') { if (!state.updateAlert) state.updateAlert = data || null }
      },
      request: function (url, options, cb) { return lpHttp(url, options || {}, cb) },
      utils: {
        buffer: {
          from: function (v, e) { return B.from(v, e) },
          bufToString: function (b, f) { return U.bufToString(b, f) }
        },
        crypto: {
          md5: function (s) { return C.md5(typeof s === 'string' ? s : U.bufToString(s)) },
          randomBytes: function (n) { return B.from(C.randomBytes(Number(n) || 16)) },
          aesEncrypt: function (buf, mode, key, iv) {
            return B.from(C.aesEncryptRaw(lpToBytes(buf), lpToBytes(key), lpNormMode(mode), iv ? lpToBytes(iv) : undefined))
          },
          aesDecrypt: function (buf, mode, key, iv) {
            return B.from(C.aesDecryptRaw(lpToBytes(buf), lpToBytes(key), lpNormMode(mode), iv ? lpToBytes(iv) : undefined))
          },
          rsaEncrypt: function (buf, key) { return B.from(C.rsaEncryptRaw(lpToBytes(buf), U.bufToString(key, 'utf8'))) }
        },
        zlib: {
          inflate: function (buf) { return U.inflateRaw(lpToBytes(buf)).then(function (o) { return B.from(o) }) },
          deflate: function (buf) { return U.deflateRaw(lpToBytes(buf)).then(function (o) { return B.from(o) }) }
        }
      }
    }
    return { lx: lx, handlers: handlers, state: state }
  }

  /* ------------------------------ Worker 探测与启动 ------------------------------ */

  /**
   * 探一次 Blob Worker 能不能用。
   *
   * 为什么要「探」而不是「试着创建就算成功」：`file://` 源下有些 WebView
   * 允许 `new Worker(blobUrl)` 返回一个对象，但脚本**根本不会被执行** ——
   * 没有任何异常，只是永远收不到消息。所以判据是「能不能收到 ready 握手」。
   */
  function lpProbeWorker(cb) {
    if (!LP.runtime || !window.LXCore.WORKER_SRC) return cb(false)
    var url, w
    try {
      url = URL.createObjectURL(new Blob([window.LXCore.WORKER_SRC], { type: 'application/javascript' }))
      w = new Worker(url)
    } catch (e) { return cb(false) }
    var done = false
    var timer = setTimeout(function () { finish(false) }, 2500)
    function finish(ok) {
      if (done) return
      done = true
      clearTimeout(timer)
      try { w.terminate() } catch (e) { }
      try { URL.revokeObjectURL(url) } catch (e) { }
      cb(ok)
    }
    w.onmessage = function (ev) {
      var m = ev && ev.data
      if (m && m.type === 'ready') finish(true)
    }
    w.onerror = function () { finish(false) }
  }

  /**
   * 探一次「Blob Worker 能不能用」，结果缓存住，整场只探一次。
   *
   * ⚠ 这里以前是**写好了却没有任何调用点**：lpProbeWorker 一直在，但没人调它，
   *   于是 LP.worker 恒为 false，所有插件都在**主线程**里求值 ——
   *   「插件跑在独立 Worker 里、个别脚本出错只影响它自己」这条隔离等于没做。
   *   代价是实打实的：pdone-lx 这类脚本求值时会直接杀死 JS 引擎（不抛异常、
   *   try/catch 拦不住），隔离在的时候它只是自己加载失败，隔离没了就是整个应用白屏。
   *   （同一类「桥写好了没接线」的问题，test/client-wiring.test.mjs 的文件头里记过一次。）
   *
   * 判据是「能不能收到 Worker 的 ready 握手」而不是「new Worker 有没有抛异常」：
   * file:// 源下有些 WebView 允许创建成功但脚本根本不执行 —— 无异常、永远收不到消息。
   */
  var lpWorkerProbe = null   // null = 还没探过；Promise<boolean> = 探过了

  function lpEnsureWorkerProbe() {
    if (lpWorkerProbe) return lpWorkerProbe
    lpWorkerProbe = new Promise(function (resolve) {
      if (!LP.runtime || !window.LXCore || !window.LXCore.WORKER_SRC) return resolve(false)
      try {
        lpProbeWorker(function (ok) {
          LP.worker = !!ok
          resolve(!!ok)
        })
      } catch (e) {
        LP.worker = false
        resolve(false)
      }
    })
    return lpWorkerProbe
  }

  /**
   * 确保某插件的实例已就绪。返回 Promise<inst|null>。
   *
   * 状态机：idle → loading → ready / failed。
   * `failed` 是**终态**：同一个插件加载失败过就不再反复重试 ——
   * 每次取流都拿一个坏插件去试一遍，会让「跳下一首」变成一件很慢的事。
   * 用户可以在设置页点「重新加载」把它清回 idle。
   *
   * ⚠ 必须**先等 Worker 探测出结果**再决定在哪儿求值：插件一旦在主线程求值完，
   *   就没有「再搬到 Worker 里」这一说了，隔离性是不可逆的。
   */
  function lpEnsure(id, timeoutMs) {
    return lpEnsureWorkerProbe().then(function () {
      return lpEnsureNow(id, timeoutMs)
    })
  }

  function lpEnsureNow(id, timeoutMs) {
    return new Promise(function (resolve) {
      var it = LP.inst[id]
      if (it && it.state === 'ready') return resolve(it)
      if (it && it.state === 'failed') return resolve(null)
      if (it && it.state === 'loading') { it.waiters.push(resolve); return }
      var p = lpById(id)
      if (!p) return resolve(null)
      it = LP.inst[id] = { state: 'loading', waiters: [resolve], plugin: p, meta: p.meta, sources: null, error: '', seq: 0, pending: {} }
      lpStartInstance(it, timeoutMs || 12000)
    })
  }

  function lpSettle(it, ok, error) {
    it.state = ok ? 'ready' : 'failed'
    if (!ok) it.error = error || '加载失败'
    /*
     * ⚠ 插件声明的平台必须写回**清单条目**（p.sources），不能只留在实例上（it.sources）。
     *   候选筛选（lpCandidates）、跑分（lpScoreAll）、自动勾选（lpAutoEnableFromScores）、
     *   列表展示（lpRow）读的全是 p.sources。
     *   漏了这一步的表现是：插件加载**成功**、日志一切正常，但永远选不中它 ——
     *   开关打开也永远退回服务端，跑分永远报「没有可测的组合」。不报错，只是功能没了。
     */
    if (ok && it.sources && it.plugin) it.plugin.sources = it.sources
    var ws = it.waiters
    it.waiters = []
    for (var i = 0; i < ws.length; i++) { try { ws[i](ok ? it : null) } catch (e) { } }
  }

  function lpStartInstance(it, timeoutMs) {
    var p = it.plugin
    // 主线程降级时，黑名单里的插件**绝不能**求值 —— 它们会直接杀死 JS 引擎。
    var needFallback = !LP.worker
    if (needFallback && LP_SKIP.indexOf(p.id) >= 0) {
      return lpSettle(it, false, '该插件会杀死 JS 引擎，仅在 Worker 可用时才能加载')
    }
    if (LP.worker) {
      try {
        lpStartWorker(it, timeoutMs)
        return
      } catch (e) {
        // 创建失败就降级，别让一个插件把整条路堵死
        LP.worker = false
      }
    }
    lpStartInline(it, timeoutMs)
  }

  function lpStartWorker(it, timeoutMs) {
    var url = URL.createObjectURL(new Blob([window.LXCore.WORKER_SRC], { type: 'application/javascript' }))
    var w = new Worker(url)
    it.worker = w
    it.blobUrl = url
    var settled = false
    var timer = setTimeout(function () {
      if (settled) return
      settled = true
      lpSettle(it, false, '插件加载超时（' + Math.round(timeoutMs / 1000) + 's）')
    }, timeoutMs)

    w.onmessage = function (ev) {
      var m = (ev && ev.data) || {}
      if (m.type === 'ready') return
      if (m.type === 'loaded') {
        if (settled) return
        settled = true
        clearTimeout(timer)
        it.sources = m.sources || {}
        it.meta = m.meta || it.meta
        it.updateAlert = m.updateAlert || null
        lpSettle(it, true)
        return
      }
      if (m.type === 'http') { lpWorkerHttp(it, w, m); return }
      if (m.type === 'result') { lpTakePending(it, m.id, null, m.result); return }
      if (m.type === 'error') {
        if (m.stage === 'load' || !settled) {
          if (settled) return
          settled = true
          clearTimeout(timer)
          lpSettle(it, false, m.error || '插件报错')
          return
        }
        lpTakePending(it, m.id, new Error(m.error || '插件调用失败'), null)
        return
      }
    }
    w.onerror = function (e) {
      if (settled) return
      settled = true
      clearTimeout(timer)
      lpSettle(it, false, (e && e.message) || 'Worker 内部错误')
    }
    w.postMessage({ type: 'load', id: it.plugin.id, script: it.plugin.script, initTimeout: 8000 })
  }

  /** Worker 把请求转发回主线程 —— 由这里真正发出去，再把结果投回去 */
  function lpWorkerHttp(it, w, m) {
    lpHttp(m.url, m.options || {}, function (err, resp, body) {
      var result
      if (err) result = { error: (err && err.message) || String(err) }
      else result = { status: resp.status, raw: resp.raw, body: body, headers: resp.headers || {} }
      try { w.postMessage({ type: 'httpResponse', id: m.id, result: result }) } catch (e) { }
    })
  }

  function lpTakePending(it, id, err, value) {
    var e = it.pending[id]
    if (!e) return
    delete it.pending[id]
    clearTimeout(e.timer)
    if (err) e.reject(err)
    else e.resolve(value)
  }

  /** 主线程降级：直接在页面线程里求值（风险见 LP 顶部注释） */
  function lpStartInline(it, timeoutMs) {
    var host = lpMakeHost()
    it.host = host
    var prev = window.lx
    window.lx = host.lx
    try {
      var fn = new Function(String(it.plugin.script))
      fn.call(window)
    } catch (e) {
      window.lx = prev
      return lpSettle(it, false, (e && e.message) || '插件求值失败')
    }
    // 相当多插件的 inited 是在 Promise 链里异步发出的（典型：先拉一次源信息
    // 再声明 sources），所以这里必须等一等，不能同步读完就判死刑。
    var t0 = Date.now()
    var limit = Math.min(Number(timeoutMs) || 8000, 15000)
    ;(function tick() {
      if (host.state.inited && host.state.inited.sources) {
        it.sources = host.state.inited.sources
        it.updateAlert = host.state.updateAlert || null
        window.lx = prev
        return lpSettle(it, true)
      }
      if (Date.now() - t0 >= limit) {
        window.lx = prev
        return lpSettle(it, false, '脚本未发送 inited 事件或未声明 sources')
      }
      setTimeout(tick, 50)
    })()
  }

  /** 调用插件的一个 action。返回 Promise（resolve 结果值，reject 错误） */
  function lpInvoke(id, source, action, info, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var it = LP.inst[id]
      if (!it || it.state !== 'ready') return reject(new Error('插件未就绪'))
      var timeout = Number(timeoutMs) || 20000
      if (it.worker) {
        var mid = 'i' + (++it.seq)
        it.pending[mid] = {
          resolve: resolve, reject: reject,
          timer: setTimeout(function () {
            delete it.pending[mid]
            reject(new Error('插件调用超时'))
          }, timeout)
        }
        try { it.worker.postMessage({ type: 'invoke', id: mid, source: source, action: action, info: info }) }
        catch (e) { delete it.pending[mid]; reject(e) }
        return
      }
      // 主线程降级：直接调 handler
      var handler = it.host && it.host.handlers && it.host.handlers.request
      if (typeof handler !== 'function') return reject(new Error('插件未注册 request 处理器'))
      var settled = false
      var timer = setTimeout(function () { if (!settled) { settled = true; reject(new Error('插件调用超时')) } }, timeout)
      Promise.resolve().then(function () { return handler({ source: source, action: action, info: info }) })
        .then(function (v) { if (!settled) { settled = true; clearTimeout(timer); resolve(v) } })
        .catch(function (e) { if (!settled) { settled = true; clearTimeout(timer); reject(e) } })
    })
  }

  function lpStop(id) {
    var it = LP.inst[id]
    if (!it) return
    try { if (it.worker) it.worker.terminate() } catch (e) { }
    try { if (it.blobUrl) URL.revokeObjectURL(it.blobUrl) } catch (e) { }
    delete LP.inst[id]
  }

  /** 把所有实例清掉重来（设置页的「重新加载」用） */
  function lpReset() {
    for (var id in LP.inst) if (Object.prototype.hasOwnProperty.call(LP.inst, id)) lpStop(id)
    LP.inst = {}
  }

  /* ------------------------------ 候选插件与取流 ------------------------------ */

  /** 某平台上有哪些**已启用**的插件支持取流 */
  function lpCandidates(source) {
    var out = []
    for (var i = 0; i < LP.list.length; i++) {
      var p = LP.list[i]
      if (!p.enabled) continue
      var info = p.sources && p.sources[source]
      if (!info) continue
      var acts = info.actions
      if (Array.isArray(acts) && acts.indexOf('musicUrl') < 0) continue
      out.push(p)
    }
    // 排序：**该平台**跑分高的先 → 同分（或都没分）的按清单原序。
    // 没跑过分的排在跑过分的后面 —— 一份实测过的数据总比「不知道好不好」可信。
    out.sort(function (a, b) {
      var sa = lpScoreForSource(a, source)
      var sb = lpScoreForSource(b, source)
      if (sa !== sb) return sb - sa
      return 0
    })
    return out
  }

  /** 平台短名（评分卡 chips 与插件行明细用）。 */
  var LP_SRC_SHORT = { wy: '网易', kg: '酷狗', kw: '酷我', tx: 'QQ', mg: '咪咕', xm: '喜马' }
  function lpSrcShort(key) { return LP_SRC_SHORT[key] || key }

  /**
   * 这个插件在**指定平台**上的实测分。
   *
   * ⚠ 为什么不能直接用综合分：一个插件在 wy 上 90 分、在 kg 上 0 分，综合分是 90；
   *   拿它去排 kg 的候选，会把一个在 kg 上根本取不到流的插件排到最前面 ——
   *   用户每次点 kg 的歌都先试它、先失败一次才轮到能用的那个。
   *   Web 管理页是按平台各排一份的（`byPlatform`），这里对齐它。
   * 该平台没有分数时退回综合分；连综合分都没有返回 -1（未测，排最后）。
   */
  function lpScoreForSource(p, source) {
    var bySrc = p.scoreBySource && p.scoreBySource[source]
    if (bySrc && typeof bySrc.score === 'number') return bySrc.score
    if (p.score && typeof p.score.score === 'number') return p.score.score
    return -1
  }

  /** 各平台分数一行文本：`网易 85 分 · 酷狗 60 分 · QQ 不可用`（没跑过则返回空串） */
  function lpPerSourceText(p) {
    var m = p.scoreBySource
    if (!m) return ''
    var parts = []
    for (var k in m) {
      if (!Object.prototype.hasOwnProperty.call(m, k)) continue
      var r = m[k]
      parts.push(lpSrcShort(k) + ' ' + (r.ok ? (r.score + ' 分') : '不可用'))
    }
    return parts.join(' · ')
  }

  /**
   * 把「页面里的歌曲对象」还原成**插件要的 musicInfo**。
   *
   * ⚠ 这一步是本地插件能不能取流的命门。漏了它的症状是：
   *   「同一个插件在服务端测得好好的，手机上所有歌都播不出来、每首都退回服务端」。
   *
   * 根因：服务端 `/api/search` 回给页面的是 `songForWeb()` **裁剪过**的对象 ——
   *   只有 id / source / name / singer / albumName / interval / img / qualities，
   *   **没有 hash、也没有 songmid**（那是取流必需的平台标识）。而插件要的正是它们：
   *   实测 22 个内置插件里 9 个读 `musicInfo.songmid`、8 个读 `musicInfo.hash`、
   *   还有读 mid / rid / musicrid / mediaMid 的。喂一个缺字段的对象进去，插件连
   *   请求都拼不出来 —— 加载一切正常、日志一切正常，就是永远解不出地址。
   *
   * 而**字段本来就在手里**：服务端 `encodeSongId()`（src/lib/songid.js）把取流必需的
   *   键一起塞进了 `song.id`（base64url 的 JSON：s/i/h/a/m/n/g/t/p）。服务端自己取流时
   *   也是先 `decodeSongId(id)` 再喂插件 —— 客户端照做即可，不用再多问服务端一次
   *   （那会让「服务端不可用时靠插件兜底」这件事重新依赖服务端）。
   */
  function lpDecodeSongId(id) {
    var s = String(id == null ? '' : id)
    if (!s) return null
    // 与服务端 decodeSongId 一致：兼容 `kg:HASH` 这种极简写法
    var plain = s.match(/^(kg|wy|kw|tx)[:：](.+)$/i)
    if (plain) {
      // 酷狗的「极简 id」就是它自己的 hash，服务端 decodeSongId 也是这么认的
      var ps = plain[1].toLowerCase()
      return { s: ps, i: plain[2], h: ps === 'kg' ? plain[2] : '' }
    }
    try {
      var b64 = s.replace(/-/g, '+').replace(/_/g, '/')
      while (b64.length % 4) b64 += '='
      // atob 只认 latin1；先 escape 成 %XX 再 decodeURIComponent 才能还原 UTF-8 中文
      var o = JSON.parse(decodeURIComponent(escape(window.atob(b64))))
      if (!o || !o.s) return null
      return o
    } catch (e) { return null }
  }

  /** 解不出来（老数据 / 非本服务端来源）就**原样返回**，绝不抛出去影响播放 */
  function lpMusicInfo(song) {
    var d = lpDecodeSongId(song && song.id)
    if (!d) return song
    var mi = {}
    for (var k in song) if (Object.prototype.hasOwnProperty.call(song, k)) mi[k] = song[k]
    var sid = String(d.i || '')
    mi.source = d.s || song.source
    mi.songmid = sid
    mi.id = sid || song.id
    mi.hash = d.h || ''
    mi.albumId = d.a || ''
    mi.mediaMid = d.m || ''
    if (d.n) mi.name = d.n
    if (d.g) mi.singer = d.g
    if (d.t) mi.interval = d.t
    if (d.p) mi.img = d.p
    /*
     * 同义字段：同一个「平台 id」，各插件按自己平台的叫法取 ——
     * QQ 用 mid / mediaMid / strMediaMid、酷我用 rid、咪咕用 musicrid / musicId。
     * 都指到同一个值上，省得为每个平台各维护一份映射表。
     * （types / _types 服务端的 decodeSongId 也不给，这里显式置空以保持**同形**：
     *   客户端喂给插件的东西，要和服务端喂的一模一样。）
     */
    if (sid) {
      if (!mi.mid) mi.mid = sid
      if (!mi.rid) mi.rid = sid
      if (!mi.musicrid) mi.musicrid = sid
      if (!mi.musicId) mi.musicId = sid
      if (!mi.songId) mi.songId = sid
    }
    if (mi.mediaMid) {
      if (!mi.strMediaMid) mi.strMediaMid = mi.mediaMid
      if (!mi.media_mid) mi.media_mid = mi.mediaMid
    }
    if (!mi.album) mi.album = mi.albumName || ''
    if (!mi.songName) mi.songName = mi.name || ''
    if (!mi.types) mi.types = []
    if (mi._types === undefined) mi._types = null
    return mi
  }

  /**
   * 用本地插件解析一首歌的地址。返回候选数组（形状与 /url 的 urls 一致）。
   *
   * 几个刻意的取舍：
   *  · **并发**发起而不是串行 —— 串行试 4 个插件、每个最坏 20 秒，用户要干等一分多钟。
   *  · 第一条结果到手后给 **800ms 聚合窗口**：既不为一条慢候选干等，又能把同一瞬间
   *    就绪的其他候选一起收进来。多候选是「播一段就跳下一首」修复的前提
   *    （见 useNextFullCandidate —— 片段要靠换同曲的下一条候选来救）。
   *  · 只取前 4 个候选插件。22 个插件里同平台的重复源很多，全试一遍收益递减，
   *    却会把首播拖到不可接受。
   */
  function lpResolve(song, opts) {
    opts = opts || {}
    return new Promise(function (resolve) {
      var cands = lpCandidates(song.source)
      if (!cands.length) return resolve([])
      var picked = cands.slice(0, Number(opts.max) || 4)
      var out = []
      var left = picked.length
      var done = false
      var grace = 0
      var hard = setTimeout(function () { finish() }, Number(opts.hardMs) || 15000)
      function finish() {
        if (done) return
        done = true
        if (grace) clearTimeout(grace)
        clearTimeout(hard)
        resolve(out)
      }
      function push(c) {
        out.push(c)
        if (!grace) grace = setTimeout(finish, 800)
      }
      for (var i = 0; i < picked.length; i++) {
        (function (p, idx) {
          Promise.resolve()
            .then(function () { return lpEnsure(p.id, 8000) })
            .then(function (it) {
              if (!it) return null
              return lpInvoke(p.id, song.source, 'musicUrl', { type: P.quality, musicInfo: lpMusicInfo(song) }, 20000)
            })
            .then(function (url) {
              if (url && typeof url === 'string' && /^https?:\/\//.test(url)) {
                push({ url: url, from: 'plugin:' + ((p.meta && p.meta.name) || p.name), size: 0, trial: false, rank: idx })
              }
            })
            .catch(function () { /* 单个插件失败不影响其他候选 */ })
            .then(function () { if (--left <= 0) finish() })
        })(picked[i], i)
      }
    })
  }

  /**
   * 预热：后台把**所有已启用**的插件逐个加载起来。
   *
   * 为什么值得做：插件加载（求值 + 拉源信息）动辄 2~5 秒，如果等用户点歌时才做，
   * 首播就会卡这一下。开关一打开就先烘着，之后取流就是即时的。
   * 并发压到 2 —— 同时开一堆 Worker 在低端机上会把内存顶爆（每个插件几十到几百 KB
   * 的源码 + 解析后的 AST）。
   *
   * ⚠ 不能按「已启用 **且支持某平台**」来筛（曾经就是那么写的）：插件支持哪些平台
   *   是它 inited 时才声明的，加载之前 `p.sources` 是空的 —— 拿它去筛一个都筛不出来，
   *   预热等于没做，首播照样干等 2~5 秒。要预热就按「已启用」这一个条件。
   */
  function lpWarm() {
    if (!LP.on || !LP.runtime) return
    var uniq = []
    var seen = {}
    for (var i = 0; i < LP.list.length; i++) {
      var p = LP.list[i]
      if (!p.enabled || seen[p.id]) continue
      seen[p.id] = 1
      uniq.push(p.id)
    }
    var cursor = 0
    function next() {
      if (cursor >= uniq.length) return
      var id = uniq[cursor++]
      var it = LP.inst[id]
      if (it && (it.state === 'ready' || it.state === 'loading' || it.state === 'failed')) return next()
      lpEnsure(id, 10000).then(function () { next() }, function () { next() })
    }
    // 并发 2 条泳道
    next()
    next()
  }

  /**
   * 并发受限的 map：同时最多跑 limit 个。
   *
   * 为什么要限：跑分要逐个把插件加载起来（每个几十到几百 KB 源码 + 解析结果），
   * 一次性全开在低端机上会把内存顶爆；不限并发就是「功能能用但机器扛不住」。
   * 单个任务抛错不影响其他任务（这也是跑分能继续的原因）。
   */
  function lpMapLimit(items, limit, fn) {
    var cursor = 0
    function lane() {
      if (cursor >= items.length) return Promise.resolve()
      var item = items[cursor++]
      return Promise.resolve()
        .then(function () { return fn(item) })
        .catch(function () { })
        .then(lane)
    }
    var lanes = []
    var n = Math.max(1, Math.min(Number(limit) || 1, items.length))
    for (var i = 0; i < n; i++) lanes.push(lane())
    return Promise.all(lanes)
  }

  /* ------------------------------ 直链缓存 ------------------------------ */
  /**
   * 缓存「解析出来的地址」，而不是音频字节。
   *
   * ⚠ 它只是个**短期加速**：音乐源给的直链基本都带时效（几十分钟到几小时），
   *   还大量绑 IP / UA。所以 TTL 压到 20 分钟，过期即弃 —— 缓存一个已经烂掉的
   *   地址比不缓存更糟（表现是「点了没反应」，还看不出为什么）。
   *   真正省流量的字节缓存是另一套，见缓存设置里的「音频缓存」。
   */
  var LP_URL_TTL = 20 * 60 * 1000
  var LP_URL_MAX = 120
  /*
   * 本地插件解析的**硬超时**。取流路径上绝不能等满 lpResolve 的默认 15 秒：
   * 手机上插件要么几秒内出结果（第一个候选回来 800ms 就收尾），要么就是全军覆没，
   * 让它慢慢耗 15 秒的后果是用户盯着「加载中」十几秒，然后才退服务端 ——
   * 观感就是「开了本地插件以后歌都放不出来」。6 秒足够正常的插件出结果。
   * ⚠ 只作用于**取流**；跑分（lpScoreAll）走自己的超时，不受这里影响。
   */
  var LP_RESOLVE_HARD_MS = 6000

  function lpUrlKey(song) { return song.source + ':' + song.id + ':' + P.quality }

  function lpUrlCacheGet(key) {
    if (!LP.cache.url) return null
    var all = store.get('ym.lp.urlcache', null)
    if (!all) return null
    var e = all[key]
    if (!e || !e.v || (Date.now() - (e.at || 0)) > LP_URL_TTL) return null
    return e.v
  }

  function lpUrlCacheSet(key, v) {
    if (!LP.cache.url || !v) return
    var all = store.get('ym.lp.urlcache', null)
    if (!all || typeof all !== 'object') all = {}
    var keys = Object.keys(all)
    if (keys.length >= LP_URL_MAX) {
      // 简单裁剪：按时间排掉最旧的一半。不做 LRU，不值得为这点收益引入复杂度。
      keys.sort(function (a, b) { return (all[a].at || 0) - (all[b].at || 0) })
      for (var i = 0; i < Math.ceil(keys.length / 2); i++) delete all[keys[i]]
    }
    all[key] = { at: Date.now(), v: v }
    store.set('ym.lp.urlcache', all)
  }

  /**
   * 丢掉某首歌的地址缓存。
   *
   * 为什么必须有它：本地插件解出来的地址**不保证播得出来**，而这条坏地址会被
   * 缓存 20 分钟。播放器发现播不了、回头重新解析时又会命中同一条坏地址 ——
   * 来回打转，永远退不到服务端。所以「本地候选失败」那一刻必须把它清掉。
   */
  function lpUrlCacheDel(key) {
    var all = store.get('ym.lp.urlcache', null)
    if (!all || typeof all !== 'object' || !all[key]) return
    delete all[key]
    store.set('ym.lp.urlcache', all)
  }

  function lpUrlCacheClear() { store.del('ym.lp.urlcache') }

  /* ------------------------------ 音频缓存 ------------------------------ */
  /**
   * 缓存音频**字节本体**，而不是解析出来的地址。
   *
   * ── 为什么字节这一层才有意义 ──────────────────────────────────
   * 音乐源给的直链基本都带时效（几十分钟到几小时），还大量绑 IP / UA。
   * 缓存「地址」= 缓存了一个很快会烂掉的东西，第二次点歌照样得重新解析
   * （所以上面那份直链缓存只留 20 分钟，它只是短期加速）。
   * 缓存字节才是真正省流量、第二次秒开的那一份。键用「平台:id:音质」这种
   * 不随时间变的组合。
   *
   * ── 为什么必须落在 Java 侧 ────────────────────────────────────
   * 原生桥 httpFetch 回的是**文本**（Java 按 UTF-8 读成 String），拿它下音频
   * 会把二进制读成乱码。所以由 Java 用 HttpURLConnection 落盘到 App 私有目录，
   * JS 只拿一个路径 —— 播放时 <audio src="file:///..."> 直接用本地文件。
   * 顺带也绕开了「file:// 页面 fetch 跨域会被拦」这个死结。
   *
   * ── 为什么是「整首听完才存」────────────────────────────────────
   * 边听边存听着省事，实际做不对：<audio> 播到哪存到哪，中途切歌会留下一堆
   * 残缺的半截文件，下次命中反而放不出来（表现是「缓存了却播不了」）。
   * 宁可不命中，也不留半成品 —— 与网页版 public/js/audiocache.js 同口径。
   */
  function audioCacheSupported() {
    return !!(window.YunBridge && window.YunBridge.audioCacheGet)
  }

  function audioCacheKey(song) { return song.source + '_' + song.id + '_' + P.quality }

  /** 查本机有没有这首的缓存；有就返回本地文件 URL，没有返回 null */
  function audioCacheGet(song) {
    if (!LP.cache.audio || !audioCacheSupported()) return null
    try {
      var p = window.YunBridge.audioCacheGet(audioCacheKey(song))
      if (!p) return null
      p = String(p)
      /*
       * 原生回的是文件系统绝对路径（/data/user/0/...）。直接当 src 用，是个
       * **根相对 URL**，只是碰巧因为「页面本身就在 file:// 源下」才解析成
       * file:///data/... —— 太依赖运行环境了。显式补上 scheme：解析结果确定，
       * 也不怕以后页面被挪到别的源下（比如做成在线版）。
       */
      if (/^[a-z][a-z0-9+.-]*:\/\//i.test(p)) return p
      return 'file://' + (p.charAt(0) === '/' ? '' : '/') + p
    } catch (e) { return null }
  }

  /** 让原生去下载并落盘（异步，不阻塞播放） */
  function audioCachePut(song, url) {
    if (!LP.cache.audio || !audioCacheSupported() || !url) return
    if (/^file:/i.test(url)) return   // 已经是本地文件，没什么可缓的
    try {
      window.YunBridge.audioCachePut(audioCacheKey(song), url, LP.cache.limitMb * 1024 * 1024)
    } catch (e) { }
  }

  function audioCacheTrim() {
    if (!audioCacheSupported()) return
    try { window.YunBridge.audioCacheTrim(LP.cache.limitMb * 1024 * 1024) } catch (e) { }
  }

  function audioCacheClear() {
    return new Promise(function (resolve) {
      if (!audioCacheSupported()) return resolve(0)
      var done = false
      window.__lpCacheClearCb = function (bytes) {
        if (done) return
        done = true
        window.__lpCacheClearCb = null
        LP.audioBytes = 0
        resolve(bytes)
      }
      try { window.YunBridge.audioCacheClear() } catch (e) { window.__lpCacheClearCb(0) }
      setTimeout(function () { if (window.__lpCacheClearCb) window.__lpCacheClearCb(0) }, 6000)
    })
  }

  /** 刷新「当前占用」——只改那一个节点，绝不整页重渲染 */
  function audioCacheRefreshStat() {
    if (!audioCacheSupported()) return
    try { window.YunBridge.audioCacheStat() } catch (e) { }
  }

  window.onNativeAudioCacheStat = function (d) {
    LP.audioBytes = Number((d && d.bytes) || 0)
    var el = $('#lpCacheSize')
    if (el) el.textContent = LP.audioBytes ? ('当前占用 ' + fmtBytes(LP.audioBytes) + '。') : '当前还没有缓存文件。'
  }

  window.onNativeAudioCacheCleared = function (d) {
    LP.audioBytes = 0
    var el = $('#lpCacheSize')
    if (el) el.textContent = '当前还没有缓存文件。'
    if (window.__lpCacheClearCb) window.__lpCacheClearCb(Number((d && d.bytes) || 0))
  }

  /** 「我的」页那一行菜单的副标题 —— 不依赖插件数据是否已加载 */
  function lpDesc() {
    if (!LP.runtime) return '本机不支持 · 走服务端'
    if (!LP.on) return '已关闭 · 走服务端解析'
    var map = store.get(LP_KEYS.enabled, null) || {}
    var n = 0
    for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k) && map[k]) n++
    return n ? ('已启用 ' + n + ' 个插件 · 本机取流') : '已启用 · 尚未勾选插件'
  }

  /**
   * 解析播放地址 —— **本地插件优先，失败自动退回服务端**。
   *
   * 用户明确要的行为：开关打开时优先本地，但本地全都解析不出来时不能就此哑掉，
   * 得退回服务端兜底（否则插件一失效，用户就彻底听不了歌了）。
   * 返回形状与 `/api/url` 对齐，这样 candidateList() 一行都不用改。
   */
  function resolveUrl(song) {
    if (!song || !song.id) return Promise.reject(new Error('缺少歌曲信息'))
    var key = lpUrlKey(song)
    var hit = lpUrlCacheGet(key)
    if (hit) { LP.lastFrom = hit.local ? 'local' : 'server'; return Promise.resolve(hit) }

    /*
     * 「本地到底试过没有」看的是**有没有候选可试**，不是「有没有成功」。
     * 早先写在「解出结果」那个分支里，于是本地全军覆没时这个标记还是 false，
     * 「已改用服务端」那句提示永远不出现 —— 用户只会觉得插件白开了。
     * 反过来，开关开着但一个插件都没勾，那不叫「本地失败」，不该提示。
     */
    var localTried = !!(LP.on && LP.runtime && lpCandidates(song.source).length)
    var local = (LP.on && LP.runtime)
      ? lpResolve(song, { hardMs: LP_RESOLVE_HARD_MS }).then(function (cands) {
        if (cands && cands.length) {
          LP.stat.local++
          lpSaveStat()
          var r = { urls: cands, url: cands[0].url, from: cands[0].from, local: true }
          lpUrlCacheSet(key, r)
          return r
        }
        return null
      }, function () {
        // 插件抛异常（而不是「没解出结果」）也要退服务端，不能把整首判死
        return null
      })
      : Promise.resolve(null)

    return local.then(function (r) {
      if (r) { LP.lastFrom = 'local'; return r }
      return api('/url?id=' + encodeURIComponent(song.id) + '&q=' + P.quality + '&fast=1')
        .then(function (r2) {
          r2 = r2 || {}
          r2.local = false
          LP.stat.server++
          lpSaveStat()
          lpUrlCacheSet(key, r2)
          LP.lastFrom = 'server'
          // 本地试过但全军覆没 —— 说一声，否则用户只会觉得「插件白开了」，
          // 不知道这次其实是服务端救回来的（设置页的统计里也能看到）。
          if (localTried) toast('本地插件没解出地址，已改用服务端', 3200)
          return r2
        })
    })
  }

  /* ------------------------------ 插件跑分 ------------------------------ */
  /**
   * 实测每个插件**在本机网络上**的取流表现，产出评分，并据此排候选顺序。
   *
   * ── 为什么必须在设备上实测，不能沿用服务端那份评分表 ──────────────
   * 服务端的 plugin-rank.js 是在**构建机**的出口上测的。插件好不好用高度依赖
   * 出口网络：同一个插件在构建机可能 90% 成功，在用户手机上因为 DNS 污染、
   * 运营商互联质量差而全军覆没。拿构建机的分数来排手机上的顺序是本末倒置
   * （网页版 public/js/native.js 里也是这么写的）。
   *
   * ── 评分口径 ─────────────────────────────────────────────────
   * 取流成功率 60% + 响应速度 40%（对齐服务端口径，砍掉了「直链可播性」与
   * 「覆盖广度」两项 —— 前者要发 Range 请求探文件头，在壳里得走原生、成本高；
   * 后者对「本机该信谁」没有信息量）。
   * 速度按中位数耗时算：≤1.5s 满分，≥8s 归零，中间线性。
   *
   * ── 为什么用「搜一首歌」而不是内置探针 id ────────────────────────
   * 各平台的 id 形态完全不同（网易数字、酷狗 hash、QQ mid），内置一份就要跟着
   * 平台改而失效。直接搜一首各平台都有的歌，取每个平台的第一条当探针，
   * 既不用维护，也保证是**本机现在真能搜到**的歌。
   */
  var LP_PROBE_KEYWORD = '稳稳的幸福'

  function lpFetchProbes() {
