   * 账号密码一律由用户在本机「我的 → 双线路管理」里填写，存进原生 SharedPreferences
   * （既不进代码库也不进包）。正常情况下 cfg 来自原生 getServerConfig()，
   * 只有拿不到原生配置时才会落到这份兜底 —— 那时没有凭据，
   * ensureLogin 会先给出「请先填写账号密码」的提示，而不是拿空口令去撞接口。
   */
  var DEFAULT_CFG = {
    active: 0,
    activeUrl: 'https://music.zyplnn.dpdns.org',
    activeUser: '', activePass: '',
    activeName: '线路一 (Cloudflare)',
    line1: { name: '线路一 (Cloudflare)', url: 'https://music.zyplnn.dpdns.org', user: '', pass: '' },
    line2: { name: '线路二 (Docker自建)', url: 'https://lxmusic.19860819.xyz:8616', user: '', pass: '' }
  }
  var cfg = DEFAULT_CFG

  function readNativeConfig() {
    if (window.YunBridge && window.YunBridge.getServerConfig) {
      try {
        var raw = window.YunBridge.getServerConfig()
        if (raw) { cfg = JSON.parse(raw); return true }
      } catch (e) { /* 落到默认 */ }
    }
    return false
  }

  // 立刻读一次：必须在原生回调 onNativeLineChanged 之前把 cfg 填好，
  // 否则首次同步会因为「默认值 active=0 与真实值不同」而被误判成一次切线。
  readNativeConfig()

  /**
   * 原生推送线路配置。
   *
   * ⚠ 只有**线路真的变了**才提示并重登。
   * 原生侧 onPageFinished 每次页面加载都会推一次配置（那只是同步，不是切线），
   * 早先这里无条件弹「已切换至线路 X」，导致每点一个菜单都蹦一次提示。
   */
  window.onNativeLineChanged = function (next) {
    if (!next) return
    var changed = !cfg || cfg.active !== next.active || cfg.activeUrl !== next.activeUrl
    cfg = next
    if (!changed) return

    token = ''
    store.del('ym.token')
    homeCache = null
    toast('已切换至 ' + (next.activeName || (next.active === 0 ? '线路一' : '线路二')))
    ensureLogin(true).then(function () { route(true) }).catch(function () {})
  }

  /* ------------------------------ API 客户端 ------------------------------ */
  var token = store.get('ym.token', '') || ''
  var user = null

  function apiBase() { return String(cfg.activeUrl || '').replace(/\/+$/, '') }

  function api(path, opts) {
    opts = opts || {}
    var headers = Object.assign({}, opts.headers || {})
    if (token && !opts.noAuth) headers['Authorization'] = 'Bearer ' + token
    var body = opts.body
    if (body && typeof body !== 'string') {
      headers['Content-Type'] = 'application/json'
      body = JSON.stringify(body)
    }
    return nativeHttp(apiBase() + '/api' + path, opts.method || 'GET', headers, body, opts.timeout)
      .then(function (res) {
        var data = null
        try { data = res.body ? JSON.parse(res.body) : null } catch (e) { data = { raw: res.body } }
        if (res.status < 200 || res.status >= 300) {
          var err = new Error((data && (data.error || data.message)) || ('请求失败 ' + res.status))
          err.status = res.status
          err.data = data
          throw err
        }
        return data
      })
  }

  /** 自动登录：用当前线路的账号换取 token，失败则提示但不阻塞界面 */
  function ensureLogin(force) {
    var line = cfg.active === 1 ? cfg.line2 : cfg.line1
    if (!line || !line.url) return Promise.reject(new Error('尚未配置服务器地址'))
    // 账号密码不再内置在包里（内置等于随 APK 一起把口令发出去），
    // 由用户在本机填写。没填就明确引导去填，别拿空口令去撞接口 ——
    // 那样只会得到一句没头没尾的「登录失败 401」，用户不知道该干什么。
    if (!line.user || !line.pass) {
      var need = new Error('还没填「' + (line.name || '当前线路') + '」的账号密码，请到「我的 → 双线路管理」填写后重试')
      need.needSetup = true
      return Promise.reject(need)
    }

    var probe = token && !force
      ? api('/me').then(function (r) { user = r.user; return r.user })
          .catch(function (e) { if (e.status === 401) throw e; user = user || null; return user })
      : Promise.reject(new Error('need-login'))

    return probe.catch(function () {
      return api('/login', {
        method: 'POST', noAuth: true,
        body: { username: line.user, password: line.pass }
      }).then(function (r) {
        token = r.token || ''
        store.set('ym.token', token)
        user = r.user || null
        return user
      })
    })
  }

  /* ------------------------------ 播放器内核 ------------------------------ */
  var MODES = [
    { key: 'order', name: '顺序播放' },
    { key: 'loop', name: '列表循环' },
    { key: 'single', name: '单曲循环' },
    { key: 'random', name: '随机播放' }
  ]
  var QUALITIES = ['128k', '320k', 'flac']

  var audio = $('#audio')
  var P = {
    queue: store.get('ym.queue', []) || [],
    index: -1,
    mode: store.get('ym.mode', 'loop'),
    quality: store.get('ym.quality', '320k'),
    playing: false,
    lines: [],
    lineIndex: -1,
    favorites: {},
    loadToken: 0,
    // 已下载清单（本地记录，文件本体在系统媒体库里）
    downloads: store.get('ym.downloads', []) || [],
    // 本地文件播放失败时的一次性在线兜底
    localSrc: false,
    localFallback: null,
    // ---- 播放健壮性（见 togglePlay / armPlayWatch / error 三处的注释）----
    // 连续失败计数：只有 timeupdate 里出现真实进度才会清零
    errStreak: 0,
    // 已确认到达过的进度水位，用来判定「这一首是不是真的在走」
    progressMark: 0,
    // 看门狗救回来的次数，救两次还不行就放弃，避免自己变成死循环
    watchHits: 0,
    // 看门狗「还在缓冲，再等等」的次数（每首最多宽限几次，防止无限等）
    watchWaits: 0,
    // 重新解析后要回到的位置（0 表示从头放）
    resumePos: 0,
    // 暂停时记下的位置
    lastPos: 0,
    // ---- 直链候选降级（跳歌问题的根因，见 useCandidate / error 两处注释）----
    // 服务端 /url 一次会给一整串候选直链（urls），按「完整版优先」排好序。
    // 以前只用 r.url 一条，一条不通就整首判失败跳下一首 —— 表现就是「跳歌」。
    cands: [],
    candIndex: -1,
    // 这一首是否已经退到过服务端代理流（每首只退一次，避免来回横跳）
    triedProxy: false
  }
  if (!MODES.some(function (m) { return m.key === P.mode })) P.mode = 'loop'
  if (QUALITIES.indexOf(P.quality) < 0) P.quality = '320k'

  var LYRIC_MAX = 3, LYRIC_STEP = 0.2
  var lyricDelay = Number(store.get('ym.lyricDelay', 0)) || 0
  // 本地存的值可能是旧版本写坏的，越界就复位，别让它把歌词顶到天外
  if (!(lyricDelay >= -LYRIC_MAX && lyricDelay <= LYRIC_MAX)) lyricDelay = 0

  function currentSong() { return P.queue[P.index] || null }

  /**
   * 安全播放。
   *
   * `HTMLMediaElement.play()` 在 Chrome 50 之前（以及部分系统 WebView）**返回 undefined**
   * 而不是 Promise —— 直接 `.play().catch(...)` 会抛
   * `Cannot read properties of undefined (reading 'catch')`，
   * 而且是在 Promise 回调里抛，整条解析链路就此静默中断、歌永远起不来。
   * 所以统一从这里走，按返回值形态决定挂不挂回调。
   */
  function playAudio(onFail) {
    var p
    try { p = audio.play() } catch (e) { if (onFail) onFail(e); return }
    if (p && typeof p.catch === 'function') p.catch(function (e) { if (onFail) onFail(e) })
  }

  function saveQueue() {
    store.set('ym.queue', P.queue.slice(0, 200))
    var c = $('#queueCount'); if (c) c.textContent = String(P.queue.length)
  }

  function addToQueue(song, silent) {
    if (!song || !song.id) return
    var dup = P.queue.some(function (s) { return s.id === song.id })
    if (!dup) { P.queue.push(song); saveQueue() }
    if (!$('#queueSheet').hidden) renderQueue()
    if (!silent && dup) toast('已在播放队列中')
  }

  /**
   * 入队并给出**准确**的提示。
   *
   * 别在调用处写死 `addToQueue(s); toast('已加入播放队列')` —— 重复入队时
   * addToQueue 内部先弹「已在播放队列中」，紧接着被调用处那句覆盖掉，
   * 用户看到的就成了与事实相反的「已加入播放队列」。
   */
  function enqueueWithToast(song) {
    if (!song || !song.id) return
    var dup = P.queue.some(function (s) { return s.id === song.id })
    addToQueue(song)
    if (!dup) toast('已加入播放队列')
  }

  function playSong(song, list) {
    if (!song) return
    // 用户主动选歌：给一次干净的机会，别让上一首攒下的失败计数误伤
    P.errStreak = 0
    P.resumePos = 0        // 新的一首，从头放
    if (list && list.length) {
      P.queue = list.slice(0)
      saveQueue()
      P.index = list.findIndex(function (s) { return s.id === song.id })
      if (P.index < 0) P.index = 0
    } else {
      addToQueue(song, true)
      P.index = P.queue.findIndex(function (s) { return s.id === song.id })
      if (P.index < 0) P.index = P.queue.length - 1
    }
    loadCurrent(true)
  }

  function playList(list, startIndex) {
    if (!list || !list.length) return toast('列表为空')
    P.errStreak = 0        // 用户主动播放全部，同样给一次干净的机会
    P.resumePos = 0        // 新的一首，从头放
    P.queue = list.slice(0)
    P.index = startIndex || 0
    saveQueue()
    loadCurrent(true)
  }

  /**
   * 把服务端给的一串候选直链摊平成数组。
   *
   * ⚠ `/url?fast=1` 的返回里 **`urls` 才是全量候选**（服务端已按「完整版优先、原生优先」
   * 排好序，见 src/lib/stream.js 的 resolveMusicUrlFast），`url` 只是其中第一条。
   * 以前客户端只用 `url` 那一条 —— 那条不通就整首判失败跳下一首。
   * 这就是「播放歌单时候会跳歌，中间有歌曲没有播放，跳过去」的根因：
   * 同一首歌往往有五六个插件源，只有其中一两个不通，本可以换一条接着放。
   */
  function candidateList(r, song) {
    var out = [], seen = {}
    function push(u, from) {
      var s = String(u || '')
      if (!s || seen[s]) return
      seen[s] = 1
      out.push({ url: s, from: from || '' })
    }
    if (r && r.urls && r.urls.length) {
      for (var i = 0; i < r.urls.length; i++) {
        var c = r.urls[i]
        if (!c) continue
        if (typeof c === 'string') push(c, r.from)
        else push(c.url, c.from || r.from)
      }
    }
    if (r && r.url) push(r.url, r.from)
    return out
  }

  /** 切到第 i 条候选直链并起播（不碰 resumePos，由调用方决定从哪续） */
  function useCandidate(i, autoplay) {
    var c = P.cands[i]
    if (!c) return false
    var song = currentSong()
    P.candIndex = i
    P.localSrc = false
    P.watchWaits = 0
    audio.src = c.url
    // 两处音源信息（平台名 / 插件名）都由 applySource 一次更新，别再各写一遍
    applySource(c.from || (song && (song.source || song.sourceName)) || '')
    if (autoplay) {
      playAudio(function () { toast('点击播放按钮开始播放'); updatePlayIcon(false) })
      armPlayWatch()
    }
    return true
  }

  /** 退到服务端代理流（同源，规避防盗链与跨域）。每首歌只退一次，避免两处来回横跳。 */
  function useProxyStream(autoplay) {
    var song = currentSong()
    if (!song) return false
    P.triedProxy = true
    P.candIndex = -1
    P.localSrc = false
    P.watchWaits = 0
    audio.src = apiBase() + '/api/stream?id=' + encodeURIComponent(song.id) + '&q=' + P.quality
    applySource('proxy')
    if (autoplay) {
      playAudio(function () { toast('这个音源也放不出来，换下一首') })
      armPlayWatch()
    }
    return true
  }

  function loadCurrent(autoplay) {
    var song = currentSong()
    if (!song) return
    var myToken = ++P.loadToken

    renderPlayerMeta(song)
    // 歌曲对象里往往已经带着来源（搜索结果就带），能先显示就先显示，省得每次都闪一下「解析中」
    applySource(song.source || song.sourceName || '')
    setLyricLoading()
    showMini(true)
    clearPlayWatch()
    // 新的一首：候选列表、代理兜底标记、看门狗宽限次数全部重置
    P.cands = []
    P.candIndex = -1
    P.triedProxy = false
    P.watchWaits = 0
    P.watchHits = 0        // 每一首都有自己的两次抢救额度
    // ⚠ 这里**不要**清零 errStreak。清零的后果是「连续失败 4 次就停下」的熔断保护
    // 永远触发不了 —— error → 自动下一首 → loadCurrent 清零 → error …
    // 就是一条无限循环：每 600ms 跳一次、每跳一次发一个 /url 请求，
    // CPU 与网络打满，界面点哪都没反应（用户的原话：窗口假死一样）。
    // errStreak 只在「真实进度」或「用户主动选歌」时清零，见 timeupdate / playSong。
    P.progressMark = 0

    api('/url?id=' + encodeURIComponent(song.id) + '&q=' + P.quality + '&fast=1')
      .then(function (r) {
        if (myToken !== P.loadToken) return
        var list = candidateList(r, song)
        if (!list.length) throw new Error('无可用播放地址')
        P.cands = list
        useCandidate(0, autoplay)
      })
      .catch(function (e) {
        if (myToken !== P.loadToken) return
        // 解析接口本身就没给地址（或请求失败）→ 直接退服务端代理流
        if (!useProxyStream(autoplay)) return
        if (!autoplay) toast('解析失败：' + e.message)
      })

    loadLyric(song, myToken)
    pushHistory(song)
  }

  /* ------------------------------ 起播看门狗 ------------------------------ */
  /**
   * Android WebView 上 `play()` 存在「既不报错也不出声」的形态：
   * Promise 不 reject、也不派发 error 事件，`paused` 甚至可能已经是 false，
   * 但 `currentTime` 就是不走 —— 界面看起来就是「点了播放没反应、没进度、假死」。
   * 光靠 play()/error 两个回调兜不住这种情况，只能自己盯进度。
   *
   * 做法：play() 之后 3.5 秒检查 currentTime 是否往前走了；
   * 没走就记下位置、重新解析地址（含代理流兜底）再续播，最多救两次。
   */
  var playWatch = 0
  /**
   * 首次检查等 5 秒（原来 3.5 秒）。
   *
   * 用户的原话是「是不是等待时间太短了」——**确实是**。慢网 + 第三方插件源时，
   * 一条直链从 play() 到真正出声常常要 4~6 秒；3.5 秒就判「卡住」会把正在
   * 正常缓冲的流掐断重解析，第二遍再掐一次，最后整首被判失败跳过去。
   */
  var WATCH_MS = 5000
  /** 「还在缓冲」最多宽限几次，之后才认定是真卡住 */
  var WATCH_MAX_WAITS = 3
  function clearPlayWatch() { if (playWatch) { clearTimeout(playWatch); playWatch = 0 } }
  function armPlayWatch(ms) {
    clearPlayWatch()
    var at = audio.currentTime || 0
    playWatch = setTimeout(function () {
      playWatch = 0
      if (audio.paused) return                                  // 用户自己暂停的，正常
      var cur = audio.currentTime || 0
      if (Math.abs(cur - at) > 0.25) {                          // 进度在走，正常
        P.watchHits = 0
        P.watchWaits = 0
        return
      }
      /*
       * ⚠ 关键分支：**还在缓冲 ≠ 卡死**。
       * readyState < 3（没到 HAVE_FUTURE_DATA）且 networkState = 2（NETWORK_LOADING）
       * 时数据正在来，只是这一首的源慢。此时重解析会把正在下的流掐断，越救越糟 ——
       * 用户看到的就是「中间有歌曲没有播放，跳过去」。先宽限几次再动手。
       */
      if (audio.readyState < 3 && audio.networkState === 2 && (P.watchWaits || 0) < WATCH_MAX_WAITS) {
        P.watchWaits = (P.watchWaits || 0) + 1
        armPlayWatch(ms)
        return
      }
      if ((P.watchHits || 0) >= 2) return                       // 救了两次还不行，别再折腾
      P.watchHits = (P.watchHits || 0) + 1
      P.resumePos = at
      // 先换下一条候选直链（同一首歌、另一个插件源），比整首重新解析便宜得多
      if (P.candIndex >= 0 && P.candIndex + 1 < (P.cands || []).length) {
        toast('这个音源卡住了，换一个试试')
        useCandidate(P.candIndex + 1, true)
        return
      }
      toast('播放卡住了，正在重新解析…')
      loadCurrent(true)
    }, ms || WATCH_MS)
  }

  function togglePlay() {
    if (!audio.src) {
      if (P.queue.length) { P.index = P.index < 0 ? 0 : P.index; loadCurrent(true) }
      else toast('播放队列为空')
      return
    }
    if (audio.paused) {
      P.resumePos = 0
      P.errStreak = 0      // 用户主动按播放：给一次干净的机会
      playAudio(function () {
        // 起播被拒（音频焦点被抢、直链过期等）：不要静默失败，
        // 记下位置重新解析一次，用户看到的是「续上了」而不是「按了没反应」
        P.resumePos = audio.currentTime || P.lastPos || 0
        toast('播放失败，正在重新解析…')
        loadCurrent(true)
      })
      armPlayWatch()
    } else {
      // 暂停前记住位置，重新解析后能回到原位
      if (isFinite(audio.currentTime) && audio.currentTime > 0) P.lastPos = audio.currentTime
      clearPlayWatch()
      audio.pause()
    }
  }

  function nextIndex(step) {
    if (!P.queue.length) return -1
    if (P.mode === 'random') {
      if (P.queue.length === 1) return 0
      var n
      do { n = Math.floor(Math.random() * P.queue.length) } while (n === P.index)
      return n
    }
    return (P.index + step + P.queue.length) % P.queue.length
  }

  function playNext() {
    if (!P.queue.length) return
    if (P.mode === 'single') {
      // 单曲循环重放：地址可能已经过期，失败时交给 togglePlay 那套兜底重解析
      P.resumePos = 0
      try { audio.currentTime = 0 } catch (e) { }
      playAudio(function () { P.resumePos = 0; loadCurrent(true) })
      armPlayWatch()
      return
    }
    var n = nextIndex(1)
    if (n < 0) return
    if (P.mode === 'order' && P.index === P.queue.length - 1 && n === 0) { audio.pause(); return }
    P.resumePos = 0
    P.index = n; loadCurrent(true)
  }
  function playPrev() {
    if (!P.queue.length) return
    var n = nextIndex(-1)
    if (n < 0) return
    P.resumePos = 0
    P.index = n; loadCurrent(true)
  }

  /* ------------------------------ 歌词 ------------------------------ */
  /**
   * 解析 LRC。
   *
   * ⚠️ 必须处理 `[offset:±毫秒]` 全局偏移标签 —— 各平台歌词大量带它，
   * 直接忽略的后果是**整篇歌词恒定提前或滞后**，表现出来就是「歌词和进度对不上」。
   *
   * 符号取 LRC 格式原始定义（国内平台一致口径）：**正值表示整体提前**，
   * 也就是把每句时间戳往前挪，所以这里做减法。
   */
  /** 取出 `[offset:±毫秒]` 并换算成秒；没有就返回 0 */
  function lrcOffsetOf(text) {
    var om = String(text || '').match(/\[offset:\s*([+-]?\d+)\s*\]/i)
    return om ? (Number(om[1]) || 0) / 1000 : 0
  }

  /**
   * `forceOffset` 用在一处很关键的地方：**译文**。
   *
   * 上游给的 tlyric 往往只有时间戳、不带 `[offset:]` 标签，而主歌词带。
   * 如果译文按 0 偏移解析、主歌词按 ±N 解析，两边时间就整体错开 N 秒，
   * 后面按 `toFixed(2)` 精确配对会**一条都对不上** —— 表现就是「译文全没了」。
   * 所以译文必须显式沿用主歌词的偏移量。
   */
  function parseLrc(text, forceOffset) {
    if (!text) return []
    var src = String(text)
    var offset = typeof forceOffset === 'number' ? forceOffset : lrcOffsetOf(src)

    var re = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g
    var lines = []
    src.split(/\r?\n/).forEach(function (raw) {
      var stamps = []
      var m
      re.lastIndex = 0
      while ((m = re.exec(raw))) {
        // 小数位按位数换算：`.5` 是 500ms、`.50` 是 500ms、`.500` 也是 500ms
        var ms = m[3] ? Number(m[3]) : 0
        if (m[3] && m[3].length === 2) ms *= 10
        if (m[3] && m[3].length === 1) ms *= 100
        stamps.push(Math.max(0, Number(m[1]) * 60 + Number(m[2]) + ms / 1000 - offset))
      }
      if (!stamps.length) return
      re.lastIndex = 0
      var content = raw.replace(re, '').trim()
      if (!content) return
      for (var i = 0; i < stamps.length; i++) lines.push({ t: stamps[i], text: content, sub: '' })
    })
    lines.sort(function (a, b) { return a.t - b.t })

    // 同一时刻的重复行只留一条：一句歌词挂多个时间戳、多语言歌词都会撞在一起
    var out = []
    for (var k = 0; k < lines.length; k++) {
      var prev = out[out.length - 1]
      if (prev && Math.abs(prev.t - lines[k].t) < 0.02) continue
      out.push(lines[k])
    }
    return out
  }

  /**
   * 把翻译按「时间戳精确到 10ms」贴到主歌词上，对不上的就不贴。
   * `offset` 必须传主歌词的偏移量，否则带 `[offset:]` 的歌译文会整条错位（见 parseLrc 注释）。
   */
  function mergeTranslation(lines, tlyric, offset) {
    if (!tlyric) return lines
    var map = {}
    parseLrc(tlyric, offset).forEach(function (l) {
      var k = l.t.toFixed(2)
      if (!(k in map)) map[k] = l.text
    })
    lines.forEach(function (l) {
      var hit = map[l.t.toFixed(2)]
      if (hit && hit !== l.text) l.sub = hit
    })
    return lines
  }

  function setLyricLoading() {
    P.lines = []; P.lineIndex = -1
    var box = $('#lyricScroll')
    box.innerHTML = '<div class="lyric-line lyric-empty">歌词加载中…</div>'
    box.style.transform = 'translateY(0px)'
  }

  /**
   * 取歌词。
   *
   * 判空要看**正文**：上游取不到词时返回的是 `{lyric:'', tlyric:null}` ——
   * 对象是真的、里面一个字没有，只判对象存在会显示成一片空白。
   * 第一轮没拿到正文就隔 1.2s 再来一轮（部分上游单次成功率不高），期间切歌立即放弃。
   */
  function loadLyric(song, myToken) {
    var attempt = 0
    function giveUp() {
      P.lines = []; P.lineIndex = -1
      var box = $('#lyricScroll')
      box.innerHTML = '<div class="lyric-line lyric-empty">暂无歌词</div>'
      box.style.transform = 'translateY(0px)'
    }
    function once() {
      api('/lyric?id=' + encodeURIComponent(song.id)).then(function (r) {
        if (myToken !== P.loadToken) return
        var data = r && r.lyric
        var text = typeof data === 'string' ? data : (data && (data.lyric || data.lrc)) || ''
        if (!text) {
          if (attempt++ < 1) { setTimeout(once, 1200); return }
          giveUp(); return
        }
        P.lines = mergeTranslation(parseLrc(text), (data && data.tlyric) || null, lrcOffsetOf(text))
        renderLyric(true)
      }).catch(function () {
        if (myToken !== P.loadToken) return
        if (attempt++ < 1) { setTimeout(once, 1200); return }
        giveUp()
      })
    }
    once()
  }

  /**
   * 把歌词列表位移到「某一行正好落在可视区正中」。传 null 表示对齐第一行。
   *
   * ⚠️ 这里踩过一个很大的坑，改动前务必读完：
   *
   * **不能拿 `node.offsetTop` 去算位移。** `.lyric-scroll` 自己带着 transform（就是本函数
   * 写的那个），而带 transform 的元素会成为后代的 offsetParent —— 于是
   * `node.offsetTop` 变成「相对歌词列表自己」的坐标；偏偏 `.lyric-scroll` 又被
   * `.player__lyric` 的 `align-items:center` 推到了可视区上方。两套坐标系一混，
   * 算出来的位移整整偏掉「列表高度的一半」：屏幕上你读到的那句，永远比正在唱的那句
   * 晚好几行 —— 用户的原话就是「歌词和歌曲进度不匹配」。
   *
   * 正确做法：不碰 DOM，用两个**同时受该 transform 影响**的矩形相减，把 transform 抵消掉，
   * 剩下纯布局量；再加上 `scroll.offsetTop`（布局值，不受 transform 影响）换算到
   * 「相对可视区」的同一个坐标系里。
   */
  function alignLyricTo(node) {
    var scroll = $('#lyricScroll')
    var box = scroll && scroll.parentElement
    if (!box) return
    var h = box.clientHeight
    // 播放器没打开时可视区高度为 0，量出来必然是错的 —— 宁可不动，
    // 也别把本来正确的位置污染掉
    if (!h) return
    var target = node || scroll.firstElementChild
    if (!target) return
    var sr = scroll.getBoundingClientRect()
    var tr = target.getBoundingClientRect()
    var top = scroll.offsetTop + (tr.top - sr.top)
    scroll.style.transform = 'translateY(' + (h / 2 - top - tr.height / 2) + 'px)'
  }

  function renderLyric(reset) {
    var box = $('#lyricScroll')
    if (reset) P.lineIndex = -1
    if (!P.lines.length) {
      box.innerHTML = '<div class="lyric-line lyric-empty">暂无歌词</div>'
      box.style.transform = 'translateY(0px)'
      return
    }
    box.innerHTML = P.lines.map(function (l, i) {
      return '<div class="lyric-line' + (i === P.lineIndex ? ' is-active' : '') + '" data-i="' + i + '">' +
        '<span class="lyric-line__main">' + esc(l.text) + '</span>' +
        (l.sub ? '<span class="lyric-line__sub">' + esc(l.sub) + '</span>' : '') + '</div>'
    }).join('')
    // 首句居中：还没开始唱时，让第一句先停在中间，后面的句子在下方候着
    alignLyricTo(null)
    // 歌词可能是播到一半才回来的，渲染完补一次启动（空闲时是空操作）
    startLyricLoop()
  }

  /**
   * 按时间戳定高亮行并摆好位置。
   * `force` 为真时忽略「行没变就不用重摆」的短路 —— 播放器刚打开、调完偏移
   * 这些时候，行号往往没变但**位置必须重算**（可视区尺寸变了）。
   */
  function syncLyric(time, force) {
    if (!P.lines.length) return
    // 判定时刻 = 播放位置 - 偏移。偏移为正表示歌词延后 → 用更早的时刻去比，
    // 于是每一行都会「晚一点」才亮。
    var at = time - lyricDelay
    var idx = -1
    for (var i = 0; i < P.lines.length; i++) {
      if (P.lines[i].t <= at) idx = i; else break
    }
    if (!force && idx === P.lineIndex) return
    P.lineIndex = idx
    var box = $('#lyricScroll')
    var nodes = box.children
    for (var j = 0; j < nodes.length; j++) nodes[j].classList.toggle('is-active', j === idx)
    // 只用 transform 定位，**不要再调 scrollIntoView**：.player__lyric 是 overflow:hidden
    // 的滚动容器，scrollIntoView 会去改它的 scrollTop，与这里的位移叠加后
    // 高亮行会系统性偏离中心。
    alignLyricTo(idx >= 0 ? nodes[idx] : null)
  }

  /**
   * 歌词高亮用 rAF 驱动，不靠 timeupdate。
   *
   * timeupdate 大约只有 4Hz（250ms 一次），跟着它切高亮会明显慢半拍；
   * 进度条低频更新无所谓，歌词必须跟帧。暂停时停掉，不空转。
   */
  var lyricRaf = 0
  function lyricLoop() {
    lyricRaf = 0
    if (audio.paused || !P.lines.length) return
    syncLyric(audio.currentTime || 0)
    lyricRaf = requestAnimationFrame(lyricLoop)
  }
  function startLyricLoop() {
    if (!lyricRaf && !audio.paused && P.lines.length) lyricRaf = requestAnimationFrame(lyricLoop)
  }
  function stopLyricLoop() {
    if (lyricRaf) { cancelAnimationFrame(lyricRaf); lyricRaf = 0 }
  }
  /** 按当前进度重摆一次位置：播放器开合、歌词刚回来、旋屏、调偏移之后都要来一次 */
  function realignLyric() {
    if (!P.lines.length) return
    syncLyric(audio.currentTime || 0, true)
  }

  function updateLyricCal() {
    var v = $('#lyricCalVal')
    if (Math.abs(lyricDelay) < 0.001) { v.textContent = '同步'; v.dataset.off = '0' }
    else {
      v.textContent = (lyricDelay > 0 ? '+' : '') + lyricDelay.toFixed(1) + 's'
      v.dataset.off = '1'
    }
  }

  /**
   * 调一档偏移。`+` 表示「歌词再晚一点」（声音比字幕慢时按这个），`−` 相反。
   * 改完必须**强制重算**：syncLyric 里 `idx === P.lineIndex` 会直接早退，
   * 而调偏移往往跨不过行边界（行没变），不强制就看不到效果。
   */
  function bumpLyricDelay(delta) {
    lyricDelay = Math.max(-LYRIC_MAX, Math.min(LYRIC_MAX, Math.round((lyricDelay + delta) * 10) / 10))
    store.set('ym.lyricDelay', lyricDelay)
    updateLyricCal()
    syncLyric(audio.currentTime || 0, true)
  }

  /* ------------------------------ 系统媒体状态同步 ------------------------------ */
  /**
   * 把「正在放什么」交给原生，原生再喂给 MediaSession ——
   * 锁屏媒体卡片、下拉控制中心的媒体面板、蓝牙耳机与车机的按键，读的都是这一份。
   *
   * 为什么除了歌名歌手还要给封面 / 时长 / 进度：
   *   只给歌名歌手的话，锁屏上没有封面、总时长显示不出来、拖动条是死的。
   * 封面必须是 http(s) 直链（原生自己去下、解码成 Bitmap），
   * 所以先过一遍 coverSrc 拿到真地址，拿到占位图就干脆不给。
   */
  function syncMedia() {
    if (!window.YunBridge || !window.YunBridge.updateMedia) return
    var s = currentSong()
    if (!s) return
    var cover = coverSrc(s.img, 300)
    if (!cover || !/^https?:/i.test(cover)) cover = ''
    var dur = audio.duration
    if (!isFinite(dur) || dur <= 0) dur = 0
    try {
      window.YunBridge.updateMedia(
        s.name || '', s.singer || '', !!P.playing,
        cover,
        Math.round(dur * 1000),
        Math.round((audio.currentTime || 0) * 1000)
      )
    } catch (e) { }
  }

  /**
   * 进度不需要每次都推。timeupdate 一秒能来四趟，每趟都过一遍 JS 桥
   * 既费电又没意义（锁屏的进度条本来就会按 speed 自己走）。
   * 这里 5 秒补一次，用来纠正长播后的累计漂移。
   */
  var lastMediaSync = 0
  function syncMediaProgress() {
    var now = Date.now()
    if (now - lastMediaSync < 5000) return
    lastMediaSync = now
    syncMedia()
  }

  /* ------------------------------ 播放 UI ------------------------------ */
  function updatePlayIcon(playing) {
    P.playing = !!playing
    var path = playing
      ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>'
      : '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>'
    $('#playIcon').innerHTML = path
    $('#miniPlayIcon').innerHTML = path
    $('#playerCover').classList.toggle('is-playing', !!playing)
    $('#miniCover').classList.toggle('is-playing', !!playing)
    // 播放/暂停是「状态变了」，必须立刻同步，不能等 5 秒
    lastMediaSync = Date.now()
    syncMedia()
  }

  function showMini(show) {
    $('#miniplayer').hidden = !show
  }

  /* ------------------------------ 音源标识 ------------------------------ */
  /**
   * 上游 `/url` 返回的 `from` 直接摆在播放器里没人看得懂，这里换成平台名并按平台染色。
   *
   * ⚠ `from` **不一定**是平台代号，实测有三种形态（见 providers/index.js 的
   * musicUrlCandidateList）：
   *   - `plugin:<插件名>` —— 插件解析出来的直链。**这是最常见的**，因为
   *     默认就是插件优先、原生兜底。用户看到的会是 "PLUGIN:XXX"，既看不懂
   *     也不知道这首歌到底来自网易云还是酷狗。
   *   - `native` —— 平台官方接口给的直链。
   *   - `none`   —— 一个候选都没成功（此时压根没有 url，走的是代理流兜底）。
   * 所以前两种必须**回落到歌曲自身的 source**：插件是按 `song.source` 挑的
   * （`musicUrlPlugins(song.source, 'musicUrl')`），解析出来的就是那个平台的地址。
   */
  var SRC_NAMES = {
    wy: '网易云音乐', kg: '酷狗音乐', kw: '酷我音乐',
    tx: 'QQ音乐', mg: '咪咕音乐', xm: '喜马拉雅',
    proxy: '服务端代理', local: '本地文件'
  }

  /** 歌曲自身的平台名：优先用服务端给的 sourceName，其次查代号表 */
  function songPlatformLabel(song) {
    if (!song) return ''
    var byName = String(song.sourceName || '').trim()
    if (byName) return byName
    var code = String(song.source || '').toLowerCase()
    return SRC_NAMES[code] || ''
  }

  /**
   * 把 `/url` 的 from 归一成「平台代号」，供配色用。
   * plugin:* / native / none 这类「解析途径」不算平台，回落到歌曲自身。
   */
  function platformCodeOf(from, song) {
    var k = String(from || '').toLowerCase()
    if (!k || k === 'none' || k === 'native' || k.indexOf('plugin:') === 0) {
      return String((song && song.source) || '').toLowerCase()
    }
    return k
  }

  /**
   * 音源（平台）名 —— **歌手那一行**用这个（缀在歌手后面：`歌手 · 网易云音乐`）。
   *
   * 用户的要求很明确：这一行显示「网易、酷狗、酷我」这类**音源名字**，
   * 插件名放到最底那一行（见 pluginLabel）。版式照 Web 端 `.player__artist`。
   *
   * 服务端 `musicUrlCandidateList` 给的 from 形态：
   *   `plugin:<插件名>` —— 插件名是插件脚本里的 `@name`，**不是平台**，回落到歌曲自身平台；
   *   `native`          —— 平台官方接口直链，同样回落到歌曲平台；
   *   `none`            —— 全部音源都没给出地址，返回空（界面停在「解析中…」）；
   *   平台代号           —— 查 SRC_NAMES。
   */
  function sourceLabel(code, song) {
    var k = platformCodeOf(code, song)
    if (k) return SRC_NAMES[k] || songPlatformLabel(song) || k.toUpperCase()
    // 平台判定不出来（歌曲对象没带 source，列表接口异常等），但能确定是
    // 「插件/原生解析」——给个诚实的泛称，既不要一直停在「解析中」，
    // 也不要把 plugin:xxx 这种代号摆给用户看
    var raw = String(code || '').toLowerCase()
    if (raw.indexOf('plugin:') === 0 || raw === 'native') return '在线音源'
    return ''
  }

  /**
   * 插件名 —— **播放器最底那一行**用这个（`音源：<插件名>`，跟 Web 端 footer 同格式）。
   *
   * 为什么这里要单独看插件名：真正决定「这首能不能出声、是完整版还是 30 秒试听片段」
   * 的是**哪一个插件解出来的地址**，跟歌在哪个平台被搜到没关系。
   * 排查「这首放不出来 / 只放半首」时，第一眼要看的就是它。
   */
  function pluginLabel(code) {
    var raw = String(code == null ? '' : code)
    var k = raw.toLowerCase()
    if (k.indexOf('plugin:') === 0) {
      var nm = raw.slice(7).trim()
      return nm || '插件音源'
    }
    if (k === 'native') return '官方直连'
    if (k === 'proxy') return '服务端代理'
    if (k === 'local') return '本地文件'
    if (k === 'none' || !k) return ''
    // 平台代号（wy/kg/kw/tx/mg/xm）：这条地址是平台官方接口直接给的，没有插件参与
    if (SRC_NAMES[k]) return '官方直连'
    return ''
  }

  /**
   * 刷新播放器里的两处音源信息（一次调用同时更新，避免两边口径不一致）。
   *
   * 口径与 Web 端 `public/js/player.js` 完全一致（用户要求「音源和插件的布局参照 web」）：
   *   · `#playerArtist`      —— 歌手那一行：`歌手 · 平台名`
   *                            （Web 端是 `artist + '  ·  ' + song.sourceName`）
   *   · `#playerResolvedBy`  —— 最底那一行：`音源：<插件名>`
   *                            （Web 端是 `setFooter('音源：' + hit.from)`）
   * 平台名 = 这首歌属于哪个平台（网易云音乐 / 酷狗音乐 / 酷我音乐…）；
   * 插件名 = 这条地址是哪个插件解出来的（from 就是 `plugin:<插件 @name>`）。
   * 迷你播放器的歌手后面同样缀上平台名，收起播放器时也看得到。
   */
  function applySource(code) {
    var song = currentSong()
    var label = sourceLabel(code, song)
    var plug = pluginLabel(code)
    var singer = (song && song.singer) || '群星'
    // 歌手那一行：跟 Web 端 .player__artist 一样，歌手后面缀平台名
    var pa = $('#playerArtist')
    if (pa) pa.textContent = singer + (label ? '  ·  ' + label : '')
    $('#miniArtist').textContent = singer + (label ? ' · ' + label : '')
    // 最底那一行：跟 Web 端 .player__footer 一样，前缀「音源：」+ 解析途径（插件名）
    var ft = $('#playerResolvedBy')
    if (ft) ft.textContent = plug ? ('音源：' + plug) : '音源解析中…'
  }

  function renderPlayerMeta(song) {
    if (!song) return
    $('#playerTitle').textContent = song.name || '未知曲目'
    // 歌手那一行的「 · 平台名」由 applySource 统一补（它才知道 /url 的 from），
    // 这里只放歌手，避免两处各写一遍导致闪一下旧文案
    $('#playerArtist').textContent = song.singer || '群星'
    $('#playerNavTitle').textContent = song.name || ''
    $('#playerNavArtist').textContent = song.singer || ''
    $('#miniTitle').textContent = song.name || ''
    $('#miniArtist').textContent = song.singer || ''
    var cover = coverSrc(song.img, 300)
    // 封面/底图是 background-image，走不了 <img> 那条扫描路径，单独接一下缓存
    warmCoverEl($('#playerCover'), cover)
    warmCoverEl($('#playerBg'), cover)
    warmCoverEl($('#miniCover'), cover)
    updateFavIcon(song)
    renderQueue()
  }

  function updateFavIcon(song) {
    var on = song && P.favorites[song.id]
    $('#favIcon').setAttribute('fill', on ? 'currentColor' : 'none')
    $('#favIcon').style.color = on ? '#ec4141' : ''
  }

  /**
   * 让原生顶栏跟着全屏播放器一起让位。
   *
   * 原生顶栏是 WebView 的兄弟节点，网页里的 z-index 再高也盖不住它 ——
   * 不藏起来，播放器顶部那排「收起箭头 + 音质按钮」就只能排在红色顶栏下面，
   * 看上去就是「位置太靠下」。隐藏后 WebView 顶到屏幕最上沿（窗口是边到边的），
   * 原生会把状态栏高度写进 `--safe-top`，播放器再用自己的 padding-top 让开状态栏。
   */
  function setChromeHidden(hidden) {
    if (window.YunBridge && window.YunBridge.setChromeHidden) {
      try { window.YunBridge.setChromeHidden(!!hidden) } catch (e) { }
    }
  }

  /*
   * 播放器「是否已展开」的**唯一事实来源**。
   *
   * ⚠ 千万不要拿 `$('#player').hidden` 当判据 —— 它是**收起动画走完之后**才置位的：
   *   closePlayer() 里的 `el.hidden = true` 要等 340ms。而下面 openPlayer() 那批
   *   延时定时器（120/320/600/1000ms）和 assertChrome() 以前都在判断这个字段，
   *   于是「展开后不到 1 秒就收起」会踩进一个 340ms 的竞态窗口：
   *
   *     t=0     openPlayer()            顶栏藏
   *     t=150   closePlayer()           顶栏显（正确）
   *     t=320   残留定时器触发          hidden 此刻**还是 false** → 又去把顶栏藏起来
   *     t=490   el.hidden = true        播放器终于藏了，但**再没有任何代码恢复顶栏**
   *
   *   后果：原生顶栏永久消失 → WebView 顶到 y=0（窗口是边到边的）→
   *   当前页最上面那条 sticky 的搜索框落进状态栏底下 → 看着「跑到最顶部」，
   *   点上去被系统状态栏吃掉 → 用户说的「点不开」。
   *
   * 所以判据用一个**同步**翻转的布尔量，它和 CSS 动画状态彻底解耦。
   */
  var playerOpen = false

  function openPlayer() {
    var el = $('#player')
    playerOpen = true
    el.hidden = false
    setChromeHidden(true)
    requestAnimationFrame(function () {
      el.classList.add('is-open')
      // 播放器此前是 display:none，歌词区高度为 0，alignLyricTo 会主动跳过；
      // 这里补一次重摆，否则「开播放器后歌词停在错位」。
      realignLyric()
    })
    // 顶栏收起后 WebView 会变高，等布局稳定再摆一次歌词，不然高亮行会停在偏上的位置
    setTimeout(realignLyric, 380)
    /*
     * 反复确认顶栏是藏着的。
     *
     * 只发一次不可靠：原生可能在 onPageFinished、线路状态刷新、屏幕旋转、
     * 甚至用户下拉通知栏之后把顶栏重新显示回来。顶栏一回来，WebView 就被挤下去，
     * 播放器最上面那排「收起箭头 / 音质」跟着往下掉 —— 用户看到的就是「按钮不在顶部」。
     * 这里在一秒内补几次，覆盖掉这些时机；期间只要播放器还开着就一直压着。
     *
     * 判据必须是 playerOpen（同步），**不能用 el.hidden** —— 收起动画期间
     * el.hidden 还是 false，用它就会把「已经收起了」误判成「还开着」，
     * 把顶栏压回去再也回不来。详见 playerOpen 上面的说明。
     */
    ;[120, 320, 600, 1000].forEach(function (delay) {
      setTimeout(function () { if (playerOpen) setChromeHidden(true) }, delay)
    })
    $('#view').classList.add('is-player-open')
  }
  function closePlayer() {
    var el = $('#player')
    // 先同步翻转判据，再动动画 —— 这样上面那批残留定时器即使随后触发，
    // 也会因为 playerOpen 已是 false 而不再去压顶栏。
    playerOpen = false
    el.classList.remove('is-open')
    setChromeHidden(false)
    $('#view').classList.remove('is-player-open')
    setTimeout(function () { el.hidden = true }, 340)
  }

  /*
   * 兜底校准：把原生顶栏拉到「与播放器状态一致」的位置。
   *
   * 覆盖的是这些时机：横竖屏切换、状态栏高度变化（下拉通知栏、来电横幅）、
   * 从后台切回前台 —— 这些都会让原生重新走一遍 inset 计算，
   * 有可能顺手把顶栏显示回来。顶栏一回来 WebView 就被挤下去，
   * 播放器顶部那排按钮跟着往下掉。
   *
   * ⚠ 这里是**双向**的：以前只做「播放器开着 → 压住顶栏」，播放器关着时什么都不做。
   *   一旦某条路径把顶栏藏了却没恢复（比如收起播放器的那个竞态），
   *   就再也没有代码能把它拉回来。现在两个方向都校准：
   *   播放器开着就藏，没开就确保显示 —— 任何一次屏幕变化都会把状态拉回正确值。
   */
  function assertChrome() {
    setChromeHidden(playerOpen)
  }
  window.addEventListener('resize', assertChrome)
  window.addEventListener('orientationchange', assertChrome)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) assertChrome()
  })

  /* ------------------------------ 播放队列抽屉 ------------------------------ */
  function renderQueue() {
    var box = $('#queueList')
    $('#queueCount').textContent = String(P.queue.length)
    if (!P.queue.length) {
      box.innerHTML = '<div class="empty"><div class="empty__title">播放队列为空</div><div class="empty__desc">去发现页挑一首歌吧</div></div>'
      return
    }
    box.innerHTML = P.queue.map(function (s, i) {
      return songRow(s, i, i === P.index)
    }).join('')
    bindSongRows(box, P.queue, function (i) {
      P.index = i; loadCurrent(true); closeSheet($('#queueSheet'))
    })
  }

  function songRow(song, index, playing) {
    return '<div class="song song--rich' + (playing ? ' is-playing' : '') + '" data-idx="' + index + '">' +
      '<div class="song__cover"><img src="' + esc(coverSrc(song.img, 100)) + '" alt="" data-fb-skip></div>' +
      '<div class="song__meta">' +
        '<div class="song__name">' + esc(song.name || '未知曲目') + '</div>' +
        '<div class="song__sub">' + esc(song.singer || '群星') +
          (song.albumName ? '<span class="dot">·</span>' + esc(song.albumName) : '') +
          (song.interval ? '<span class="dot">·</span>' + fmtTime(song.interval) : '') + '</div>' +
      '</div>' +
      '<div class="song__acts">' +
        '<button class="song__act" data-act="add" aria-label="加入队列">' +
          '<svg viewBox="0 0 24 24">' + ICON.plus + '</svg></button>' +
        '<button class="song__act" data-act="more" aria-label="更多操作">' +
          '<svg viewBox="0 0 24 24">' + ICON.more + '</svg></button>' +
      '</div>' +
    '</div>'
  }

  /**
   * 纯文字行（榜单/专辑/歌单曲目）。
   * act 传 'remove' 时右侧多一个「移出歌单」，否则是「加入队列」。
   * 「⋯」始终存在，下载、收藏、加入歌单都收在里面。
   */
  function plainRow(song, index, playing, tag, act) {
    var btn = act === 'remove'
      ? '<button class="song__act song__act--danger" data-act="remove" aria-label="移出歌单">' +
          '<svg viewBox="0 0 24 24">' + ICON.trash + '</svg></button>'
      : '<button class="song__act" data-act="add" aria-label="加入队列">' +
          '<svg viewBox="0 0 24 24">' + ICON.plus + '</svg></button>'
    return '<div class="song' + (playing ? ' is-playing' : '') + '" data-idx="' + index + '">' +
      '<div class="song__index' + (index < 3 && !tag ? ' is-top' : '') + '">' + (tag || (index + 1)) + '</div>' +
      '<div class="song__meta">' +
        '<div class="song__name">' + (song._tag ? '<span class="tag">' + esc(song._tag) + '</span>' : '') + esc(song.name || '未知曲目') + '</div>' +
        '<div class="song__sub">' + esc(song.singer || '群星') +
          (song.albumName ? '<span class="dot">·</span>' + esc(song.albumName) : '') + '</div>' +
      '</div>' +
      '<div class="song__acts">' + btn +
        '<button class="song__act" data-act="more" aria-label="更多操作">' +
          '<svg viewBox="0 0 24 24">' + ICON.more + '</svg></button>' +
      '</div>' +
    '</div>'
  }

  function bindSongRows(root, list, onPlay) {
    $$('.song', root).forEach(function (row) {
      var i = Number(row.dataset.idx)
      row.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-act="add"]')) {
          ev.stopPropagation()
          enqueueWithToast(list[i])
          return
        }
        if (ev.target.closest('[data-act="more"]')) {
          ev.stopPropagation()
          openSongSheet(list[i], list)
          return
        }
        if (onPlay) onPlay(i)
        else playSong(list[i], list)
      })
    })
    $$('img', root).forEach(imgFallback)
  }

  function bindRichRows(root, list) {
    $$('.song', root).forEach(function (row) {
      var i = Number(row.dataset.idx)
      row.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-act="add"]')) {
          ev.stopPropagation(); enqueueWithToast(list[i]); return
        }
        if (ev.target.closest('[data-act="more"]')) {
          ev.stopPropagation(); openSongSheet(list[i], list); return
        }
        playSong(list[i], list)
      })
    })
    $$('img', root).forEach(imgFallback)
  }

  /* ------------------------------ 抽屉 / 对话框 ------------------------------ */
  /**
   * 抽屉开合。
   *
   * closeSheet 是「先去掉 is-open，300ms 后（等动画走完）再 hidden」。
   * 如果这 300ms 内又被 openSheet 打开，那个 pending 的定时器会把刚打开的
   * 抽屉重新置成 hidden —— 表现是「点了一次没反应，再点才出来」。
   * 所以定时器要挂到元素上，重开时先取消。
   */
  function openSheet(el) {
    if (el.__closeTimer) { clearTimeout(el.__closeTimer); el.__closeTimer = 0 }
    el.hidden = false
    requestAnimationFrame(function () { el.classList.add('is-open') })
  }
  function closeSheet(el) {
    if (!el) return
    el.classList.remove('is-open')
    if (el.__closeTimer) clearTimeout(el.__closeTimer)
    el.__closeTimer = setTimeout(function () { el.__closeTimer = 0; el.hidden = true }, 300)
  }
  $$('[data-close]').forEach(function (m) {
    m.addEventListener('click', function () { closeSheet(m.closest('.sheet')) })
  })

  function openDrawer(title, html) {
    $('#drawerTitle').textContent = title
    $('#drawerBody').innerHTML = html
    openSheet($('#drawer'))
  }

  function dialog(opts) {
    var d = $('#dialog')
    $('#dialogTitle').textContent = opts.title || ''
    $('#dialogBody').innerHTML =
      (opts.message ? '<div class="dialog__msg">' + esc(opts.message) + '</div>' : '') +
      (opts.input !== undefined ? '<input class="input" id="dlgInput" style="margin-top:12px" value="' + esc(opts.input) + '" placeholder="' + esc(opts.placeholder || '') + '">' : '') +
      '<div class="dialog__acts">' +
        (opts.cancelText === null ? '' : '<button class="btn btn--ghost" data-dlg="cancel">' + esc(opts.cancelText || '取消') + '</button>') +
        '<button class="btn' + (opts.danger ? ' btn--danger' : '') + '" data-dlg="ok">' + esc(opts.okText || '确定') + '</button>' +
      '</div>'
    openSheet(d)
    var input = $('#dlgInput')
    if (input) setTimeout(function () { input.focus() }, 120)
    return new Promise(function (resolve) {
      function done(v) { closeSheet(d); resolve(v) }
      d.querySelectorAll('[data-dlg]').forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.dlg === 'ok') done(input ? input.value : true)
          else done(null)
        }
      })
    })
  }

  /* ============================ 歌曲操作面板 ============================ */
  var ICON = {
    play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
    next: '<path d="M6 5l9 7-9 7z" fill="currentColor" stroke="none"/><rect x="16" y="5" width="2.2" height="14" rx="1" fill="currentColor" stroke="none"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    down: '<path d="M12 4v11"/><path d="M7.6 10.6L12 15l4.4-4.4"/><path d="M5 19h14"/>',
    heart: '<path d="M12 20s-7-4.6-7-9.6A4.4 4.4 0 0 1 12 8a4.4 4.4 0 0 1 7 2.4c0 5-7 9.6-7 9.6z"/>',
    trash: '<path d="M5 7h14"/><path d="M10 7V5h4v2"/><path d="M8 7l1 12h6l1-12"/>',
    more: '<circle cx="12" cy="5.4" r="1.75" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/><circle cx="12" cy="18.6" r="1.75" fill="currentColor" stroke="none"/>'
  }

  function sheetAct(act, label, icon, extra) {
    return '<div class="menu-item" data-sact="' + act + '">' +
      '<svg viewBox="0 0 24 24">' + (ICON[icon] || '') + '</svg>' +
      '<div class="menu-item__text">' + esc(label) + '</div>' + (extra || '') + '</div>'
  }

  /** 歌曲操作面板：列表行尾的「⋯」和播放器里的按钮都走这里 */
  function openSongSheet(song, list) {
    if (!song) return
    var faved = !!P.favorites[song.id]
    openDrawer(song.name || '歌曲',
      '<div class="songsheet">' +
        '<img src="' + esc(coverSrc(song.img, 200)) + '" alt="" data-fb-skip>' +
        '<div class="songsheet__info">' +
          '<div class="songsheet__name">' + esc(song.name || '未知曲目') + '</div>' +
          '<div class="songsheet__sub">' + esc(song.singer || '群星') +
            (song.albumName ? '<span class="dot">·</span>' + esc(song.albumName) : '') + '</div>' +
        '</div>' +
      '</div>' +
      sheetAct('play', '立即播放', 'play') +
      sheetAct('next', '下一首播放', 'next') +
      sheetAct('queue', '加入播放队列', 'plus') +
      sheetAct('download', '下载到本机', 'down', '<span class="pill pill--brand">' + esc(P.quality) + '</span>') +
      sheetAct('fav', faved ? '取消收藏' : '收藏', 'heart') +
      sheetAct('playlist', '加入歌单', 'plus')
    )
    $$('#drawerBody img').forEach(imgFallback)
    var src = (list && list.length) ? list : (P.queue.length ? P.queue : [song])
    $$('#drawerBody [data-sact]').forEach(function (el) {
      el.addEventListener('click', function () {
        var act = el.dataset.sact
        closeSheet($('#drawer'))
        if (act === 'play') { playSong(song, src); return }
        if (act === 'next') { insertNext(song); return }
        if (act === 'queue') { enqueueWithToast(song); return }
        if (act === 'download') { downloadSongs([song]); return }
        if (act === 'fav') { toggleFavorite(song); return }
        if (act === 'playlist') { openAddToPlaylist(song); return }
      })
    })
  }

  /** 插到「正在播放的下一首」，而不是队尾 */
  function insertNext(song) {
    if (!song) return
    var at = P.index >= 0 ? P.index + 1 : P.queue.length
    P.queue.splice(at, 0, song)
    saveQueue()
    renderQueue()
    toast('已设为下一首播放')
  }

  function toggleFavorite(song) {
    if (!song) return
    var on = !!P.favorites[song.id]
    var req = on
      ? api('/favorite?id=' + encodeURIComponent(song.id), { method: 'DELETE' })
      : api('/favorite', { method: 'POST', body: { id: song.id } })
    req.then(function () {
      P.favorites[song.id] = !on
      var cur = currentSong()
      if (cur && cur.id === song.id) updateFavIcon(song)
      toast(on ? '已取消收藏' : '已收藏')
    }).catch(function (e) { toast('操作失败：' + e.message) })
  }

  /** 加入歌单面板（播放器按钮与歌曲面板共用同一份逻辑） */
  function openAddToPlaylist(song) {
    if (!song) return
    api('/playlists').then(function (d) {
      var list = d.list || []
      var newItem = '<div class="menu-item" data-plnew="1"><svg viewBox="0 0 24 24">' + ICON.plus + '</svg>' +
        '<div class="menu-item__text">新建歌单并加入</div></div>'
      openDrawer('加入歌单', (list.length ? list.map(function (pl) {
        return '<div class="menu-item" data-pl="' + esc(pl.id) + '">' +
          '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8"/></svg>' +
          '<div class="menu-item__text">' + esc(pl.name) + '</div></div>'
      }).join('') : '') + newItem)

      $$('[data-pl]').forEach(function (el) {
        el.addEventListener('click', function () {
          // 服务端参数名是 playlistId + songId（songId 就是搜索返回的那个编码 ID）
          api('/playlist/add', { method: 'POST', body: { playlistId: el.dataset.pl, songId: song.id } })
            .then(function (r) {
              closeSheet($('#drawer'))
              toast(r && r.added === 0 ? '这首歌已在歌单中' : '已加入歌单')
            })
            .catch(function (e) { toast('加入失败：' + e.message) })
        })
      })
      var nw = $('[data-plnew]')
      if (nw) nw.addEventListener('click', function () {
        closeSheet($('#drawer'))
        dialog({ title: '新建歌单', input: song.name || '我的歌单' }).then(function (name) {
          if (!name) return
          // 一次调用同时建单并放歌：服务端 /playlist 支持 songs 数组
          api('/playlist', { method: 'POST', body: { name: name, songs: [song.id] } })
            .then(function () { toast('已新建歌单并加入'); homeCache = null })
            .catch(function (e) { toast('失败：' + e.message) })
        })
      })
    }).catch(function (e) { toast('读取歌单失败：' + e.message) })
  }

  /* ============================ 歌曲下载 ============================ */
  /**
   * 下载走原生：页面在 file:// 源下既拿不到二进制响应（httpFetch 只回文本），
   * 也没法把文件写进系统音乐库。这里只负责「取地址 → 交给原生 → 收进度」。
   * 原生落盘位置：Android 10+ 是「音乐/云音乐」（MediaStore，无需存储权限）。
   */
  var DL = {}

  function downloadSupported() {
    return !!(window.YunBridge && window.YunBridge.downloadSong)
  }

  function extOf(quality) { return quality === 'flac' ? 'flac' : 'mp3' }

  function safeFileName(song, quality) {
    var base = (song.name || '未命名') + (song.singer ? ' - ' + song.singer : '')
    // 文件名里的非法字符全部换成下划线，否则 MediaStore 会拒绝写入
    base = base.replace(/[\\/:*?"<>|\r\n\t]/g, '_').replace(/\s+/g, ' ').trim()
    if (base.length > 80) base = base.slice(0, 80)
    return base + '.' + extOf(quality)
  }

  function activeDownloads() {
    return Object.keys(DL).map(function (k) { return DL[k] }).filter(function (d) {
      return d.state === 'running' || d.state === 'progress'
    })
  }

  function downloadSongs(songs) {
    if (!downloadSupported()) return toast('当前环境不支持下载，请更新客户端')
    var list = (songs || []).filter(Boolean)
    if (!list.length) return
    list.forEach(function (song) {
      var reqId = 'dl' + Date.now() + Math.random().toString(36).slice(2, 7)
      var fileName = safeFileName(song, P.quality)
      DL[reqId] = { reqId: reqId, song: song, fileName: fileName, percent: 0, bytes: 0, total: -1, state: 'running' }
      // fast=0：下载要拿真实音源，不要「快速试听」的短链
      api('/url?id=' + encodeURIComponent(song.id) + '&q=' + P.quality + '&fast=0')
        .then(function (r) {
          if (!r || !r.url) throw new Error('无可用下载地址')
          window.YunBridge.downloadSong(reqId, r.url, fileName)
        })
        .catch(function (e) {
          DL[reqId].state = 'error'
          DL[reqId].error = e.message
          toast('下载失败：' + e.message)
          renderDownloadsIfVisible(true)
        })
    })
    toast(list.length > 1 ? ('开始下载 ' + list.length + ' 首') : ('开始下载：' + list[0].name))
    renderDownloadsIfVisible(true)
  }

  function saveDownloaded(rec) {
    P.downloads = P.downloads.filter(function (d) { return d.id !== rec.id })
    P.downloads.unshift(rec)
    if (P.downloads.length > 500) P.downloads = P.downloads.slice(0, 500)
    store.set('ym.downloads', P.downloads)
  }

  /** 只从记录里摘掉，**不动**系统音乐库里的文件 —— 面板文案里已经写明 */
  function removeDownload(id) {
    if (!id) return
    P.downloads = P.downloads.filter(function (d) { return d.id !== id })
    store.set('ym.downloads', P.downloads)
  }

  /** 原生下载进度回调（YunBridge.notifyDownload 触发） */
  window.onNativeDownload = function (info) {
    if (!info || !info.reqId) return
    var d = DL[info.reqId]
    if (!d) return
    if (info.state === 'running' || info.state === 'progress') {
      d.state = 'progress'
      d.percent = typeof info.percent === 'number' ? info.percent : -1
      d.bytes = info.bytes || 0
      d.total = typeof info.total === 'number' ? info.total : -1
      renderDownloadsIfVisible(false)
      return
    }
    if (info.state === 'done') {
      d.state = 'done'
      saveDownloaded({
        id: d.song.id, name: d.song.name, singer: d.song.singer,
        img: d.song.img || '', quality: P.quality,
        path: info.path || '', bytes: info.bytes || 0,
        at: Date.now(), song: d.song
      })
      toast('已下载：' + (d.song.name || ''))
      setTimeout(function () { delete DL[info.reqId] }, 1200)
    } else if (info.state === 'cancelled') {
      delete DL[info.reqId]
      toast('已取消下载')
    } else {
      d.state = 'error'
      d.error = info.error || '下载失败'
      toast('下载失败：' + d.error)
      setTimeout(function () { delete DL[info.reqId] }, 2500)
    }
    renderDownloadsIfVisible(true)
  }

  function cancelDownload(reqId) {
    if (window.YunBridge && window.YunBridge.cancelDownload) window.YunBridge.cancelDownload(reqId)
    delete DL[reqId]
    renderDownloadsIfVisible(true)
  }

  function fmtBytes(n) {
    n = Number(n) || 0
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB'
    if (n >= 1024) return (n / 1024).toFixed(0) + ' KB'
    return n + ' B'
  }

  /** 只在「我的下载」页可见时刷新：进度只重画进行中区块，避免整页重排 */
  function renderDownloadsIfVisible(full) {
    if (parseHash().path !== '/downloads') return
    if (!full) {
      var box = $('#dlActive')
      if (box) { box.innerHTML = activeDownloadsHtml(); bindDownloadCancels() }
      return
    }
    route(true)
  }

  function activeDownloadsHtml() {
    var act = activeDownloads()
    if (!act.length) return ''
    return '<div class="dlgroup">' +
      '<div class="dlgroup__head">正在下载 ' + act.length + ' 首</div>' +
      act.map(function (d) {
        var pct = d.percent >= 0 ? d.percent : 0
        var label = d.percent >= 0 ? (pct + '%') : (fmtBytes(d.bytes) + ' / 未知大小')
        return '<div class="dlrow">' +
          '<div class="dlrow__top">' +
            '<div class="dlrow__name">' + esc(d.song.name || '未知曲目') + '</div>' +
            '<button class="dlrow__cancel" data-dlcancel="' + esc(d.reqId) + '">取消</button>' +
          '</div>' +
          '<div class="dlrow__sub">' + esc(d.song.singer || '群星') + '<span class="dot">·</span>' + esc(d.fileName) + '</div>' +
          '<div class="dlbar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="dlrow__pct">' + esc(label) + '</div>' +
        '</div>'
      }).join('') + '</div>'
  }

  function bindDownloadCancels() {
    $$('[data-dlcancel]').forEach(function (b) {
      b.addEventListener('click', function () { cancelDownload(b.dataset.dlcancel) })
    })
  }

  /** 播放已下载的本地文件；失败时自动退回在线播放 */
  function playDownloaded(rec) {
    if (!rec) return
    if (!rec.path) { toast('这条记录没有本地文件，改为在线播放'); playSong(rec.song, [rec.song]); return }
    var url = 'file://' + (rec.path.charAt(0) === '/' ? rec.path : '/' + rec.path)
    P.localSrc = true
    P.localFallback = rec.song || null
    try {
      audio.src = url
      renderPlayerMeta(rec.song || { name: rec.name, singer: rec.singer, img: rec.img })
      applySource('local')
      setLyricLoading()
      showMini(true)
      clearPlayWatch()
      P.errStreak = 0
      P.progressMark = 0
      P.resumePos = 0
      playAudio(function () { toast('点击播放按钮开始播放') })
      armPlayWatch()
    } catch (e) {
      P.localSrc = false
      toast('本地文件无法播放，改为在线播放')
      playSong(rec.song, [rec.song])
    }
  }

  /* ------------------------------ 路由 ------------------------------ */
  var view = $('#view')

  }

  var TAB_OF = {
    '/': 'home', '/charts': 'home', '/chart': 'home', '/album': 'home', '/ai': 'home', '/daily': 'home',

    var tab = TAB_OF[path] || ''
    $$('.tabbar__item').forEach(function (a) { a.classList.toggle('is-active', a.dataset.tab === tab) })
    $('#app').classList.toggle('is-subpage',
      ['/search', '/playlist', '/chart', '/album', '/settings', '/history', '/about', '/downloads'].indexOf(path) >= 0)

    '/mine': pageMine,
    '/settings': pageSettings,
    '/about': pageAbout,

  function route(force) {
    var r = parseHash()
    markTab(r.path)
    /*
     * 每次换页都把原生顶栏校准一次：只要播放器没开着，顶栏就必须是显示的。
     *
     * 兜的是「某条路径把顶栏藏了却没恢复」——顶栏一消失，WebView 就顶到 y=0
     * （窗口是边到边的），当前页最上面那条 sticky 的栏（搜索框、二级页标题…）
     * 会落进状态栏底下，看着像「跑到最顶部」，点上去被系统状态栏吃掉。
     * 换页是用户必经的动作，在这里校准一次，代价是一次原生调用，
     * 换来的是「不可能长期卡在错的状态」。
     */
    if (!playerOpen) setChromeHidden(false)
    var fn = ROUTES[r.path] || pageHome
    var myToken = ++routeToken
    view.scrollTop = 0
    try {
      fn(r, myToken)
    } catch (e) {
      view.innerHTML = errorBlock(e && e.message)
    }
    // 同步渲染出来的封面立刻接上缓存；异步补进来的由 startCoverWarm 的观察者兜住
    warmCovers(view)

  /** 榜单卡片头图升级：把纯色块换成榜首专辑封面（分批，避免首屏被卡住） */
  function upgradeChartCovers(charts) {
    var els = $$('[data-chart]').filter(function (el) { return !el.dataset.headDone })
    if (!els.length) return
    var refs = els.map(function (el) { return el.dataset.chart })
    var chunks = []
    for (var i = 0; i < refs.length; i += 8) chunks.push(refs.slice(i, i + 8))
    ;(function step() {
      if (!chunks.length) return
      var chunk = chunks.shift()
      api('/chart-covers?ids=' + encodeURIComponent(chunk.join(',')))
        .then(function (res) {
          var covers = (res && res.covers) || {}
          els.forEach(function (el) {
            var head = covers[el.dataset.chart]
            if (!head || !head.cover) { el.dataset.headDone = '1'; return }
            var img = $('.card__cover img', el)
            if (img) { img.dataset.fb = ''; img.src = coverSrc(head.cover, 300) }
            var sub = $('.card__sub', el)
            if (sub) {
              var who = [head.artist, head.song].filter(Boolean).join(' · ')
              if (who) { sub.textContent = '#1 ' + who; sub.hidden = false }
            }
            el.dataset.headDone = '1'
          })
        })
        .catch(function () {})
        .then(step)
    })()
  }

  /* ============================ AI 歌单 ============================ */
  /**
   * AI 歌单。
   *
   * 快捷入口指向 `#/ai`，但 ROUTES 里根本没有这条路由 —— 于是被兜底成首页，
   * 表现就是「点了没反应、点不开」。这里补上真正的页面。
   *
   * ⚠ 服务端是**两段式**的，别把它当成一段：
   *   `POST /ai-playlist` 只回「歌名 + 歌手」清单（`{name, singer}`），
   *   **没有 id、没有封面、没有 source** —— 因为逐首搜歌太慢，塞进一个请求里
   *   会被网关掐断（见 api.js 里 /ai-playlist 的注释）。
   *   真正的曲目要客户端拿歌名去 `GET /suggest` 逐首匹配出来。
   *
   * 早先这里跳过了匹配这一步，直接拿 `{name, singer}` 当曲目渲染、并且
   * 用 `songs.map(s => s.id)`（全是 undefined）去 `POST /playlist` ——
   * 服务端 `decodeSongId(s.id || s)` 对 null 取属性直接抛，
   * 于是用户看到的就是「保存失败」，列表里的歌也点不动。
   */
  var AI_SEEDS = [
    '适合深夜写代码的歌', '90 年代粤语金曲', '开车时听的中文摇滚',
    '像《晴天》那样干净的民谣', '通勤路上提神的电子乐'
  ]
  /**
   * AI 歌单任务 —— **后台任务，不绑页面**。
   *
   * 用户的要求是「输入关键词之后后台生成，直接存起来」：
   * 点一下就撒手，生成 → 逐首匹配 → 落库全在后台跑完，用户可以先去做别的，
   * 完成时弹一句提示，歌单已经在「我的 → 歌单」里了。
   * 所以状态放在这里而不是页面里 —— 页面被销毁（切走、返回）任务也不会断。
   */
  var aiJob = {
    running: false,
    phase: 'idle',          // idle | gen | match | save | done | error
    prompt: '', count: 20,
    done: 0, total: 0, current: '',
    title: '', matched: null, misses: [], savedName: '', error: ''
  }

  function aiPhaseText() {
    if (aiJob.phase === 'gen') return 'AI 正在出歌单，通常需要几十秒…'
    if (aiJob.phase === 'match') return '歌单已生成，正在逐首匹配音源… ' + (aiJob.done + 1) + ' / ' + aiJob.total
    if (aiJob.phase === 'save') return '正在存入歌单…'
    return ''
  }

  /**
   * 把任务状态画到页面上。
   * ⚠ 只在 AI 页开着的时候动 DOM：用户切走之后 `#aiBody` 不存在，
   * 任务照跑但不再碰界面，完成时靠 toast 通知。
   */
  function aiPaint() {
    var box = $('#aiBody')
    if (!box) return
    var btn = $('#aiGo')
    if (btn) {
      btn.disabled = aiJob.running
      btn.textContent = aiJob.running
        ? (aiJob.phase === 'match' ? '匹配中 ' + (aiJob.done + 1) + '/' + aiJob.total + '…' : '生成中…')
        : ((aiJob.matched && aiJob.matched.length) ? '再生成一份' : '生成并存入歌单')
    }
    if (aiJob.phase === 'error') { box.innerHTML = errorBlock(aiJob.error); return }
    if (aiJob.running) {
      box.innerHTML =
        '<div class="empty"><span class="spinner spinner--dark"></span>' +
        '<div class="empty__desc" style="margin-top:12px">' + esc(aiPhaseText()) + '</div>' +
        (aiJob.phase === 'match' && aiJob.current
          ? '<div class="empty__desc" style="margin-top:6px">当前：' + esc(aiJob.current) + '</div>' : '') +
        '<div class="empty__desc" style="margin-top:10px">可以先去做别的，生成完会自动存进歌单</div></div>'
      return
    }
    if (aiJob.matched && aiJob.matched.length) {
      renderAiResult(aiJob.matched, aiJob.misses, aiJob.title, aiJob.savedName)
    } else {
      box.innerHTML = ''
    }
  }

  function pageAi(r, myToken) {
    view.innerHTML = pageHeadHtml('AI 歌单') +
      '<div class="block">' +
        '<div class="note" style="margin-bottom:12px">写一句话就能生成歌单：AI 出清单 → 自动在音源里逐首匹配 → <b>直接存成歌单</b>。生成期间可以先去做别的。</div>' +
        '<div class="field">' +
          '<div class="field__label">想要什么样的歌单</div>' +
          '<input class="input" id="aiPrompt" placeholder="例如：适合雨天听的慢歌" value="' + esc(aiJob.prompt) + '">' +
        '</div>' +
        '<div class="field">' +
          '<div class="field__label">生成数量（1~100）</div>' +
          '<input class="input" id="aiCount" type="number" min="1" max="100" value="' + aiJob.count + '">' +
        '</div>' +
        '<button class="btn btn--block" id="aiGo" style="margin-top:8px">生成并存入歌单</button>' +
      '</div>' +
      '<div class="chips" id="aiSeeds">' + AI_SEEDS.map(function (s) {
        return '<span class="chip" data-seed="' + esc(s) + '">' + esc(s) + '</span>'
      }).join('') + '</div>' +
      '<div id="aiBody"></div>'
    bindBack()

    var input = $('#aiPrompt')
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { input.blur(); runAi() } })
    $('#aiGo').addEventListener('click', runAi)
    $('#aiSeeds').addEventListener('click', function (e) {
      var c = e.target.closest('[data-seed]')
      if (!c) return
      input.value = c.dataset.seed
      runAi()
    })

    if (aiJob.matched || aiJob.running) aiPaint()
  }

  /**
   * 把「歌名 + 歌手」逐首匹配成可播放的曲目。
   *
   * 走 `/suggest` 而不是 `/search`：前者**不写搜索历史** —— 一次批量匹配会在
   * 用户历史里刷进几十条噪音；而且每首一个短请求，进度能实时画出来。
   * 匹配不上的只记下来告诉用户，不混进歌单。
   */
  function matchSongsBySearch(songs, onProgress) {
    var matched = [], misses = []
    var i = 0
    return new Promise(function (resolve) {
      function step() {
        if (i >= songs.length) return resolve({ matched: matched, misses: misses })
        var item = songs[i] || {}
        if (onProgress) onProgress(i, songs.length, item)
        var q = item.singer ? (item.name + ' ' + item.singer) : item.name
        api('/suggest?q=' + encodeURIComponent(q))
          .then(function (r) {
            var hit = (r && r.list && r.list[0]) || null
            if (hit && hit.id) matched.push(hit)
            else misses.push(item.name)
          })
          .catch(function () { misses.push(item.name) })
          .then(function () { i++; step() })
      }
      step()
    })
  }

  /**
   * 点「生成并存入歌单」→ 起一个**后台任务**。
   *
   * 全流程：POST /ai-playlist（只回歌名+歌手）→ 逐首 GET /suggest 匹配出真曲目
   * → POST /playlist 直接落库 → toast 通知。
   * 每一步只更新 aiJob 状态并 aiPaint()，**不依赖页面还开着**。
   */
  function runAi() {
    var el = $('#aiPrompt')
    var prompt = (el && el.value || '').trim()
    if (!prompt) return toast('先写一句你想要什么样的歌单')
    if (aiJob.running) return toast('上一份还在生成，稍等一下')
    var cntEl = $('#aiCount')
    var count = Math.max(1, Math.min(Number(cntEl && cntEl.value) || 20, 100))
    startAiJob(prompt, count)
  }

  function startAiJob(prompt, count) {
    aiJob.running = true
    aiJob.phase = 'gen'
    aiJob.prompt = prompt
    aiJob.count = count
    aiJob.done = 0
    aiJob.total = count
    aiJob.current = ''
    aiJob.title = ''
    aiJob.matched = null
    aiJob.misses = []
    aiJob.savedName = ''
    aiJob.error = ''
    aiPaint()

    // 第一步：AI 出清单（只有歌名+歌手，服务端就只做这一件事，请求短、不易被掐断）
    api('/ai-playlist', { method: 'POST', body: { prompt: prompt, count: count }, timeout: 200000 })
      .then(function (res) {
        var raw = (res && res.songs) || []
        if (!raw.length) throw new Error('AI 未能生成有效歌单，请换个描述试试')
        aiJob.title = res.title || 'AI 歌单'
        // 第二步：逐首匹配音源（不匹配出 id 就既播不了也存不了）
        aiJob.phase = 'match'
        aiJob.total = raw.length
        aiJob.done = 0
        aiPaint()
        return matchSongsBySearch(raw, function (i, n, item) {
          aiJob.done = i
          aiJob.total = n
          aiJob.current = item.name + (item.singer ? ' - ' + item.singer : '')
          aiPaint()
        })
      })
      .then(function (r) {
        aiJob.misses = r.misses
        aiJob.matched = r.matched
        if (!r.matched.length) {
          aiJob.running = false
          aiJob.phase = 'error'
          aiJob.error = '生成的曲目在音源里一首都没搜到，换个描述再试试'
          aiPaint()
          return
        }
        // 第三步：直接落库 —— 用户要的就是「直接存起来」，不再让人手点一次「存为歌单」
        aiJob.phase = 'save'
        aiPaint()
        var name = String(aiJob.title || 'AI 歌单').slice(0, 40)
        // songs 是 /suggest 回来的**完整曲目对象**（带 id），服务端 decodeSongId(s.id || s) 直接用
        return api('/playlist', { method: 'POST', body: { name: name, songs: r.matched } })
          .then(function () {
            aiJob.savedName = name
            homeCache = null                     // 首页 / 我的页的歌单列表要重新拉
            toast('已生成并存入歌单：' + name)
          })
          .catch(function (e) {
            // 存库失败不该把已经生成好的列表藏起来 —— 提示一句，列表留着让用户自己看
            toast('歌单已生成，但自动存库失败：' + ((e && e.message) || '未知错误'))
          })
          .then(function () {
            aiJob.running = false
            aiJob.phase = 'done'
            aiPaint()
          })
      })
      .catch(function (e) {
        aiJob.running = false
        aiJob.phase = 'error'
        aiJob.error = (e && e.message) || '生成失败'
        aiPaint()
        toast('AI 歌单生成失败：' + aiJob.error)
      })
  }

  function pushSearchHistory(q) {
    if (!q) return
    var hist = (store.get(HISTORY_KEY, []) || []).filter(function (x) { return x !== q })

    store.set(HISTORY_KEY, hist.slice(0, 12))
  }

  function doSearch() {
    var q = $('#searchInput').value.trim()
    if (!q) return toast('请输入搜索关键词')

  function runSearch() {
    var body = $('#searchBody')

    api(url).then(function (data) {
      searchState.loading = false
      searchState.list = data.list || []
      searchState.total = data.total || searchState.list.length

  /**

   * 早先只读 `count`，于是列表里每个歌单都显示「0 首」—— 看起来就像歌曲全丢了。
   */
  function songCountOf(pl) {
    if (!pl) return 0
    if (typeof pl.song_count === 'number') return pl.song_count
    if (typeof pl.songCount === 'number') return pl.songCount
    if (typeof pl.count === 'number') return pl.count
    if (pl.songs && pl.songs.length) return pl.songs.length
    return 0
  }

      var pl = data.playlist || {}

      var cover = pl.cover || (list[0] && list[0].img) || ''
      $('.pagehead__title').textContent = pl.name || '歌单'
      $('#plBody').innerHTML =
        '<div class="detailhero">' +
          '<div class="detailhero__cover"><img src="' + esc(coverSrc(cover, 300)) + '" alt=""></div>' +
          '<div class="detailhero__info">' +
            '<div class="detailhero__name">' + esc(pl.name || '歌单') + '</div>' +

            '</div>' +
          '</div>' +
        '</div>' +

            }).join('') + '</div>'
          : emptyBlock('歌单还是空的', '在歌曲列表里点歌曲右侧的「＋」即可加入歌单'))

      $$('.detailhero__cover img').forEach(imgFallback)
      bindPlayAll($('#plBody'), list)
      if (list.length) bindRichRows($('#plList'), list)

      // 歌单内移除单曲：服务端按「下标」定位（remove-song 收 playlistId + index）
      $$('#plList [data-act="remove"]').forEach(function (btn) {
        btn.addEventListener('click', function (ev) {
          ev.stopPropagation()
          var i = Number(btn.closest('.song').dataset.idx)
          var target = list[i]
          if (!target) return
          dialog({ title: '移出歌单', message: '把「' + (target.name || '') + '」从本歌单移除？', okText: '移除', danger: true })
            .then(function (ok) {
              if (!ok) return
              api('/playlist/remove-song', { method: 'POST', body: { playlistId: id, index: i } })
                .then(function () { toast('已移出歌单'); route(true) })
                .catch(function (e) { toast('移除失败：' + e.message) })
            })
        })
      })

      var rn = $('[data-plrename]')
      if (rn) rn.addEventListener('click', function () {
        dialog({ title: '重命名歌单', input: pl.name || '' }).then(function (n) {
          if (!n) return
          // 服务端参数名是 playlistId（不是 id）
          api('/playlist/rename', { method: 'POST', body: { playlistId: id, name: n } })
            .then(function () { toast('已重命名'); route(true) })
            .catch(function (e) { toast('失败：' + e.message) })
        })
      })
      var dl = $('[data-pldel]')
      if (dl) dl.addEventListener('click', function () {
        dialog({ title: '删除歌单', message: '确定删除「' + (pl.name || '') + '」？此操作不可恢复。', okText: '删除', danger: true })
          .then(function (ok) {
            if (!ok) return
            api('/playlist?id=' + encodeURIComponent(id), { method: 'DELETE' })
              .then(function () { toast('已删除'); location.hash = '#/library' })
              .catch(function (e) { toast('失败：' + e.message) })
          })
      })
    }).catch(function (e) {
      if (myToken !== routeToken) return
      $('#plBody').innerHTML = errorBlock(e.message)
    })
  }

  /* ============================ 播放历史（本地） ============================ */
  function pushHistory(song) {
    if (!song || !song.id) return
    var h = (store.get('ym.history', []) || []).filter(function (s) { return s.id !== song.id })
    h.unshift({
      id: song.id, name: song.name, singer: song.singer, albumName: song.albumName,
      img: song.img, source: song.source, sourceName: song.sourceName,
      interval: song.interval, ts: Date.now()
    })
    store.set('ym.history', h.slice(0, 100))
  }

          }).join('') + '</div></div>' +

            '<span class="chip" id="lyrMinus">− 提前 0.2s</span>' +
            '<span class="chip" id="lyrVal">同步</span>' +
            '<span class="chip" id="lyrPlus">+ 延后 0.2s</span>' +
          '</div></div>' +

  function renderSettingsLyric() {
    var v = $('#lyrVal')

  /** 当前线路缺账号密码时，在设置页顶上给一条明确的横幅，而不是让用户去猜为什么登录失败 */
  function renderCfgWarn() {
    var box = $('#cfgWarn')
    if (!box) return
    var line = cfg.active === 1 ? cfg.line2 : cfg.line1
    var miss = !line || !line.url ? '地址' : ((!line.user || !line.pass) ? '账号密码' : '')
    if (!miss) { box.innerHTML = ''; return }
    box.innerHTML = '<div class="note" style="margin-bottom:12px;color:var(--brand)">' +
      '当前线路（' + esc((line && line.name) || '未命名') + '）还没填' + miss +
      '，填写并保存后即可正常登录。</div>'
  }

  function renderLineCards() {
    var box = $('#lineCards')
    if (!box) return
    var lines = [
      { i: 0, name: cfg.line1.name, url: cfg.line1.url, ready: !!(cfg.line1.user && cfg.line1.pass) },
      { i: 1, name: cfg.line2.name, url: cfg.line2.url, ready: !!(cfg.line2.user && cfg.line2.pass) }
    ]
    box.innerHTML = lines.map(function (l) {
      var on = cfg.active === l.i
      return '<div class="linecard" style="box-shadow:none;border:1px solid ' + (on ? 'var(--brand)' : 'var(--line)') + '">' +
        '<div class="linecard__top">' +
          '<span class="linecard__dot' + (on ? ' is-on' : '') + '"></span>' +
          '<span class="linecard__name">' + esc(l.name || ('线路' + (l.i + 1))) + '</span>' +
          (on ? '<span class="pill pill--ok">当前使用</span>' : '<span class="pill">备用</span>') +
          (l.ready ? '' : '<span class="pill" style="color:var(--brand)">缺账号</span>') +
        '</div>' +
        '<div class="linecard__url">' + esc(l.url || '未配置') + '</div>' +
        '<div class="linecard__acts">' +
          '<button class="miniplay-btn' + (on ? '' : ' miniplay-btn--ghost') + '" data-switch="' + l.i + '">' +
            (on ? '已启用' : '切换到该线路') + '</button>' +
          '<button class="miniplay-btn miniplay-btn--ghost" data-test="' + l.i + '">测速</button>' +
        '</div></div>'
    }).join('')

    $$('[data-switch]', box).forEach(function (b) {
      b.addEventListener('click', function () { switchLine(Number(b.dataset.switch)) })
    })
    $$('[data-test]', box).forEach(function (b) {
      b.addEventListener('click', function () { testLine(Number(b.dataset.test), b) })
    })
  }

  function switchLine(idx) {
    if (window.YunBridge && window.YunBridge.switchLine) {
      try {
        var raw = window.YunBridge.switchLine(idx)
        if (raw) cfg = JSON.parse(raw)
      } catch (e) { /* 用本地状态兜底 */ }
    } else {
      cfg.active = idx
      cfg.activeUrl = idx === 0 ? cfg.line1.url : cfg.line2.url
      cfg.activeName = idx === 0 ? cfg.line1.name : cfg.line2.name
    }
    token = ''; store.del('ym.token')
    homeCache = null
    renderLineCards()
    fillCfgInputs()
    toast('已切换至 ' + (cfg.activeName || ('线路' + (idx + 1))))
    ensureLogin(true).catch(function () {})
    if (parseHash().path === '/settings') route(true)
    else route(true)
  }

  function testLine(idx, btn) {
    var url = idx === 0 ? $('#cfg1url').value.trim() : $('#cfg2url').value.trim()
    if (!url) return toast('请先填写地址')
    var old = btn.textContent
    btn.textContent = '测速中…'
    var t0 = Date.now()
    nativeHttp(url.replace(/\/+$/, '') + '/api/version', 'GET', {}, '', 15000)
      .then(function (res) {
        var cost = Date.now() - t0
        if (res.status >= 200 && res.status < 400) toast('连接正常 · ' + cost + 'ms')
        else toast('响应异常 HTTP ' + res.status + ' · ' + cost + 'ms')
      })
      .catch(function (e) { toast('连接失败：' + e.message) })
      .then(function () { btn.textContent = old })
  }

  function fillCfgInputs() {
    var f = function (id, v) { var el = $(id); if (el) el.value = v || '' }
    f('#cfg1url', cfg.line1 && cfg.line1.url)
    f('#cfg1user', cfg.line1 && cfg.line1.user)
    f('#cfg1pass', cfg.line1 && cfg.line1.pass)

    if (window.YunBridge && window.YunBridge.saveDualConfig) {
      try {
        var raw = window.YunBridge.saveDualConfig(v1u, v1n, v1p, v2u, v2n, v2p, cfg.active)
        if (raw) cfg = JSON.parse(raw)
      } catch (e) { toast('保存异常：' + e.message); return }
    } else {
      cfg.line1 = { name: cfg.line1.name, url: v1u, user: v1n, pass: v1p }
      cfg.line2 = { name: cfg.line2.name, url: v2u, user: v2n, pass: v2p }
      cfg.activeUrl = cfg.active === 0 ? v1u : v2u
    }
    token = ''; store.del('ym.token'); homeCache = null
    renderLineCards()
    renderCfgWarn()
    fillCfgInputs()
    toast('双线路配置已保存并生效')
    ensureLogin(true).catch(function (e) {

  var MODE_PATH = {
    order: '<path d="M4 6h13M4 12h13M4 18h9"/>',
    loop: '<path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11.5V10a3.5 3.5 0 0 1 3.5-3.5h13.2"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 12.5V14a3.5 3.5 0 0 1-3.5 3.5H3.8"/>',
    single: '<path d="M17 2.5l3.5 3.5L17 9.5"/><path d="M3.5 11.5V10a3.5 3.5 0 0 1 3.5-3.5h13.2"/><path d="M7 21.5L3.5 18 7 14.5"/><path d="M20.5 12.5V14a3.5 3.5 0 0 1-3.5 3.5H3.8"/><path d="M11.2 10.6l1.6-.9v4.6"/>',
    random: '<path d="M16 3.2h5v5"/><path d="M21 3.2L3.6 20.6"/><path d="M21 15.8v5h-5"/><path d="M15.2 15.2l5.8 5.6"/><path d="M3.6 3.4l5.6 5.4"/>'
  }

  /* ============================ 进度条拖拽 ============================ */
  var seeking = false
  var seekingAt = 0
  function progressRatio(clientX) {
    var rect = $('#progressRange').getBoundingClientRect()
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width))
  }
  function paintProgress(ratio) {
    $('#progressFill').style.width = (ratio * 100) + '%'
    $('#progressThumb').style.left = (ratio * 100) + '%'
  }
  ;(function bindSeek() {
    var range = $('#progressRange')
    var lastTouchEnd = 0
    function down(e) {
      // Android WebView 在 touchend 之后还会补一对兼容 mouse 事件（mousedown/mouseup），
      // 会把刚刚清掉的 seeking 又立起来；紧随其后的那次 mousedown 直接忽略。
      if (e && e.type === 'mousedown' && Date.now() - lastTouchEnd < 600) return
      seeking = true
      seekingAt = Date.now()
      var r = progressRatio((e.touches ? e.touches[0] : e).clientX)
      paintProgress(r)
    }
    function move(e) {
      if (!seeking) return
      e.preventDefault()
      paintProgress(progressRatio((e.touches ? e.touches[0] : e).clientX))
    }
    function up(e) {
      if (!seeking) return
      seeking = false
      var pt = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || e
      if (pt && typeof pt.clientX === 'number') {
        var r = progressRatio(pt.clientX)
        if (audio.duration) audio.currentTime = r * audio.duration
      }
    }
    range.addEventListener('touchstart', down, { passive: true })
    range.addEventListener('touchmove', move, { passive: false })
    range.addEventListener('touchend', function (e) { lastTouchEnd = Date.now(); up(e) })
    // 手势被系统抢走（来电、下拉通知栏）时只有 touchcancel，不接住 seeking 会永久卡住
    range.addEventListener('touchcancel', function (e) { lastTouchEnd = Date.now(); up(e) })
    range.addEventListener('mousedown', down)
    window.addEventListener('mousemove', move)
    window.addEventListener('mouseup', up)
  })()

  /* ============================ 音频事件 ============================ */
  audio.addEventListener('timeupdate', function () {
    var cur = audio.currentTime || 0
    var total = audio.duration || 0
    // seeking 卡住的兜底：正常拖拽不会超过 5 秒，超了就是 up 没跑到，
    // 不清理的话进度条与时间会**永久定格**（看着就像「没有进度」）
    if (seeking && Date.now() - seekingAt > 5000) seeking = false
    if (!seeking) {
      $('#curTime').textContent = fmtTime(cur)
      $('#totalTime').textContent = fmtTime(total)
      if (total > 0) {
        paintProgress(cur / total)
        $('#miniProgress').firstElementChild.style.width = (cur / total * 100) + '%'
      }
    }
    // 「这一首是活的」只能由**真实进度**证明。不要在 play/playing 里清零 errStreak ——
    // 起播即失败时 play 照样会派发，清零就等于把兜底保护废掉，
    // 结果是 error → 下一首 → error 无限打转，界面看起来就是「假死」。
    if (cur > (P.progressMark || 0) + 0.5) { P.progressMark = cur; P.errStreak = 0 }
    syncLyric(cur)
    // 每 5 秒把进度补给系统一份，纠正锁屏进度条的累计漂移
    syncMediaProgress()
  })
  audio.addEventListener('play', function () { updatePlayIcon(true); startLyricLoop() })
  audio.addEventListener('playing', function () { startLyricLoop() })
  audio.addEventListener('pause', function () { clearPlayWatch(); updatePlayIcon(false); stopLyricLoop() })
  // 重新解析 / 兜底切流之后回到原来的位置，别让用户从 0 秒重听
  audio.addEventListener('loadedmetadata', function () {
    if (P.resumePos > 0 && isFinite(P.resumePos)) {
      try { audio.currentTime = P.resumePos } catch (e) { }
    }
    P.resumePos = 0
    // 到这里才知道总时长，补一份给锁屏，否则锁屏上时长/进度条是空的
    lastMediaSync = Date.now()
    syncMedia()
  })
  // 拖动进度条之后立刻按新位置重摆歌词：暂停状态下 rAF 循环是停的
  audio.addEventListener('seeked', function () { realignLyric(); lastMediaSync = Date.now(); syncMedia() })
  audio.addEventListener('ended', function () { clearPlayWatch(); playNext() })
  audio.addEventListener('error', function () {
    if (!audio.src) return
    clearPlayWatch()
    // 本地下载文件读不出来（分区存储限制等）→ 退回在线播放，而不是当作播放失败跳下一首
    if (P.localSrc) {
      var fb = P.localFallback
      P.localSrc = false; P.localFallback = null
      toast('本地文件无法播放，改为在线播放')
      if (fb) playSong(fb, [fb])
      return
    }
    /*
     * ① 先换**下一条候选直链** —— 这是「跳歌」的正解。
     *
     * 服务端 /url 一次给一串候选（不同插件 / 官方直链解出来的地址，已排序）。
     * 以前这里直接走 playNext：把「这个源不行」误判成「这首歌不行」，
     * 于是整首歌被跳过 —— 用户看到的就是「中间有歌曲没有播放，跳过去」。
     * 同一首歌往往有五六个源，换一条继续放才是对的。
     */
    if (P.candIndex >= 0 && P.candIndex + 1 < (P.cands || []).length) {
      var pos = (isFinite(audio.currentTime) && audio.currentTime > 2) ? audio.currentTime : 0
      P.resumePos = pos
      useCandidate(P.candIndex + 1, true)
      return
    }
    // ② 候选都试完了 → 退服务端代理流（同源，规避防盗链），每首只退一次
    if (!P.triedProxy && useProxyStream(true)) return
    // ③ 真的没辙了：连续失败兜底。整队列音源都失效时，不能无休止地「自动下一首」
    P.errStreak = (P.errStreak || 0) + 1
    if (P.errStreak > 3) { P.errStreak = 0; toast('多个音源均无法播放，请切换线路后重试'); return }
    // 单曲循环下**绝对不能**走 playNext —— 它会把 currentTime 归零再放同一个坏地址，
    // error → playNext → error 就是死循环，CPU 打满、界面假死
    if (P.mode === 'single') { toast('当前音源无法播放，请切换线路后重试'); return }
    toast('播放出错，尝试下一首')
    setTimeout(playNext, 600)
  })

  /* ============================ 歌词校准按钮 ============================ */
  $('#lyricCalMinus').addEventListener('click', function () { bumpLyricDelay(-LYRIC_STEP) })
  $('#lyricCalPlus').addEventListener('click', function () { bumpLyricDelay(LYRIC_STEP) })
  $('#lyricCalVal').addEventListener('click', function () {
    lyricDelay = 0; store.set('ym.lyricDelay', 0); updateLyricCal(); P.lineIndex = -1; syncLyric(audio.currentTime || 0)
  })

  /* ============================ 原生回调注入 ============================ */
  window.nativeTogglePlay = togglePlay
  window.nativeNextTrack = playNext
  window.nativePrevTrack = playPrev

  /**
   * 锁屏 / 控制中心 / 蓝牙耳机传来的「要播」或「要停」。
   *
   * ⚠ 这里传的是**目标状态**而不是「切换」：系统可能因为蓝牙重连、
   * 或用户连点而重复派发同一个动作，做成切换就会出现
   * 「按一次暂停，结果它又播起来了」。所以先比对当前状态，一样就什么都不做。
   */
  window.nativeSetPlaying = function (want) {
    try {
      var w = !!want
      if (w === !audio.paused) return
      if (w) {
        // 和用户点播放键走同一条路：清掉熔断计数，重新解析音源再放
        P.errStreak = 0
        P.resumePos = audio.currentTime || P.resumePos || 0
        playAudio(function () { loadCurrent(true) })
        armPlayWatch()
      } else {
        P.lastPos = audio.currentTime || 0
        audio.pause()
      }
    } catch (e) { }
  }

  /** 锁屏 / 控制中心拖动进度条。系统给的是毫秒，网页用秒。 */
  window.nativeSeekTo = function (ms) {
    try {
      var s = Number(ms) / 1000
      if (!isFinite(s) || s < 0) return
      var total = audio.duration
      if (isFinite(total) && total > 0 && s > total) s = total
      P.resumePos = s
      P.progressMark = s
      audio.currentTime = s
      syncLyric(s, true)
    } catch (e) { }
  }

  window.handleAppBack = function () {
    if (!$('#dialog').hidden) { closeSheet($('#dialog')); return 'handled' }
    if (!$('#drawer').hidden) { closeSheet($('#drawer')); return 'handled' }
    if (!$('#queueSheet').hidden) { closeSheet($('#queueSheet')); return 'handled' }
    if (!$('#player').hidden) { closePlayer(); return 'handled' }
    if (parseHash().path !== '/') { location.hash = '#/'; return 'handled' }
    return 'default'
  }

  /* ============================ 启动 ============================ */
  function boot() {
    readNativeConfig()
    $('#qualityLabel').textContent = P.quality
    $('#modeIcon').innerHTML = MODE_PATH[P.mode]
    updateLyricCal()
    if (P.queue.length) {
      showMini(true)
      $('#miniTitle').textContent = P.queue[0].name || ''
      $('#miniArtist').textContent = P.queue[0].singer || ''
      $('#miniCover').style.backgroundImage = 'url("' + coverSrc(P.queue[0].img, 200) + '")'
    }
    route()
    ensureLogin().then(function () {
      if (parseHash().path === '/mine') route(true)
    }).catch(function (e) {
      // 「还没填账号密码」不是登录失败，是还没配置 —— 别给它套「登录失败」的壳
      toast(e && e.needSetup ? e.message : ('登录失败：' + (e && e.message || '未知错误')))
    })
    api('/favorites').then(function (d) {
      (d.list || []).forEach(function (s) { P.favorites[s.id] = true })
    }).catch(function () {})
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot)
  else boot()
})()
</script>
